      bounded assignment, absolute worktree, inputs, evidence paths and result
      contract. Copy the complete applicable Test-Driven Development section
      (including Writing Good Tests) and filled Implementer Subagent Prompt Template
      into every worker's instruction. For reviewers copy the selected complete
      reviewer template and Review result contract. Section references or inherited
      context alone are insufficient with context_depth="none". Keep exact task
      values in the Bash-generated brief and supply the whole request in the dispatch
