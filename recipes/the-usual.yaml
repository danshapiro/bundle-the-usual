      # Writing Plans

      Handle routine, reversible decisions without stopping. A blocker is a problem
      that remains after reasonable investigation and safe alternatives leave no
      way to complete this stage as requested. Record the blocker and return it to
      the dispatcher. User contact belongs to the dispatcher and is reserved for
      situations where continuing risks data loss, environmental corruption,
      security or privacy harm, large unexpected cost, or comparable serious
      damage.

      ## Overview

      Write implementation plans for an engineer who has not seen this codebase or this spec. Assume they write idiomatic code in the project's language once they know the exact interface and the exact test, and that they will make a reasonable choice wherever the plan leaves one open. What they cannot know is what you decided: which files, which names and signatures, which values from the spec, which tests prove each task. Document those. Give them the whole plan as bite-sized tasks. DRY. YAGNI. TDD. Frequent commits.

      **Announce at start:** Use the mandatory Stage 1 banner above.

      **Context:** Consume the caller's workspace values and complete current `## User Request` through [Bundle Interface](#bundle-interface). The current User Request governs the goal, architecture, decomposition, tasks, tests, and amendments; specifications and repository evidence supply supporting detail. Apply [Scope Policy](#scope-policy). When the caller supplies a replacement User Request, preserve it verbatim, update affected work, and preserve unaffected valid work.

      **Save plans to:** the caller's path or `<worktree_path>/docs/plans/YYYY-MM-DD-<slug>.md`.

      ## File Structure

      Before defining tasks, map out which files will be created or modified and what each one is responsible for. This is where decomposition decisions get locked in. Compare the decomposition with the current User Request: produce one integrated plan for the requested outcome with independently testable parts. Choose the simplest complete design; add files, abstractions, tasks, and capabilities only when necessary to fulfill that request.

      - Design units with clear boundaries and well-defined interfaces. Each file should have one clear responsibility.
      - You reason best about code you can hold in context at once, and your edits are more reliable when files are focused. Prefer smaller, focused files over large ones that do too much.
      - Files that change together should live together. Split by responsibility, not by technical layer.
      - In existing codebases, follow established patterns. If the codebase uses large files, don't unilaterally restructure - but if a file you're modifying has grown unwieldy, include a split only when necessary to fulfill the current User Request.

      This structure informs the task decomposition. Each task should produce self-contained changes that make sense independently.

      ## Task Right-Sizing

      A task is the smallest unit that carries its own test cycle and is worth a
      fresh reviewer's gate. When drawing task boundaries: fold setup,
      configuration, scaffolding, and documentation steps into the task whose
      deliverable needs them; split only where a reviewer could meaningfully
      reject one task while approving its neighbor. Each task ends with an
      independently testable deliverable.

      ## Step Granularity

      **Each step is one action with a checkable result:**
      - "Write the failing test" - step
      - "Run it to make sure it fails" - step
      - "Implement the minimal code to make the test pass" - step
      - "Run the tests and make sure they pass" - step
      - "Commit" - step

      ## Plan Document Header

      **Every plan MUST put its H1 and tracking instruction first, then the complete current `## User Request` block verbatim exactly once immediately before the planner-owned Goal:**

      ```markdown
      # [Feature Name] Implementation Plan

      Steps use checkbox (`- [ ]`) syntax for tracking.

      [Insert the complete current `## User Request` block unchanged exactly once.]

      **Goal:** [One sentence describing what this builds]

      **Architecture:** [2-3 sentences about approach]

      **Tech Stack:** [Key technologies/libraries]

      **Spec:** [path to the supporting spec/design doc — use its details to fulfill
      the current User Request, so the spec travels with the plan; executors read both]

      ## Global Constraints

      [The spec's project-wide requirements — version floors, dependency limits,
      naming and copy rules, platform requirements — one line each, with exact
      values copied verbatim from the spec. Every task's requirements implicitly
      include this section.]

      ## Review Focus

      [Up to five input classes or failure modes within the current User Request's
      scope that the spec implies but no task's
      tests exercise that are most likely to bite a person using this software
      — one line each, naming the input or condition and the behavior a
      reasonable person would expect, most likely first. The spec is a vision
      document: it says what the software must do, not everything it will
      meet, and its silence on an input is not permission for that input to
      break the program. Write the list here, once, with the spec in front of
      you. Then, for each line, add the test that pins it to the task that
      owns the code, in that task's own step style.]

      ---
      ```

      ## Task Structure

      ````markdown
      ### Task N: [Component Name]

      **Files:**
      - Create: `exact/path/to/file.py`
      - Modify: `exact/path/to/existing.py:123-145`
      - Test: `tests/exact/path/to/test.py`

      **Interfaces:**
      - Consumes: [what this task uses from earlier tasks — exact signatures]
      - Produces: [what later tasks rely on — exact function names, parameter
        and return types. A task's implementer sees only their own task; this
        block is how they learn the names and types neighboring tasks use.]

      - [ ] **Step 1: Write the failing test**

      ```python
      def test_specific_behavior():
          result = function(input)
          assert result == expected
      ```

      - [ ] **Step 2: Run test to verify it fails**

      Run: `pytest tests/path/test.py::test_name -v`
      Expected: FAIL with "function not defined"

      - [ ] **Step 3: Implement `function(input: InputType) -> ResultType` in `exact/path/to/file.py`**

      One line on the approach when the signature and the test leave a choice
      (which library call, which data structure); a code block only for an
      algorithm they do not determine.

      - [ ] **Step 4: Run test to verify it passes**

      Run: `pytest tests/path/test.py::test_name -v`
      Expected: PASS

      - [ ] **Step 5: Commit**

      ```bash
      git -C "[WORKTREE_PATH]" add tests/path/test.py src/path/file.py
      git -C "[WORKTREE_PATH]" commit -m "feat: add specific feature"
      ```
      ````

      ## What a Step Contains

      A step is done when the implementer can write exactly one reasonable thing
      from it. That is the whole requirement: unambiguous, not complete. Each kind
      of step carries what makes it unambiguous and nothing more:

      - **A test step:** the test's name and its assertions, as code, with the
        spec's exact values in them.
      - **A code step:** the exact signature (name, parameters, return type), the
        file it lives in, and the specific values the spec pins. The implementer
        writes the body. A body appears only for an algorithm the signature and
        tests do not determine, or for exact copy the spec fixes.
      - **A verification step:** the command to run and the output that means it
        passed.
      - **A reference to another task:** that task's Interfaces block says what
        to use; the plan does not repeat that task's code.

      A plan is the set of decisions the implementer cannot make alone. A plan
      longer than the code it describes has written the code instead. Lines that
      decide nothing ("TBD", "handle edge cases", "add appropriate validation",
      "write tests for the above", a type or function no task defines) are the
      opposite failure, and the self-review catches both.

      Plan code is a draft. Once execution starts, the source tree supersedes it;
      record changed decisions in the plan and keep implementation fixes in the source tree.

      ## Self-Review

      After writing the complete plan, check its goal, architecture, decomposition, tasks, tests, and amendments against the current User Request first and the supporting spec second. Check that every planned part is necessary, each part is independently testable, and the commands, assertions, and expected results provide runnable proof. This is a checklist you run yourself — not a subagent dispatch.

      **1. Request and spec coverage:** Skim each requirement in the current User Request and each applicable section/requirement in the supporting spec. Can you point to a task that implements it? List any gaps.

      **2. Step scan:** Every step must let the implementer write exactly one reasonable thing, and no step may carry more than that: a line that decides nothing is a gap, a function body the signature and tests already determine is a transcript. Fix both.

      **3. Type consistency:** Do the types, method signatures, and property names you used in later tasks match what you defined in earlier tasks? A function called `clearLayers()` in Task 3 but `clearFullLayers()` in Task 7 is a bug.

      **4. Review Focus:** For each input class or failure mode the spec implies, is there a task whose tests exercise it? Up to five uncovered ones within the current User Request's scope most likely to bite a person go in the Review Focus section, and each line there gets its test added to the owning task. An empty section means you checked and found none, not that you skipped the check.

      **5. Proportion:** Compare the plan's length to the spec's. A plan several times longer than the spec it implements is a transcript of the program, not a plan. If code blocks are most of the document, replace bodies with signatures, test names and assertions, and check that each step is still unambiguous.

      If you find issues, fix them inline. No need to re-review — just fix and move on. If you find a requirement of the current User Request or an applicable spec requirement with no task, add the task.

      ## Execution Handoff

      Record each unproven assumption that could change the design, why it matters,
      and the evidence needed. Return that list for the caller's
      the later load-bearing recipe step.

      After saving and self-reviewing the plan, commit it in the supplied worktree.
      Record its path, commit, self-review result, and unresolved design-changing
      assumptions in the existing progress ledger, then return the plan receipt below.
      The load-bearing step consumes the assumptions from the committed plan and ledger.
      The caller chooses the next stage.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "plan_path": "<absolute path to the committed plan file>",
        "feature": "<one-line feature name>"
      }

  # ---- File-based pickup of the write-plan output contract. The write-plan
  # step intermittently returned garbage/truncated chat output (observed
  # 2026-08-08: `plan` became a raw string, breaking every later
  # {{plan.plan_path}} template). The result file is authoritative; the
  # pending-output anchor is the fallback. Either source is accepted ONLY if
  # its plan_path is an absolute path to a file that actually exists — the
  # anchor skeleton contains a placeholder "plan_path" key from minute zero,
  # so a key-presence check alone would forward placeholder garbage.
  # Otherwise fail loudly rather than let a corrupted `plan` propagate.
  - id: "write-plan-collect"
    type: "bash"
    output: "plan"
    parse_json: true
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
    command: |
      plan_ok() {
        [ -s "$1" ] || return 1
        p=$(sed -n 's/.*"plan_path"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -n 1)
        case "$p" in
          /*) [ -f "$p" ] || return 1 ;;
          *) return 1 ;;
        esac
      }
      if plan_ok "$LOGS_DIR/write-plan-result.json"; then
        cat -- "$LOGS_DIR/write-plan-result.json"
      elif plan_ok "$LOGS_DIR/pending-output.json"; then
        printf '%s\n' "WARNING: write-plan-result.json missing or invalid; using pending-output.json anchor" >&2
        cat -- "$LOGS_DIR/pending-output.json"
      else
        printf '%s\n' "FATAL: write-plan output lost or invalid (no result file or anchor whose plan_path points at a real file). Cannot continue without a plan." >&2
        exit 1
      fi

