      # Execution Coordination

      Handle routine, reversible decisions without stopping. A blocker is a problem
      that remains after reasonable investigation and safe alternatives leave no
      way to complete this stage as requested. Record the blocker and return it to
      the dispatcher. User contact belongs to the dispatcher and is reserved for
      situations where continuing risks data loss, environmental corruption,
      security or privacy harm, large unexpected cost, or comparable serious
      damage.

      Coordinate each plan item through
      [Subagent-Driven Development](#subagent-driven-development),
      which owns task implementation, testing, independent review, and fix re-review.

      **Announce at start:** Use the mandatory Stage 4 banners above.

      **Core principle:** The plan already did the thinking. Execute it within the
      current `## User Request`, require evidence that each step's test failed and
      then passed, and leave a record that survives your own forgetting.

      **Narration:** between tool calls, narrate at most one short line — the
      ledger and the tool results carry the record.

      **Continuous execution:** Execute all requested tasks without routine check-ins;
      return an unresolved blocker with its evidence.

      **Rulings, not stalls.** Decide routine reversible conflicts, ambiguities, and
      plan defects against the current User Request. Use the plan, specification, and
      repository evidence for supporting detail. Check each task, test boundary,
      implementation, fix, fallback, review scope, and amendment against that request;
      choose the simplest complete action it requires. Record every decision in the ledger
      as `Ruling: <what you decided> — <why> — <what it costs if wrong>`, and keep
      going. Deviating from the plan without a ledgered ruling is a decision made
      in secret.

      Return a conflicting request snapshot to the dispatcher. Use its replacement
      verbatim, update affected work, and preserve unaffected valid work. If a plan
      item has no safe request-faithful interpretation, record the evidence and
      return a blocker. An unresolved blocker, required independent review, or finite
      cap remains binding regardless of a ruling.

      ## Setup

      Use the caller's dedicated `worktree_path`, committed `plan_path`, immutable
      `base_ref`, and `logs_dir` from
      [Bundle Interface](#bundle-interface). Consume its current-request carrier,
      action/evidence recording, and resume interfaces; keep implementation and test
      commands inside that worktree.

      Conversation memory does not survive compaction.
      Track progress in a ledger file, not only in todos. Harness todos are a
      live view; the ledger is the record.

      Load or resume the approved plan and the baseline-first SDD progress ledger
      through the Bundle Interface. Record the ledger path under `logs_dir`; keep reports under
      `logs_dir/reports` and generate briefs with SDD scratch-file bash below. Record the initial execution time and committed HEAD in the
      ledger. Reconcile completed tasks and evidence before resuming, reuse valid
      completed work, and create a todo per task. Check the current request snapshot
      and recorded interfaces needed for the next task.

      Apply [Scope Policy](#scope-policy) and
      [Turn Economy](#turn-economy) to every dispatch. Each implementation,
      fix, and review package includes the complete current User Request verbatim,
      followed by both complete policies verbatim, then its bounded assignment,
      required inputs, evidence, and result contract.

      ## The Task Loop

      Everything you print, and every tool result, stays resident in your
      context for the rest of the session. Keep long test output under `logs_dir`
      and read the needed excerpts; read a brief, not the whole plan.

      ### 1. Take the task

      - Use Subagent-Driven Development's task brief and committed task-base
        interface. Read the brief for every task, including ones you remember from
        setup: what you remember is a summary, the brief has the exact values,
        signatures, and test cases.
      - Mark the task's todo in_progress.

      Record each returned result through the run contract at Turn Economy's
      durability boundary; batch only independent ready bookkeeping.

      ### 2. Work the steps

      Call Subagent-Driven Development for the task with the current request
      and policy package, full task text, applicable plan/specification constraints,
      absolute worktree path, prior interface decisions, carried findings, ledger
      evidence, and required report paths. It owns TDD, committed implementation,
      task review, and bounded informed fix re-review. Require its task result,
      commits, exact test commands and observed results, review verdicts, finding
      dispositions, concerns or blocker, and artifact paths.

      ### 3. The completion contract

      Before a task's ledger line, all of the following are true, with recorded
      worker evidence — not inferred from the diff looking right:

      - Every test the brief names exists and ran in this task, and the worker read
        the output.
      - The final task verification passed across the complete impacted set, with
        the command and result recorded in the ledger.
      - Every `Expected:` line in the brief was compared against real output.
      - Every deviation from the brief has a `Ruling:` line in the ledger.

      Require the task-execution subskill's valid independent CLEAN review result
      and every finding's final disposition under Scope Policy. If any item is
      missing, keep the task incomplete and return the evidence to that subskill.
      An unavailable independent review, exhausted supported routes, no report, or
      inability to evaluate scope returns a terminal execution blocker to the caller
      under the run contract, including on resume. Execution failures consume no
      review rounds. The review subskill owns substantive malformed-report handling;
      retain its findings and count only actually performed reviews. Return exhausted
      repair caps with unresolved required findings as unsuccessful.

      ### 4. Complete the task

      Record verified completion, commits, test/review evidence, and completed/total
      task counts through the run contract, then mark the todo complete. At each task
      boundary apply [the full-suite gate](#the-full-suite-gate) timing below before
      continuing with the next task.

      ## Final Review

      After all tasks, run the full-suite gate below before asking
      Subagent-Driven Development for its informed whole-branch review.
      Supply immutable `base_ref`, final committed HEAD, absolute worktree path,
      the current request/policy package, plan and specification paths, the plan's
      Review Focus verbatim if present, implementation reports, exact gate commands
      and results, artifact paths, all unresolved findings, and ledger rulings.

      Require the result defined by
      [Informed Code Review](#review-result-contract).
      The task-execution subskill owns the single final fix wave and informed scoped
      re-review. If it returns final fix commits, run the gate on the resulting HEAD
      before completion. Keep this informed review separate from the caller's
      context-isolated Fresh Eyes.

      ## The Full-Suite Gate

      At a task boundary, set `LAST_GATE_HEAD` to the previous gate's HEAD or the
      initial execution ledger HEAD. Run
      `git -C <worktree_path> rev-list --count --no-merges <LAST_GATE_HEAD>..HEAD -- ':(exclude,top)docs/plans'`.
      Run the gate when the count reaches {{full_suite_commits}} (default 10) or cannot be resolved. Also run it after
      all tasks, before informed whole-branch review, and on final fix commits.
      A periodic pass satisfies the final gate only at the exact final committed HEAD.

      Use the repository's configured integrated or full-suite command and scopes.
      Adopt valid completed evidence only at the same committed HEAD and exact
      command. Await or resume a matching live invocation before replacing it;
      allow it to terminate before repairing assertion failures. A stopped invocation
      with trustworthy output remains the same logical invocation. Clean up unusable
      prior invocations through the repository's documented path before replacement.
      Otherwise run the command in `worktree_path`, saving the full output under
      `logs_dir`. Record time, HEAD, exact command, trigger, result,
      all failures, configured scopes not reached, and evidence paths in the ledger.
      Pass only when all configured scopes ran and the result is green except for
      failures proven pre-existing at `base_ref` through the run contract's
      reproduction receipts: the same command and failure in a clean checkout at
      `base_ref` with the same pre-setup repository and environment state.

      For failures, coordinate the entire request-faithful remediation batch through
      the task-execution subskill, with focused/impacted tests and commits, before
      another suite invocation. Return repository services and queues to their
      documented reusable state. Retry only after the completed remediation batch or
      a concrete infrastructure recovery. If no request-faithful path remains,
      record the evidence and return a blocker.

      ## Finish

      Collect every ledger line containing `Ruling:` into the execution record under
      "Rulings I made", in the order you made them, each with what it costs if wrong.
      Include every finding's final disposition and evidence, including qualifying
      OUT-OF-SCOPE and Minor/Nit OPTIONAL findings.

      Write the execution record under `logs_dir`, referenced in execution_notes:
      `blocked`, `blocked_reason`, `tasks_completed`, `total_tasks`, `head_sha`,
      exact verification commands/results, whole-branch verdict, ledger path,
      deliberate adaptations, and evidence paths. Completion requires the final
      gate pass at the final committed revision and the valid independent review
      result. Preserve artifacts; Fresh Eyes and later integration or cleanup
      decisions belong to the caller.

      ## Common Rationalizations

      | Excuse | Reality |
      |--------|---------|
      | "I remember what Task N says" | You remember a summary. The brief has the exact values. Read it. |
      | "The plan's code is right, skip watching the test fail" | A test the worker never saw fail proves nothing. It is one step. Require the worker's evidence. |
      | "I'll postpone task verification until the final gate" | The worker proves each step and the complete impacted set; the coordinator runs periodic and final full-suite gates. |
      | "The plan is wrong here, I'll just do the right thing" | Do the right thing and ledger the ruling. Unledgered deviation is a decision made in secret. |
      | "I'll write the ledger lines after a few tasks" | Compaction does not wait for a convenient moment. Record each result at Turn Economy's durability boundary. |
      | "Let me check in before the next task" | Continue routine reversible work; return unresolved blockers to the caller. |
      | "I read my own diff carefully; the final reviewer is redundant" | Same author, same blind spots. Require the independent review result. |
      | "Tests should pass, the change was trivial" | "Should" is not evidence. The contract requires the command and its output. |
      | "Subagents are slow and expensive, I'll skip the final review too" | Task reviews and informed whole-branch review are required independent gates. |
      | "The reviewer said Minor, so it's Minor" | Grade the demonstrated effect on requested behavior and record a valid scope-rule disposition. |
      | "The fix is obvious, no need for a failing test first" | The failing test is the only proof the finding was real and is now gone. Without it you have a diff and a hope. |
      | "I'll fix the minors too while I'm in there" | Apply Scope Policy; record qualifying OPTIONAL dispositions without extending the repair loop. |

      # Subagent-Driven Development

      Handle routine, reversible decisions without stopping. A blocker is a problem
      that remains after reasonable investigation and safe alternatives leave no
      way to complete this stage as requested. Record the blocker and return it to
      the dispatcher. User contact belongs to the dispatcher and is reserved for
      situations where continuing risks data loss, environmental corruption,
      security or privacy harm, large unexpected cost, or comparable serious
      damage.

      Execute plan by dispatching a fresh implementer subagent per task, a task review (spec compliance + code quality) after each, and a broad whole-branch review at the end.

      **Why subagents:** You delegate tasks to specialized agents with isolated context. By precisely crafting their instructions and context, you ensure they stay focused and succeed at their task. They should never inherit your session's context or history — you construct exactly what they need. This also preserves your own context for coordination work.

      **Core principle:** Fresh subagent per task + task review (spec + quality) + broad final review = high quality, fast iteration

      **Narration:** between tool calls, narrate at most one short line — the
      ledger and the tool results carry the record.

      **Continuous execution:** Execute the requested tasks without routine check-ins;
      return an unresolved blocker to the caller with its evidence.

      **Rulings, not stalls.** Resolve routine reversible conflicts, ambiguities, and
      plan defects against the current `## User Request`. Plans, specifications, and
      repository evidence explain how to fulfill that request. Choose the simplest
      complete action; add work only when that request or repository evidence requires
      it. Check every task, test boundary, implementation, fix, fallback, review scope,
      and amendment against the request. Record each decision in the ledger as
      `Ruling: <what you decided> — <why> — <what it costs if wrong>`.
      Return conflicting request snapshots to the dispatcher; consume its replacement
      verbatim, update affected work, and preserve unaffected valid work. Return
      unresolved blockers and exhausted caps with an unsuccessful result.

      ## Setup

      Use the caller's dedicated `worktree_path`, committed `plan_path`, immutable
      `base_ref`, and `logs_dir` from [Bundle Interface](#bundle-interface).
      Consume its current-request carrier, action/evidence recording, and resume
      interfaces. Keep implementation and test commands inside that worktree.

      Conversation memory does not survive compaction. In real sessions,
      controllers that lost their place have re-dispatched entire completed task
      sequences — the single most expensive failure observed. Track progress in
      a ledger file, not only in todos.

      - Resume the existing baseline-first SDD progress ledger from Bundle Interface;
        record its path in the execution receipt artifacts under `logs_dir`. Append
        the initial execution time and committed HEAD for the execution gate after
        the immutable baseline. Generate briefs with SDD scratch-file bash below;
        keep reports under `logs_dir/reports`.
      - Reconcile progress, completed tasks, fix rounds, commits, and evidence through
        the run contract before resuming; reuse valid completed work. Record each
        result when it arrives under [Turn Economy](#turn-economy).
      - Apply [Scope Policy](#scope-policy) to each assignment and finding.
        Every implementation, fix, and review package starts with the complete current
        User Request verbatim, followed by both complete policies verbatim.
      - The ledger is your recovery map: the commits it names exist in git even
        when your context no longer remembers creating them. After compaction,
        trust the ledger and `git log` over your own recollection.

      Read the plan once, note its context and Global Constraints, and create a
      todo per task. If the plan names a Spec, read that too for supporting detail.
      Check both against the current User Request; record missing supporting material
      and resolve routine gaps from request-faithful repository evidence.

      Before dispatching Task 1, scan the plan once for conflicts, writing down
      what you checked as you check it:

      - tasks that contradict each other or the plan's Global Constraints
      - anything the plan explicitly mandates that the review rubric treats as a
        defect (a test that asserts nothing, verbatim duplication of a logic block)

      The scan's output is a table, not a verdict. One row for every pair of tasks
      that share a file or an interface: the two tasks, what one produces against
      what the other consumes, and what you found. One row for every task: whether
      its own text agrees with itself — the tests it specifies against the code it
      specifies, the files it creates against the files it later touches. "The scan
      is clean" without those rows is not a scan you ran.

      Write the table to the ledger. Rule on everything you find before execution
      begins — each finding against the plan text that mandates it — and record
      each ruling in the ledger. If the scan is clean, proceed without comment.
      Rule on each conflict it surfaces against the current User Request, record
      the ruling beside its row, and dispatch
      Task 1. The review loop remains the net for conflicts that only emerge from
      implementation.

      ## Model Selection

      Use the least powerful model that can handle each role to conserve cost and increase speed.

      **Mechanical implementation tasks** (isolated functions, clear specs, 1-2 files): use a fast, cheap model. Most implementation tasks are mechanical when the plan is well-specified.

      **Integration and judgment tasks** (multi-file coordination, pattern matching, debugging): use a standard model.

      **Architecture and design tasks**: use the most capable available model.
      Reviewer selection belongs to [Informed Code Review](#informed-code-review).

      **Fix-loop escalation (rounds 4-5)**: use a fresh appropriate implementer on
      a more capable supported model when available; retain the round counter.

      **Always specify model_role explicitly when dispatching a subagent.** An
      omitted model inherits your session's model — often the most capable and
      most expensive — which silently defeats this section.

      **Turn count beats token price.** Wall-clock and context cost scale with how
      many turns a subagent takes, and the cheapest models routinely take 2-3× the
      turns on multi-step work — costing more overall. Use a mid-tier model as the
      floor for implementers working from prose descriptions.
      When the task's plan text contains the complete code to write, the
      implementation is transcription plus testing: use the cheapest tier for
      that implementer. Single-file mechanical fixes also take the cheapest tier.

      **Task complexity signals (implementation tasks):**
      - Touches 1-2 files with a complete spec → cheap model
      - Touches multiple files with integration concerns → standard model
      - Requires design judgment or broad codebase understanding → most capable model

      ## The Task Loop

      **Batch independent ready calls.** Schedule them in the same response under
      Turn Economy. Preserve each task's complete assignment, result, evidence,
      and independent review gate; batch scheduling only.

      Everything you paste into a dispatch prompt — and everything a subagent
      prints back — stays resident in your context for the rest of the session
      and is re-read on every later turn. Hand artifacts over as files.

      **Waiting on dispatched subagents:** the native delegate call blocks until
      its child returns. Batch independent ready calls before dispatch under
      Turn Economy. After return, reconcile every child result with its report
      and ledger entry before dependent work. The delegate interface has no
      separate wait/list operation; a missing result takes the documented
      failure path, not an invented polling or asynchronous continuation loop.

      ### 1. Dispatch the implementer

      Record BASE (the full committed HEAD in `worktree_path`) before dispatching — the review package
      and fix-round diffs need it.

      - **Task brief:** before dispatching an implementer, write a uniquely named
        file using TASK BRIEF in SDD scratch-file bash below. The extractor supplies
        the verbatim request, Global Constraints, and full selected task. Supply both
        complete policies in the dispatch immediately after the request. Include applicable plan/specification constraints and the absolute
        worktree path. Compose the dispatch so the brief supplies the current request
        and supporting task requirements. Your dispatch should contain: (1) one line on where this
        task fits in the project; (2) the brief path, introduced as "read this
        first — it contains the current User Request and the task's exact values";
        (3) interfaces and decisions from earlier tasks that the brief cannot
        know; (4) your resolution of any ambiguity you noticed in the brief;
        (5) the report-file path and report contract. Exact values (numbers,
        magic strings, signatures, test cases) appear only in the brief. Never
        make a subagent read the whole plan file.
      - **Report file:** name the implementer's report file after the brief
        (brief `…/task-N-brief.md` → report `…/task-N-report.md`) and put it in
        the dispatch prompt. The implementer writes the full report there and
        returns only status, commits, a one-line test summary, and concerns.
      - A dispatch prompt describes one task, not the session's history. Do not
        paste accumulated prior-task summaries ("state after Tasks 1-3") into
        later dispatches — a real session's dispatch hit 42k chars of which 99%
        was pasted history. A fresh subagent needs its task, the interfaces it
        touches, the global constraints, and the required request and policy prefix.
      - The dispatch carries the no-subagents contract (it is in the
        implementer template): the implementer never dispatches subagents —
        not helpers, and never a reviewer. Review arrives from you, after the
        report. In real sessions, every reviewer a worker spawned duplicated
        the task review the controller dispatched anyway — a full extra
        review seat per task.
      - Carry applicable findings and ledger evidence for the area this task touches
        in the dispatch.
      - Record the implementer's agent identity from the dispatch result —
        fix-loop rounds 1-3 resume this agent where supported.
      - Apply Turn Economy's mutation boundary to implementation dispatches.

      Template: [Implementer Subagent Prompt Template](#implementer-subagent-prompt-template).
      Supply [Test-Driven Development](#test-driven-development) for
      worker code changes and fill the template from each bounded implementation or
      fix package.

      ### 2. Handle the report

      Implementer subagents report one of four statuses. Handle each appropriately:

      **DONE:** The implementer completed the work. Confirm committed changes and
      required evidence, then request task review through step 3 with the recorded
      BASE and current committed HEAD; never `HEAD~1`, which silently drops all but
      the last commit of a multi-commit task.

      **DONE_WITH_CONCERNS:** The implementer completed the work but flagged doubts. Read the concerns before proceeding. If the concerns are about correctness or scope, address them before review. If they're observations (e.g., "this file is getting large"), note them and proceed to review.

      **NEEDS_CONTEXT:** The implementer needs information that wasn't provided. Provide the missing context and re-dispatch.

      **BLOCKED:** The implementer cannot complete the task. Assess the blocker:
      1. If it's a context problem, provide more context and re-dispatch with the same model
      2. If the task requires more reasoning, re-dispatch with a more capable model
      3. If the task is too large, break it into smaller pieces
      4. If the plan itself is wrong, record the smallest request-faithful correction
         and re-dispatch with the changed brief; return a blocker if none exists.

      **Never** ignore an escalation or force the same model to retry without changes. If the implementer said it's stuck, something needs to change.
      Require changed brief, evidence, capability, or an available mechanism before
      redispatching stuck work.

      If implementation delegation is unavailable, try one supported alternate
      Amplifier delegate route. Skip unavailable mechanisms. Try each supported route
      once per failure; a later attempt requires a concrete change to its failed
      prerequisite. Exhausted routes return a terminal execution blocker. Every
      implementation and fix retains its independent review gate.

      If the implementer asks questions — before starting or mid-task — answer
      clearly and completely, provide additional context if needed, and don't
      rush it into implementation.

      ### 3. Review the task

      Per-task reviews are task-scoped gates. The broad review happens once, at the
      final whole-branch review. Never skip the task review, and never accept a
      report missing either verdict — spec compliance AND task quality are both
      required. Implementer self-review never replaces the task review; both are
      needed.

      - Call Informed Code Review with task scope, absolute `worktree_path`,
        the complete request/policy package, the brief and report paths, the recorded
        BASE and committed HEAD, observed test commands/results, artifact paths,
        applicable carried findings, and ledger evidence. Its package method supplies
        the commit list, stat summary, and full net diff with ten context lines as a
        file. Its [task template](#task-reviewer-prompt-template)
        owns the reviewer instructions and both required verdicts.
      - Consume its clean-or-findings result, counts, verdicts, report path, and
        summary. The review subskill owns reviewer independence and malformed-result
        handling. A missing or malformed marker leaves review open; retain substantive
        findings and count only actually performed reviews. Unavailable independent
        review, exhausted supported routes, no report, or inability to evaluate scope
        returns a terminal execution blocker under the run contract. This ends the
        workflow, including on resume; failed execution attempts consume no review
        rounds. Preserve diagnostics separately from substantive review entries.
      - The global-constraints block you hand the reviewer is its attention
        lens. Copy the applicable requirements verbatim from the current User Request
        and supporting plan's Global Constraints section or the spec: exact values, exact formats, and the
        stated relationships between components ("same layout as X", "matches
        Y"). The reviewer's template already carries the process rules (YAGNI,
        test hygiene, review method) — the constraints block is for what THIS
        task requires within the current User Request.
      - Do not add open-ended directives like "check all uses" or "run race tests
        if useful" without a concrete, task-specific reason
      - Do not ask a reviewer to re-run tests the implementer already ran on the
        same code — the implementer's report carries the test evidence
      - Do not pre-judge findings for the reviewer — never instruct a reviewer to
        ignore or not flag a specific issue. If you believe a finding would be a
        false positive, let the reviewer raise it and adjudicate it in the review
        loop. If the prompt you are writing contains "do not flag," "don't treat X
        as a defect," "at most Minor," or "the plan chose" — stop: you are
        pre-judging, usually to spare yourself a review loop.
      The task reviewer may report "⚠️ Cannot verify from diff" items — requirements
      that live in unchanged code or span tasks. These do not block the rest of the
      review, but you must resolve each one yourself before marking the task
      complete: you hold the plan and cross-task context the reviewer
      lacks. If you confirm an item is a real gap, treat it as a failed spec
      review — it enters the fix loop with the other findings.


      ### 4. The fix loop

      The loop triggers for unresolved required findings returned by the review
      subskill, including spec gaps or a ⚠️ item confirmed as a real gap.

      Record every finding's final disposition under Scope Policy. Qualifying
      OUT-OF-SCOPE and Minor/Nit OPTIONAL dispositions need no repair. Required defects
      need correction or evidentiary rejection and the applicable informed re-review.
      For a finding conflicting with plan text, assess it against the current User
      Request and record the decision before changing the plan or implementation.
      A recorded decision alone cannot clear a substantiated required defect.

      A fix round is one fix dispatch plus one scoped re-review. Five rounds maximum
      per task; supported worker fallback keeps that counter. These rounds are
      separate from the caller's context-isolated Fresh Eyes allowance.

      **Rounds 1-3 — resume the original implementer where supported.** Send it the open findings
      verbatim. Its context is intact: it knows the task, the code, and its own
      choices. If your harness cannot send another message to a live subagent,
      dispatch a fresh implementer carrying the brief path, the report-file path,
      and the findings — the report file is the persistent memory either way.

      **Rounds 4-5 — dispatch a fresh appropriate implementer on a more capable
      supported model when available** (per Model Selection), with the brief path, the report-file path, the open
      findings, and this framing: "A prior implementer attempted this task
      [N] times; you own it now. Read the report file for what was tried." A loop
      that survives three resumes usually means the implementer cannot see its
      own problem — fresh eyes and a capability bump in one move.

      **Every round, either way:** the implementer fixes, re-runs the tests
      covering the amended code, appends its fix report to the same report file,
      and returns the short contract. Before re-dispatching the reviewer, confirm
      the fix report contains the covering tests, the command run, and the
      output; dispatch the re-review once all three are present. Name the
      covering test files in the fix message — a one-line fix does not need the
      whole suite.

      **The re-review is scoped.** Set FIX_BASE to the committed head the previous
      review saw. Call Informed Code Review with informed fix re-review scope,
      FIX_BASE and the committed fix HEAD, the required request/policy prefix, prior
      findings verbatim, the brief, fix report, test evidence, worktree path, and ledger
      evidence. Its [scoped re-review template](#scoped-re-review-prompt-template)
      checks each prior finding and new breakage in that exact delta. Add new required
      fix-delta findings to the open list; record other observations with scope-rule
      dispositions without extending the loop.

      **After each round,** append to the ledger:
      `Task <N>: fix round <R>/5 (<X> addressed, <Y> open — <finding one-liners>; commits <a7>..<b7>)`

      Use the implementation fallback above only when supported delegation is
      unavailable; every fix still requires independent review.

      **The breaker.** After round 5, retain unresolved required findings and return
      blocked with their evidence. Record valid scope-rule dispositions; an
      uncorrected substantiated required defect remains unsuccessful. An unavailable
      independent review returns its terminal blocker immediately, regardless of the
      remaining repair allowance.

      ### 5. Complete the task

      When the review returns a valid CLEAN result and every finding has a valid
      final disposition, record completion, commits, test/review evidence, and task
      counts through the run contract in the same message as other bookkeeping.
      Then mark the todo complete. At this task boundary, this execute-step controller
      applies Execution Coordination’s The Full-Suite Gate for its periodic gate
      decision before dispatching the next task. Continue after any
      required gate passes; return its blocker if the gate cannot pass.

      ## Final Review

      After completed task results, this execute-step controller runs Execution
      Coordination’s final full-suite gate. With passing gate evidence for the current
      committed HEAD, call Informed Code Review with whole-branch scope:
      immutable `base_ref` through that HEAD, the complete request/policy package,
      applicable plan, absolute worktree path, implementation reports, exact test and
      gate evidence, artifact paths, and all unresolved findings and ledger evidence.
      Use its [whole-branch template](#code-reviewer-prompt-template)
      and require its valid CLEAN result and all final dispositions for completion.

      If the final whole-branch review returns unresolved required findings, dispatch
      ONE fix subagent with the complete required findings list — not one fixer per finding.
      Per-finding fixers each rebuild context and re-run suites; a real
      session's final-review fix wave cost more than all its tasks combined.
      Then run exactly one informed scoped re-review of the fix wave through the
      review method above. Return any unresolved required findings as blocked; there
      is no second fix wave. This limit is separate from Fresh Eyes rounds. Return
      final fix commits to Execution Coordination for a gate pass on the resulting HEAD
      before returning completion.

      ## Finish

      For the caller's execution record, collect every ledger line containing `Ruling:` —
      preflight rulings, finding dispositions, breaker decisions, all of them — into
      the execution record under "Rulings I made", in the order you made them, each
      with what it costs if wrong. The list is exhaustive: if the ledger holds a
      ruling, the list holds it. That list is the only place the decisions you
      took on your human partner's behalf reach the recap — they read it and rework
      whatever you got wrong. A ruling that dies with the workspace was a decision
      made in secret.

      Record the committed, tested, reviewed result and evidence paths under logs_dir:
      completed/total tasks, final HEAD, exact verification commands and results,
      whole-branch verdict, ledger path, deliberate adaptations, and any blocker.
      Preserve artifacts for the caller's recap and later stages; return only the
      existing execute_result JSON receipt.

      ## Common Rationalizations

      | Excuse | Reality |
      |--------|---------|
      | "Close enough on spec compliance" | Reviewer found required spec gaps = not done. Correct them or return blocked at the cap. |
      | "I'll fix it myself, dispatching is overhead" | Resume the implementer; use the recorded implementation fallback only when supported delegation is unavailable, preserving independent review. |
      | "One more round will converge" | Past the cap, return unresolved required findings as blocked. |
      | "The reviewer will just find something new anyway" | Scoped re-reviews verify fixes; they cannot wander. New findings on untouched code go to the ledger, not the loop. |
      | "This finding is obviously wrong, I'll drop it" | Record an evidentiary disposition under Scope Policy and obtain applicable re-review. Silent discards are forbidden. |
      | "The fix was small, skip the re-review" | Unreviewed fixes are how regressions land. Every round ends with a scoped re-review. |
      | "Reviews slow the loop down" | The loop without reviews is just unverified churn. Reviews are the loop's brakes and steering. |
      | "Ledger bookkeeping is overhead" | The ledger is what survives compaction. Controllers without one have re-dispatched entire completed task sequences. |
      | "The implementer spawned its own reviewer — free extra assurance" | It's a duplicate seat reviewing the same diff; the task review is the gate. A worker-spawned reviewer is a defect to flag, not rigor. |

      ## Implementer Subagent Prompt Template

      Use this template when dispatching an implementer subagent.

      ```
      delegate(context_depth="none") with:
        agent: "the-usual:step-runner"
        model_role: [MODEL_ROLE — REQUIRED: choose per Model Selection above; an omitted
               model_role silently inherits the session's most expensive one]
        instruction: |
          [CURRENT_USER_REQUEST — complete caller-supplied block verbatim]
          [SCOPE_POLICY — complete Scope Policy verbatim]
          [TURN_POLICY — complete Turn Economy verbatim]

          You are implementing Task N: [task name]

          ## Task Description

          Read your task brief first: [BRIEF_FILE]
          It contains the full task text from the plan and the required context.
          Check task, test, implementation, and fix choices against the current User
          Request. Use the plan as supporting detail and choose the simplest complete
          solution; add work only when required to fulfill that request.

          ## Context

          [Scene-setting: where this fits, dependencies, architectural context]

          ## Before You Begin

          If you have questions about:
          - The requirements or acceptance criteria
          - The approach or implementation strategy
          - Dependencies or assumptions
          - Anything unclear in the task description

          **Ask them now.** Raise any concerns before starting work.

          ## Your Job

          Once you're clear on requirements:
          1. Implement the assigned task within the current User Request
          2. Write tests following Test-Driven Development, supplied by the controller
          3. Verify implementation works
          4. Commit your work
          5. Self-review (see below)
          6. Report back

          Work from: [WORKTREE_PATH — caller's recorded absolute worktree_path]

          **While you work:** If you encounter something unexpected or unclear, **ask questions**.
          It's always OK to pause and clarify. Don't guess or make assumptions.

          While iterating, run the focused test for what you're changing; run the
          complete focused/impacted test set before committing. A task runs the full
          suite only when its impact genuinely spans the codebase; periodic and final
          full-suite gates belong to Execution Coordination.

          ## You Do Not Dispatch Subagents

          Do all of this task's work yourself. Never spawn a subagent to
          implement part of the task, and above all never spawn a reviewer to
          check your work. Self-review (below) means reading your own diff.
          Review is the controller's job: after you report, it dispatches a
          fresh reviewer against your diff. A reviewer you spawn duplicates
          that review at full cost, and its approval counts for nothing in
          the process. If you catch yourself thinking "an independent review
          would strengthen my report" — that review is already scheduled.
          Report instead.

          ## Code Organization

          You reason best about code you can hold in context at once, and your edits are more
          reliable when files are focused. Keep this in mind:
          - Follow the file structure defined in the plan
          - Each file should have one clear responsibility with a well-defined interface
          - If a file you're creating is growing beyond the plan's intent, stop and report
            it as DONE_WITH_CONCERNS — don't split files on your own without plan guidance
          - If an existing file you're modifying is already large or tangled, work carefully
            and note it as a concern in your report
          - In existing codebases, follow established patterns. Improve code you're touching
            the way a good developer would, but don't restructure things outside your task.

          ## When You're in Over Your Head

          It is always OK to stop and say "this is too hard for me." Bad work is worse than
          no work. You will not be penalized for escalating.

          **STOP and escalate when:**
          - The task requires architectural decisions with multiple valid approaches
          - You need to understand code beyond what was provided and can't find clarity
          - You feel uncertain about whether your approach is correct
          - The task involves restructuring existing code in ways the plan didn't anticipate
          - You've been reading file after file trying to understand the system without progress

          **How to escalate:** Report back with status BLOCKED or NEEDS_CONTEXT. Describe
          specifically what you're stuck on, what you've tried, and what kind of help you need.
          The controller can provide more context, re-dispatch with a more capable model,
          or break the task into smaller pieces.

          ## Before Reporting Back: Self-Review

          Review your work with fresh eyes. Ask yourself:

          **Completeness:**
          - Did I fully implement the assigned scope of the current User Request?
          - Did I miss any requirements?
          - Are there edge cases I didn't handle?

          **Quality:**
          - Is this my best work?
          - Are names clear and accurate (match what things do, not how they work)?
          - Is the code clean and maintainable?

          **Discipline:**
          - Did I avoid overbuilding (YAGNI)?
          - Did I only build what was requested?
          - Did I follow existing patterns in the codebase?

          **Testing:**
          - Do tests actually verify behavior (not just mock behavior)?
          - Did I follow TDD if required?
          - Are tests comprehensive?
          - Is the test output pristine (no stray warnings or noise)?

          If you find issues during self-review, fix, test, and commit them before reporting.

          ## After Review Findings

          If the task review finds issues, the controller sends the findings through
          supported resume or a fresh complete handoff.
          Fix them, re-run the tests that cover the amended code, commit the fixes,
          and append a fix report to your report file: what you changed, the covering tests you
          ran, the command, and the output. Reviewers will not re-run tests for
          you — your report is the test evidence. Then reply with the same short
          status contract as your first report.

          ## Report Format

          Write your full report to [REPORT_FILE]:
          - What you implemented (or what you attempted, if blocked)
          - Exact test commands, exit results, observed output, and evidence artifact paths
          - **TDD Evidence** (if TDD was required for this task):
            - RED: command run, relevant failing output before implementation, and why the failure was expected
            - GREEN: command run and relevant passing output after implementation
          - Files changed
          - Commits created (short SHA + subject)
          - Self-review findings (if any)
          - Any issues or concerns

          Then report back with ONLY (under 15 lines — the detail lives in the
          report file):
          - **Status:** DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT
          - Commits created (short SHA + subject)
          - One-line test summary (e.g. "14/14 passing, output pristine")
          - Your concerns, if any
          - The report file path

          If BLOCKED or NEEDS_CONTEXT, put the specifics in the final message
          itself — the controller acts on it directly.

          Use DONE_WITH_CONCERNS if you completed the work but have doubts about correctness.
          Use BLOCKED if you cannot complete the task. Use NEEDS_CONTEXT if you need
          information that wasn't provided. Never silently produce work you're unsure about.
      ```

      ## SDD scratch-file bash (run inside the worktree)

      TASK BRIEF — extract the complete current User Request, Global
      Constraints, and one task's full text from the plan into a file every
      implementer, fixer, and task reviewer reads in one call (usage: set PLAN
      and N first). Task brief order: ## User Request, then ## Global
      Constraints, then the selected ## Task:

      ```bash
      # task-brief: PLAN=<plan file> N=<task number>
      set -euo pipefail
      WORKTREE_PATH=${WORKTREE_PATH:-$(git rev-parse --show-toplevel)}
      cd -- "$WORKTREE_PATH"
      dir=$(git rev-parse --git-path sdd); mkdir -p "$dir"; dir=$(cd "$dir" && pwd)
      out="$dir/task-${N}-brief.md"
      tmp="$out.tmp"
      rm -f "$out" "$tmp"
      export PLAN N out tmp
      python3 - <<'PY'
      import os
      import re
      import sys
      from pathlib import Path

      plan_path = Path(os.environ["PLAN"])
      out_path = Path(os.environ["out"])
      tmp_path = Path(os.environ["tmp"])


      def fail() -> None:
          for path in (tmp_path, out_path):
              try:
                  path.unlink()
              except FileNotFoundError:
                  pass
          print("task brief structure is invalid", file=sys.stderr)
          raise SystemExit(3)


      def outside_fences(lines: list[bytes]) -> list[bool]:
          outside: list[bool] = []
          fence_char: str | None = None
          fence_length = 0
          for raw_line in lines:
              text = raw_line.rstrip(b"\r\n").decode("utf-8")
              if fence_char is not None:
                  outside.append(False)
                  closing = re.fullmatch(
                      rf"[ \t]{{0,3}}{re.escape(fence_char)}"
                      rf"{{{fence_length},}}[ \t]*",
                      text,
                  )
                  if closing is not None:
                      fence_char = None
                      fence_length = 0
                  continue

              opening = re.match(r"^[ \t]{0,3}(`{3,}|~{3,})(.*)$", text)
              if opening is None or (
                  opening.group(1).startswith("`") and "`" in opening.group(2)
              ):
                  outside.append(True)
                  continue

              outside.append(False)
              fence_char = opening.group(1)[0]
              fence_length = len(opening.group(1))
          return outside


      try:
          task_number = int(os.environ["N"])
          if task_number < 1 or str(task_number) != os.environ["N"]:
              raise ValueError

          lines = plan_path.read_bytes().splitlines(keepends=True)
          texts = [line.rstrip(b"\r\n").decode("utf-8") for line in lines]
          outside = outside_fences(lines)

          def exact(label: str) -> list[int]:
              return [
                  index
                  for index, text in enumerate(texts)
                  if outside[index] and text == label
              ]

          user = exact("## User Request")
          requested = exact("### Requested result")
          constraints = exact("### Explicit constraints")
          residuals = exact("### Accepted tradeoffs and residuals")
          if not all(
              len(indices) == 1
              for indices in (user, requested, constraints, residuals)
          ):
              raise ValueError

          global_constraints = exact("## Global Constraints")
          if len(global_constraints) != 1:
              raise ValueError
          global_start = global_constraints[0]

          goal_candidates = [
              index
              for index, text in enumerate(texts)
              if outside[index]
              and index > residuals[0]
              and index < global_start
              and re.fullmatch(r"\*\*Goal:\*\*(?:[ \t]+.*)?", text)
          ]
          if len(goal_candidates) != 1:
              raise ValueError
          goal = goal_candidates[0]
          if not (
              user[0]
              < requested[0]
              < constraints[0]
              < residuals[0]
              < goal
              < global_start
          ):
              raise ValueError

          task_pattern = re.compile(r"^### Task ([0-9]+):(?:.*)$")
          task_headings: list[tuple[int, int]] = []
          for index, text in enumerate(texts):
              if not outside[index]:
                  continue
              match = task_pattern.fullmatch(text)
              if match is not None:
                  task_headings.append((index, int(match.group(1))))

          real_tasks = [
              (index, number)
              for index, number in task_headings
              if index > global_start
          ]
          numbers = [number for _, number in real_tasks]
          if len(numbers) != len(set(numbers)):
              raise ValueError
          selected = [
              index for index, number in real_tasks if number == task_number
          ]
          if len(selected) != 1:
              raise ValueError
          task_start = selected[0]

          global_end = task_start
          for index in range(global_start + 1, task_start):
              if outside[index] and (
                  re.fullmatch(r"---[ \t]*", texts[index])
                  or re.match(r"^##(?:[ \t]|$)", texts[index]) is not None
                  or task_pattern.fullmatch(texts[index]) is not None
              ):
                  global_end = index
                  break

          task_end = len(lines)
          for index in range(task_start + 1, len(lines)):
              if not outside[index]:
                  continue
              if task_pattern.fullmatch(texts[index]) is not None or re.match(
                  r"^##(?:[ \t]|$)", texts[index]
              ):
                  task_end = index
                  break

          request_bytes = b"".join(lines[user[0] : goal])
          constraints_bytes = b"".join(lines[global_start:global_end])
          task_bytes = b"".join(lines[task_start:task_end])
          brief = request_bytes + constraints_bytes + task_bytes
          if not request_bytes or not constraints_bytes or not task_bytes:
              raise ValueError

          tmp_path.write_bytes(brief)
          os.replace(tmp_path, out_path)
      except Exception:
          fail()
      PY
      echo "wrote ${out}: $(wc -l < "$out" | tr -d ' ') lines"
      ```

      REVIEW PACKAGE — commit list, stat summary, and the net diff with extended
      context, written to a uniquely named file the reviewer reads in one call
      (usage: set BASE and HEAD_REF first; BASE = the commit recorded before the
      implementer was dispatched, never HEAD~1):

      ```bash
      # review-package: BASE=<base sha> HEAD_REF=<head sha or HEAD>
      set -euo pipefail
      WORKTREE_PATH=${WORKTREE_PATH:-$(git rev-parse --show-toplevel)}
      cd -- "$WORKTREE_PATH"
      BASE=$(git rev-parse --verify --quiet --end-of-options "${BASE}^{commit}") || { echo "invalid review base" >&2; exit 2; }
      HEAD_REF=$(git rev-parse --verify --quiet --end-of-options "${HEAD_REF}^{commit}") || { echo "invalid review head" >&2; exit 2; }
      git merge-base --is-ancestor "$BASE" "$HEAD_REF" || { echo "unrelated review range" >&2; exit 2; }
      [ "$BASE" != "$HEAD_REF" ] || { echo "empty review range" >&2; exit 2; }
      dir=${LOGS_DIR:+$LOGS_DIR/reports}
      if [ -z "$dir" ]; then dir=$(git rev-parse --git-path sdd); fi
      mkdir -p "$dir"; dir=$(cd "$dir" && pwd)
      out=$(mktemp "$dir/review-${BASE}..${HEAD_REF}.XXXXXX.diff")
      trap 'rm -f -- "$out"' ERR
      range="${BASE}..${HEAD_REF}"
      if [ "${REVIEW_SCOPE:-task}" = whole-branch ]; then range="${BASE}...${HEAD_REF}"; fi
      {
        echo "# Review package: ${BASE}..${HEAD_REF}"
        echo
        echo "## Commits"
        git log --oneline "${BASE}..${HEAD_REF}"
        echo
        echo "## Files changed"
        git diff --stat "$range"
        echo
        echo "## Diff"
        git diff -U10 "$range"
      } > "$out"
      trap - ERR
      echo "wrote ${out}: $(git rev-list --count "${BASE}..${HEAD_REF}") commit(s), $(wc -c < "$out" | tr -d ' ') bytes"
      ```


      # Test-Driven Development

      > Handle routine, reversible decisions without stopping. A blocker is a problem
      > that remains after reasonable investigation and safe alternatives leave no
      > way to complete this stage as requested. Record the blocker and return it to
      > the dispatcher. User contact belongs to the dispatcher and is reserved for
      > situations where continuing risks data loss, environmental corruption,
      > security or privacy harm, large unexpected cost, or comparable serious
      > damage.

      ## Overview

      Write the test first. Watch it fail. Write minimal code to pass. At each behavior, test-boundary, implementation, refactoring, and fix decision, check the current `## User Request`; use supporting plans and repository evidence only to fulfill it.

      **Core principle:** If you didn't watch the test fail, you don't know if it tests the right thing.

      **Violating the letter of the rules is violating the spirit of the rules.**

      ## Scope

      **When an explicitly invoked The Usual stage uses this method:**
      - New features
      - Bug fixes
      - Refactoring
      - Behavior changes

      **Exceptions requiring permission through the dispatcher:**
      - Throwaway prototypes
      - Configuration files

      The stage may classify pure documentation and mechanically generated output as exceptions only when no meaningful failing test exists. Record the reason and substitute checks performed. Treat agent instructions with testable behavior as testable even when written in Markdown.

      Thinking "skip TDD just this once"? Stop. That's rationalization.

      ## The Iron Law

      ```
      NO PRODUCTION CODE WITHOUT A FAILING TEST FIRST
      ```

      Write code before the test? Delete it. Start over.

      **No exceptions:**
      - Don't keep it as "reference"
      - Don't "adapt" it while writing tests
      - Don't look at it
      - Delete means delete

      Implement fresh from tests. Period.

      ## Red-Green-Refactor

      ```dot
      digraph tdd_cycle {
          rankdir=LR;
          red [label="RED\nWrite failing test", shape=box, style=filled, fillcolor="#ffcccc"];
          verify_red [label="Verify fails\ncorrectly", shape=diamond];
          green [label="GREEN\nMinimal code", shape=box, style=filled, fillcolor="#ccffcc"];
          verify_green [label="Verify passes\nAll green", shape=diamond];
          refactor [label="REFACTOR\nClean up", shape=box, style=filled, fillcolor="#ccccff"];
          next [label="Next", shape=ellipse];

          red -> verify_red;
          verify_red -> green [label="yes"];
          verify_red -> red [label="wrong\nfailure"];
          green -> verify_green;
          verify_green -> refactor [label="yes"];
          verify_green -> green [label="no"];
          refactor -> verify_green [label="stay\ngreen"];
          verify_green -> next;
          next -> red;
      }
      ```

      ### RED - Write Failing Test

      Write the smallest test proving the behavior required by the current User Request.

      <Good>
      ```typescript
      test('retries failed operations 3 times', async () => {
        let attempts = 0;
        const operation = () => {
          attempts++;
          if (attempts < 3) throw new Error('fail');
          return 'success';
        };

        const result = await retryOperation(operation);

        expect(result).toBe('success');
        expect(attempts).toBe(3);
      });
      ```
      Clear name, tests real behavior, one thing
      </Good>

      <Bad>
      ```typescript
      test('retry works', async () => {
        const mock = jest.fn()
          .mockRejectedValueOnce(new Error())
          .mockRejectedValueOnce(new Error())
          .mockResolvedValueOnce('success');
        await retryOperation(mock);
        expect(mock).toHaveBeenCalledTimes(3);
      });
      ```
      Vague name, tests mock not code
      </Bad>

      **Requirements:**
      - One behavior
      - Clear name
      - Real code (no mocks unless unavoidable)

      ### Verify RED - Watch It Fail

      **MANDATORY. Never skip.**

      For each RED and GREEN run, save the exact command, exit result, and observed output with execution artifacts under `logs_dir`, the caller-supplied artifact directory defined by [Bundle Interface](#bundle-interface). Return the result, evidence paths, or blocker to the caller.

      ```bash
      npm test path/to/test.test.ts
      ```

      Confirm:
      - Test fails (not errors)
      - Failure message is expected
      - Fails because feature missing (not typos)

      **Test passes?** You're testing existing behavior. Fix test.

      **Test errors?** Fix error, re-run until it fails correctly.

      ### GREEN - Minimal Code

      Write the simplest complete implementation to pass the test and fulfill the current User Request.

      <Good>
      ```typescript
      async function retryOperation<T>(fn: () => Promise<T>): Promise<T> {
        for (let i = 0; i < 3; i++) {
          try {
            return await fn();
          } catch (e) {
            if (i === 2) throw e;
          }
        }
        throw new Error('unreachable');
      }
      ```
      Just enough to pass
      </Good>

      <Bad>
      ```typescript
      async function retryOperation<T>(
        fn: () => Promise<T>,
        options?: {
          maxRetries?: number;
          backoff?: 'linear' | 'exponential';
          onRetry?: (attempt: number) => void;
        }
      ): Promise<T> {
        // YAGNI
      }
      ```
      Over-engineered
      </Bad>

      Don't add features, refactor other code, or "improve" beyond the test.

      ### Verify GREEN - Watch It Pass

      **MANDATORY.**

      ```bash
      npm test path/to/test.test.ts
      ```

      Confirm:
      - Test passes
      - Other impacted tests still pass
      - Output pristine (no errors, warnings)

      **Test fails?** Fix code, not test.

      **Other tests fail?** Classify suspected existing failures by reproducing them at the immutable `base_ref` through [Bundle Interface](#bundle-interface). Fix newly introduced failures.

      **"Other tests" means the complete impacted test set.** Use focused tests
      through RED, GREEN, and refactoring. Leave the periodic and final integrated
      checks to [Execution Coordination](#the-full-suite-gate).
      Any failure a run shows —
      including one you didn't cause — goes in your report by name; a red
      test you watched scroll past and didn't mention is a report falsified
      by omission.

      ### REFACTOR - Clean Up

      After green only:
      - Remove duplication
      - Improve names
      - Extract helpers

      Keep tests green. Don't add behavior.

      ### Repeat

      Next failing test for next feature.

      ## Good Tests

      | Quality | Good | Bad |
      |---------|------|-----|
      | **Minimal** | One thing. "and" in name? Split it. | `test('validates email and domain and whitespace')` |
      | **Clear** | Name describes behavior | `test('test1')` |
      | **Shows intent** | Demonstrates desired API | Obscures what code should do |

      When writing or changing any test, read [Writing Good Tests](#writing-good-tests) for the rules that keep tests honest:
      - Name the production change that would make the test fail — before writing it
      - Assert on real behavior, never on mock behavior
      - Keep test-only code in test utilities, out of production classes
      - Understand a dependency's side effects before mocking it

      ## Common Rationalizations

      | Excuse | Reality |
      |--------|---------|
      | "Too simple to test" | Simple code breaks. Test takes 30 seconds. |
      | "I'll test after" | Tests written after pass immediately — which proves nothing. They may test the wrong thing, test the implementation instead of the behavior, or miss the edge case you forgot. You never watched it fail, so you never proved it can catch the bug. Test-first forces that failure. |
      | "Tests after achieve same goals (spirit not ritual)" | Tests-after answer "what does this do?"; tests-first answer "what should this do?" Tests written after are biased by the code you already wrote — you verify the cases you remembered, not the ones you'd have discovered. Coverage without proof the tests work. |
      | "Already manually tested" | Manual testing is ad-hoc: no record of what you covered, no way to re-run it when the code changes, easy to forget cases under pressure. "Worked when I tried it" ≠ comprehensive. Automated tests run the same way every time. |
      | "Deleting X hours is wasteful" | Sunk cost fallacy — that time is already spent either way. The real choice: rewrite with TDD (high confidence) vs. keep it and bolt tests on after (low confidence, likely bugs). Keeping code you can't trust is the waste. |
      | "Keep as reference, write tests first" | You'll adapt it. That's testing after. Delete means delete. |
      | "Need to explore first" | Fine. Throw away exploration, start with TDD. |
      | "Test hard = design unclear" | Listen to test. Hard to test = hard to use. |
      | "TDD will slow me down" | TDD IS the pragmatic path: catches bugs before commit, prevents regressions, lets you refactor without fear. "Pragmatic" shortcuts mean debugging in production — slower, not faster. |
      | "Manual test faster" | Manual doesn't prove edge cases. You'll re-test every change. |
      | "Existing code has no tests" | You're improving it. Add tests for existing code. |

      ## Red Flags - STOP and Start Over

      - Code before test
      - Test after implementation
      - Test passes immediately
      - Can't explain why test failed
      - Tests added "later"
      - Rationalizing "just this once"
      - "I already manually tested it"
      - "Tests after achieve the same purpose"
      - "It's about spirit not ritual"
      - "Keep as reference" or "adapt existing code"
      - "Already spent X hours, deleting is wasteful"
      - "TDD is dogmatic, I'm being pragmatic"
      - "This is different because..."

      **All of these mean: Delete code. Start over with TDD.**

      ## Example: Bug Fix

      **Bug:** Empty email accepted

      **RED**
      ```typescript
      test('rejects empty email', async () => {
        const result = await submitForm({ email: '' });
        expect(result.error).toBe('Email required');
      });
      ```

      **Verify RED**
      ```bash
      $ npm test path/to/test.test.ts
      FAIL: expected 'Email required', got undefined
      ```

      **GREEN**
      ```typescript
      function submitForm(data: FormData) {
        if (!data.email?.trim()) {
          return { error: 'Email required' };
        }
        // ...
      }
      ```

      **Verify GREEN**
      ```bash
      $ npm test path/to/test.test.ts
      PASS
      ```

      **REFACTOR**
      Extract validation for multiple fields if needed.

      ## Verification Checklist

      Before returning task-level TDD evidence:

      - [ ] Every new function/method has a test
      - [ ] Watched each test fail before implementing
      - [ ] Each test failed for expected reason (feature missing, not typo)
      - [ ] Wrote minimal code to pass each test
      - [ ] All impacted tests pass except failures proven pre-existing through the run contract
      - [ ] Output pristine (no errors, warnings)
      - [ ] Tests use real code (mocks only if unavoidable)
      - [ ] Edge cases and errors covered

      Can't check all boxes? You skipped TDD. Start over.

      ## When Stuck

      | Problem | Solution |
      |---------|----------|
      | Don't know how to test | Write wished-for API. Write assertion first. Return a remaining blocker to the dispatcher. |
      | Test too complicated | Design too complicated. Simplify interface. |
      | Must mock everything | Code too coupled. Use dependency injection. |
      | Test setup huge | Extract helpers. Still complex? Simplify design. |

      ## Debugging Integration

      Bug found? Write failing test reproducing it. Follow TDD cycle. Test proves fix and prevents regression.

      Never fix bugs without a test.

      ## Final Rule

      ```
      Production code → test exists and failed first
      Otherwise → not TDD
      ```

      Apply the exception process above.

      ## Writing Good Tests

      **Load this reference when:** writing or changing tests, adding mocks, or
      adding cleanup/helper methods for tests.

      ## Overview

      A test exists to catch a specific break. Two principles govern everything
      here:

      ```
      1. Every test names the break it catches
      2. Every test exercises the real thing
      ```

      Strict TDD produces both naturally: a test written first and watched
      failing against real code has already proven it can fail, and only earns
      a mock when the real dependency proves slow or external.

      ## Principle 1: Name the Break

      Before writing the test body, answer: **what production change should
      make this test fail — and is that change a bug or a decision?** A test
      earns its place by catching a wrong branch, missing side effect, wrong
      argument, boundary case, or broken contract.

      **Derive expectations independently.** Use literals and hand-checked
      fixtures; table-driven tests with literal `want` values are the preferred
      shape. An expectation computed by the code under test — or its helpers —
      passes no matter what that code does:

      ```typescript
      // ❌ Mirror assertion: the same builder computes both sides — always true
      const expected = buildSearchQuery({ tag: 'urgent' });
      expect(buildSearchQuery({ tag: 'urgent' })).toBe(expected);

      // ✅ Hand-derived literal
      expect(buildSearchQuery({ tag: 'urgent' })).toBe('tag:"urgent"');
      ```

      **No change detectors.** If only intentional decisions can fail a test —
      a constant's value, exact message wording, private structure — it fires
      on redesign and sleeps through bugs. Test the behavior that depends on
      the decision: not `expect(MAX_RETRIES).toBe(5)` but "a failing call is
      retried 5 times and the 6th attempt never happens."

      **Behavior, not text.** Asserting that a script, skill, or config
      contains an exact line proves only that the source is the source. Run
      scripts against controlled inputs and assert outputs, side effects, or
      exit codes. Test documents that instruct agents by giving the consuming
      agent controlled scenarios and checking its actions against expected behavior;
      prose for humans earns no test at all.

      **Your code, not the framework.** Test the contract your code makes at
      its boundaries — the route you register, the query you emit, the payload
      you produce. Upstream mechanics are their maintainers' tests to write
      (the classic: asserting your router invokes a registered handler — that
      is the framework's test, not yours). When upstream behavior genuinely
      surprised you, write one narrow characterization test naming the
      assumption. The same boundary applies inside your code: constructors,
      getters, constants, and trivial forwarding earn tests only when they
      validate, normalize, default, derive, enforce, or cause side effects —
      otherwise assert the first consumer-visible result that depends on them.

      ### Gate Function

      ```
      BEFORE writing the test body:
        Name the production change that would make this test fail.

        Cannot name one            → redesign around an observable behavior
        "The source text changed"  → run the artifact and assert its effects
        Only intentional decisions → change detector; test the behavior
                                     that depends on the decision

        Confirm the expected value is derived without the code under test.
        IF it reuses the code's logic or helpers:
          Replace it with a literal or hand-checked fixture
      ```

      ## Principle 2: Exercise the Real Thing

      **The mock earns no assertions.** A mock assertion passes when the mock
      is present and fails when it is absent — it says nothing about the
      component. Assert the real component's behavior; if the mock is what you
      are checking, unmock it or delete the assertion.

      ```typescript
      // ✅ Real behavior
      expect(screen.getByRole('navigation')).toBeInTheDocument();

      // ❌ Mock existence
      expect(screen.getByTestId('sidebar-mock')).toBeInTheDocument();
      ```

      **your human partner's correction:** "Are we testing the behavior of a
      mock?"

      **Mock at the right level.** Learn every side effect of the real method
      before replacing it; mock the slow or external operation and keep what
      the test depends on real. When unsure, run the test against the real
      implementation first and observe what actually needs to happen.

      ```typescript
      // ❌ The mock swallows the config write that duplicate detection reads
      vi.mock('ToolCatalog', () => ({
        discoverAndCacheTools: vi.fn().mockResolvedValue(undefined)
      }));

      // ✅ Mock only the slow server startup; the config write stays real
      vi.mock('MCPServerManager');
      ```

      **Make doubles specific.** When arguments, call counts, or ordering are
      part of the contract, assert them — a fake that accepts anything verifies
      nothing. Give each branch (success, error, malformed) its own fixture or
      spy, so the wrong branch cannot satisfy the expectation.

      **Mirror real data completely.** Mock the complete structure as it exists
      in reality — all documented fields — not just the ones your test reads.
      Partial mocks fail silently when downstream code reads an omitted field:
      the test passes while integration breaks.

      **Production classes carry production methods only.** Cleanup that only
      tests need lives in test utilities, never as a `destroy()` on the
      production class. Ask: is this method called only from tests? Does this
      class own this resource's lifecycle? Wrong answers → test utility.

      **Prefer real components over complex mocks.** When mock setup outgrows
      the test logic, mocks miss methods the real components have, or tests
      break when the mock changes, switch to an integration test with real
      components. **your human partner's question:** "Do we need to be using a
      mock here?"

      ### Gate Function

      ```
      BEFORE adding a mock or test helper:
        List the real method's side effects; keep the ones the test
        depends on real — mock the slow/external level below them.

        Mock responses mirror the complete real structure.

        A method only tests call lives in test utilities, not production.

        About to assert on the mock itself?
          Unmock it or delete the assertion.
      ```

      ## Tests Ship With the Implementation

      The TDD cycle — failing test, minimal implementation, refactor — is what
      "complete" means. Ship the tests the behavior needs and only those:
      trivial code and human prose earn none, and a test written to satisfy
      process costs maintenance forever.

      ## The Mutation Check

      Before finishing, mentally mutate the production code; at least one test
      should fail for each realistic mutation:

      - Wrong constant or argument
      - Wrong branch handler
      - Missing state change or side effect
      - Empty or default return
      - Missing validation for zero, empty, nil, unauthorized, or malformed input

      A mutation nothing catches marks the behavior as unprotected — or the
      test as tautological.

      ## Quick Reference

      | When you... | Do |
      |-------------|-----|
      | Write any test | Name the break it catches — a bug, not a decision |
      | Build an expected value | Derive it by hand; never with the code under test |
      | Test a script or document | Run it / pressure-test its consumer; never grep its text |
      | Reach for a dependency test | Test your boundary contract, not their documented mechanics |
      | Want to assert on a mocked element | Test the real component, or unmock it |
      | Are about to mock a method | Learn its side effects; mock the slow/external level |
      | Build a mock response | Mirror the real structure completely |
      | Need cleanup only tests use | Put it in test utilities |
      | Watch mock setup balloon | Switch to an integration test with real components |
      | Finish a test file | Run the mutation check |

      ## Warning Signs

      - Setup and assertion share the same object, guaranteeing equality
      - The test can fail only through a panic, crash, or missing selector
      - The test fails on every intentional change, never on accidental breakage
      - Expected values are hidden behind loops, builders, or helpers
      - The test greps source text, or asserts a removed symbol stays removed
      - The test would still matter if only the framework remained
      - The test exists for coverage, checking no side effect or outcome
      - An assertion checks a `*-mock` test ID, or fails if you remove the mock
      - A method is called only from test files
      - Mock setup is more than half the test, or you can't explain why the mock is needed
      - Mocking "just to be safe"

      # Informed Code Review

      Handle routine, reversible decisions without stopping. A blocker is a problem
      that remains after reasonable investigation and safe alternatives leave no
      way to complete this stage as requested. Record the blocker and return it to
      the dispatcher. User contact belongs to the dispatcher and is reserved for
      situations where continuing risks data loss, environmental corruption,
      security or privacy harm, large unexpected cost, or comparable serious
      damage.

      Dispatch a code reviewer subagent to catch issues before they cascade. The reviewer gets precisely crafted context for evaluation — never your session's history.

      **Core principle:** Review early, review often.

      ## How to Request

      **1. Prepare the review inputs:**

      Consume the caller's recorded workspace, immutable `base_ref`, current User
      Request, and artifact interfaces from [Bundle Interface](#bundle-interface).
      Use the committed task base and head for task review, the previous reviewed head
      and committed fix head for re-review, and `base_ref` through the committed final
      head for whole-branch review. For whole-branch diff commands, use
      `[BASE_SHA]...[HEAD_SHA]` with `[BASE_SHA]` set to immutable `base_ref`.
      Use the caller's full-suite gate evidence for
      whole-branch review. Check the scope against the current `## User Request`;
      plans and repository evidence supply detail within that request.

      Prepare `[REVIEW_CONTEXT]` for every dispatch: the complete current User Request
      verbatim, followed by the complete [Scope Policy](#scope-policy) and
      [Turn Economy](#turn-economy) policies verbatim; then the reviewed scope,
      applicable plan or task, committed base and head, observed test commands and
      results, concrete artifact paths, applicable carried findings, and ledger
      evidence. Include all unresolved findings in informed whole-branch review.
      Append the [Review result contract](#review-result-contract) verbatim to this
      context. These are informed reviews; context-isolated Fresh Eyes belongs to the
      caller and receives its own separate package.

      Supply the complete task brief the implementer used as `[BRIEF_FILE]`, and its
      report as `[REPORT_FILE]`; for whole-branch fix review, supply the applicable
      plan as `[BRIEF_FILE]`. Generate task briefs only with TASK BRIEF in SDD
      scratch-file bash below. Keep review reports under `<logs_dir>/reports`. For `[DIFF_FILE]`, verify both commits exist,
      that the head descends from the base, and that the range contains commits;
      return a blocker for an invalid range. Use REVIEW PACKAGE in SDD scratch-file bash below to write the commit list,
      stat summary, and full net diff with ten context lines to a fresh range-specific
      artifact. Set BASE to task BASE, FIX_BASE for re-review, or immutable base_ref
      for whole-branch review; set HEAD_REF to the exact committed reviewed HEAD.
      Set REVIEW_SCOPE=whole-branch for the whole-branch three-dot diff. Pass the artifact path to the
      reviewer without loading the diff into the coordinator's context.

      **2. Dispatch code reviewer subagent:**

      Choose the [task template](#task-reviewer-prompt-template),
      [scoped re-review template](#scoped-re-review-prompt-template), or
      [whole-branch template](#code-reviewer-prompt-template) for the caller's scope.
      Fill `[WORKTREE_PATH]` with the caller's recorded absolute `worktree_path` in
      every template, and `[REVIEW_CONTEXT]` with the package above. `[MODEL]` means
      the caller-required reviewer model when specified; otherwise select a supported
      model suited to the review's scope and complexity. Preserve required provider
      settings, including `{{reviewer_provider}}`, `{{reviewer_model}}`, and
      `{{reviewer_reasoning_effort}}` (omit reasoning_effort only when empty),
      through supported delegate provider/model configuration. If required settings
      cannot be honored, return BLOCKED. Select an independent reviewer who did not implement or fix the code,
      and give it the prepared package without the coordinator's session history.

      Try the supported independent Amplifier delegate route once. If unavailable,
      try one supported alternate independent delegate route; skip mechanisms the
      environment does not support. A later attempt at
      a failed route requires a concrete change to its failed prerequisite. If these
      routes are exhausted, no report returns, or the reviewer cannot evaluate its
      scope, record a terminal execution blocker under the run contract and return
      `REVIEW_RESULT: BLOCKED` to the caller. This ends the workflow, including on
      resume; attempted execution failures leave completed review counts and verdicts
      unchanged. Preserve route diagnostics separately from substantive reviews.
      Only an independent review can satisfy this gate.

      **3. Act on feedback:**
      - Assess each finding under the scope rule; choose the simplest remedy required
        by the current User Request or the demonstrated defect.
      - Return required corrections or evidentiary rejections to the caller for the
        applicable informed re-review. Record qualifying OUT-OF-SCOPE and Minor/Nit
        OPTIONAL dispositions without another repair round.
      - Save the report, findings, dispositions, clearing evidence, and re-review
        result with run artifacts. Return counts by severity, applicable verdicts,
        report path, a short summary, and the result marker to the caller.

      ### Review result contract

      The reviewer checks the current User Request first, using the plan or task for
      supporting detail. Check requirements, code quality, test hygiene, and whether
      the implementation is the simplest complete solution. Judge concrete failures
      of requested behavior by their actual effect, including where a specification
      is silent. Recommend only the simplest necessary remedy. For each finding,
      report severity, concrete evidence, affected scope, and its disposition or the
      remaining work needed for a final disposition under the supplied scope rule.
      Treat upstream Important severity as Major when applying that rule. The
      coordinator records every finding's valid final disposition before completion.

      End the report with exactly one final line: `REVIEW_RESULT: CLEAN`,
      `REVIEW_RESULT: FINDINGS`, or `REVIEW_RESULT: BLOCKED`. CLEAN requires an
      actually performed review, evaluated required scope, no unresolved required
      findings, and passing
      requirements and quality verdicts for task or whole-branch review. Fix re-review
      must verdict every prior finding ADDRESSED or NOT ADDRESSED and inspect the
      exact fix-base-to-head delta for new breakage. Qualifying OUT-OF-SCOPE and
      Minor/Nit OPTIONAL dispositions require no repair or further round.

      BLOCKED means independent review could not be performed; code defects produce
      FINDINGS. A missing or malformed marker leaves review open: retain and assess
      substantive feedback, count an actually performed review, and obtain a valid
      result within the caller's remaining review allowance. Only a valid CLEAN
      result closes review. Execution failures consume no review rounds. At an
      exhausted repair cap, retain unresolved required findings and return the
      unsuccessful result to the caller; a recorded decision cannot clear a defect or
      extend the cap. For substantive malformed reports without a required code fix,
      obtain a corrected result from a supported independent reviewer only within the
      remaining allowance: at most five task follow-ups shared with the five repair
      rounds, or the single whole-branch follow-up shared with its one fix wave.
      Count the initial substantive review separately. Count every actually
      performed follow-up, including malformed substantive reports, in that
      follow-up allowance; do not reset it on redispatch or resume. Formatting alone never triggers a code repair. At exhaustion,
      return blocked. A BLOCKED/no-report/unavailable route terminates immediately;
      it consumes no review round and authorizes no repair or stage advance.

      ## Example

      ```
      [Just completed Task 2: Add verification function]

      You: Let me request code review before proceeding.

      [Use the recorded task base and committed head from step 1]

      [Dispatch the task reviewer with the complete package from step 1]
        DESCRIPTION: Added verifyIndex() and repairIndex() with 4 issue types
        PLAN_OR_REQUIREMENTS: Task 2 from docs/plans/deployment-plan.md
        BASE_SHA: a7981ec
        HEAD_SHA: 3df7661

      [Subagent returns]:
        Strengths: Clean architecture, real tests
        Issues:
          Important: Missing required progress indicators
          Minor: Magic number (100) for reporting interval
        Spec Compliance: Issues found
        Task quality: Needs fixes
        REVIEW_RESULT: FINDINGS

      You: [Return the finding to the caller for correction and informed fix re-review]
      ```

      ## Common Rationalizations

      | Excuse | Reality |
      |--------|---------|
      | "I'll just review the diff myself instead of dispatching a reviewer" | You're the coordinator — reviewing the diff inline burns the context window you need to keep driving the work. Dispatch a reviewer subagent: the diff and the evaluation live in its context, and only the findings come back to you. |
      | "The reviewer needs my whole session history to understand the change" | Hand it precisely crafted context, never your session's history. That keeps the reviewer on the work product, not your thought process. |

      ## Red Flags

      **Never:**
      - Skip review because "it's simple"
      - Ignore Critical issues
      - Proceed with unresolved required Important issues
      - Argue with valid technical feedback

      **If reviewer wrong:**
      - Push back with technical reasoning
      - Show code/tests that prove it works
      - Request clarification

      See template at: [Code Reviewer Prompt Template](#code-reviewer-prompt-template)

      ## Code Reviewer Prompt Template

      Use this template when dispatching an informed whole-branch reviewer subagent.

      **Purpose:** Review completed work against requirements and code quality standards before it cascades into more work.

      ```
      delegate(context_depth="none") with:
        agent: "the-usual:step-runner"
        model_role: reasoning
        instruction: |
          [REVIEW_CONTEXT]

          You are a Senior Code Reviewer with expertise in software architecture,
          design patterns, and best practices. Your job is to review completed work
          against the current User Request and identify issues before they cascade.

          ## What Was Implemented

          [DESCRIPTION]

          ## Requirements / Plan

          [PLAN_OR_REQUIREMENTS]

          ## Git Range to Review

          **Worktree:** [WORKTREE_PATH]
          Read repository files beneath this absolute path and run Git commands as
          `git -C "[WORKTREE_PATH]" ...`. Read supplied artifacts at their explicit paths.

          **Base:** [BASE_SHA]
          **Head:** [HEAD_SHA]

          ```bash
          git -C "[WORKTREE_PATH]" diff --stat [BASE_SHA]...[HEAD_SHA]
          git -C "[WORKTREE_PATH]" diff [BASE_SHA]...[HEAD_SHA]
          ```

          ## The spec is a vision document

          The spec says what the software must do. It does not enumerate every
          input, environment, or condition the software will meet. For behavior
          the spec is silent on, judge concrete failures of the requested behavior
          by their actual effect. The current User Request and supplied scope rule
          govern which findings require work.

          ## Declined to judge

          Before your verdict, list every behavior you considered and set aside
          as outside the current User Request, one line each, with the reason.
          The coordinator records each disposition under the supplied scope rule.
          An empty list means you set nothing aside.

          ## Read-Only Review

          Your review is read-only on this checkout. Do not mutate the working tree, the index, HEAD, or branch state in any way. Use `git -C "[WORKTREE_PATH]" show`, `git -C "[WORKTREE_PATH]" diff`, and `git -C "[WORKTREE_PATH]" log` to inspect history and other revisions.

          ## You Do Not Dispatch Subagents

          Do all of this review yourself. Never spawn a subagent to review part
          of the diff, and never spawn another reviewer for a second opinion.
          This process already provides every review seat the work gets; a
          reviewer you spawn duplicates one of them at full cost, and its
          verdict counts for nothing. If the diff feels too large for one
          pass, review it in passes yourself and say so in your report.

          ## What to Check

          **Plan alignment:**
          - Does the implementation match the current User Request, using the plan for detail?
          - Are deviations justified improvements, or problematic departures?
          - Is all requested functionality present?

          **Code quality:**
          - Clean separation of concerns?
          - Proper error handling?
          - Type safety where applicable?
          - DRY without premature abstraction?
          - Edge cases handled?

          **Architecture:**
          - Sound design decisions?
          - Reasonable scalability and performance?
          - Security concerns?
          - Integrates cleanly with surrounding code?

          **Testing:**
          - Tests verify real behavior, not mocks?
          - Edge cases covered?
          - Integration tests where they matter?
          - All tests passing?

          **Production readiness:**
          - Migration strategy if schema changed?
          - Backward compatibility considered?
          - Documentation complete?
          - No obvious bugs?

          ## Calibration

          Categorize issues by actual severity. Not everything is Critical.
          Acknowledge what was done well before listing issues — accurate praise
          helps the implementer trust the rest of the feedback.

          If you find significant deviations from the plan, flag them specifically
          so the implementer can confirm whether the deviation was intentional.
          If you find issues with the plan itself rather than the implementation,
          say so.

          ## Output Format

          ### Strengths
          [What's well done? Be specific.]

          ### Issues

          #### Critical (Must Fix)
          [Bugs, security issues, data loss risks, broken functionality]

          #### Important (Should Fix)
          [Architecture problems, missing features, poor error handling, test gaps]

          #### Minor (Nice to Have)
          [Code style, optimization opportunities, documentation polish]

          For each issue:
          - File:line reference
          - What's wrong
          - Why it matters
          - How to fix (if not obvious)

          ### Recommendations
          [The simplest remedies needed for the current User Request or demonstrated defects]

          ### Assessment

          **Requirements:** [Pass | Needs fixes]
          **Whole-branch quality:** [Approved | Needs fixes]

          **Reasoning:** [1-2 sentence technical assessment]

          REVIEW_RESULT: [CLEAN | FINDINGS | BLOCKED]

          ## Critical Rules

          **DO:**
          - Categorize by actual severity
          - Be specific (file:line, not vague)
          - Explain WHY each issue matters
          - Acknowledge strengths
          - Give a clear verdict

          **DON'T:**
          - Say "looks good" without checking
          - Mark nitpicks as Critical
          - Give feedback on code you didn't actually read
          - Be vague ("improve error handling")
          - Avoid giving a clear verdict
      ```

      **Placeholders:**
      - `[REVIEW_CONTEXT]` — the complete context prepared in step 1, including the result contract
      - `[WORKTREE_PATH]` — the caller's recorded absolute worktree_path
      - `[DESCRIPTION]` — brief summary of what was built
      - `[PLAN_OR_REQUIREMENTS]` — what it should do (plan file path, task text, or requirements)
      - `[BASE_SHA]` — starting commit
      - `[HEAD_SHA]` — ending commit

      **Reviewer returns:** Strengths, Issues (Critical / Important / Minor), Recommendations, Assessment, requirements and quality verdicts, final result marker

      ## Example Output

      ```
      ### Strengths
      - Clean database schema with proper migrations (db.ts:15-42)
      - Comprehensive test coverage (18 tests, all edge cases)
      - Good error handling with fallbacks (summarizer.ts:85-92)

      ### Issues

      #### Important
      1. **Missing help text in CLI wrapper**
         - File: index-conversations:1-31
         - Issue: No --help flag, users won't discover --concurrency
         - Fix: Add --help case with usage examples

      2. **Date validation missing**
         - File: search.ts:25-27
         - Issue: Invalid dates silently return no results
         - Fix: Validate ISO format, throw error with example

      #### Minor
      1. **Progress indicators**
         - File: indexer.ts:130
         - Issue: No "X of Y" counter for long operations
         - Impact: Users don't know how long to wait

      ### Recommendations
      - OPTIONAL: Progress indicators would improve feedback during long operations. They are not required by the current User Request.

      ### Assessment

      **Requirements: Needs fixes**
      **Whole-branch quality: Needs fixes**

      **Reasoning:** Core implementation is solid with good architecture and tests. Important issues (help text, date validation) are easily fixed and don't affect core functionality.
      REVIEW_RESULT: FINDINGS
      ```

      ## Task Reviewer Prompt Template

      Use this template when dispatching a task reviewer subagent. The reviewer
      reads the task's diff once and returns two verdicts: spec compliance and
      code quality.

      **Purpose:** Verify one task's implementation matches its requirements (nothing
      more, nothing less) and is well-built (clean, tested, maintainable)

      ```
      delegate(context_depth="none") with:
        agent: "the-usual:step-runner"
        model_role: [MODEL_ROLE — REQUIRED: choose in step 2; an omitted
               model_role silently inherits the session's most expensive one]
        instruction: |
          [REVIEW_CONTEXT]

          You are reviewing one task's implementation: first whether it matches its
          requirements, then whether it is well-built. This is a task-scoped gate,
          and you return both verdicts to the coordinator.

          ## What Was Requested

          Read the task brief: [BRIEF_FILE]

          Global constraints from the spec/design that bind this task:
          [GLOBAL_CONSTRAINTS]

          ## What the Implementer Claims They Built

          Read the implementer's report: [REPORT_FILE]

          ## Diff Under Review

          **Worktree:** [WORKTREE_PATH]
          Read repository files beneath this absolute path and run Git commands as
          `git -C "[WORKTREE_PATH]" ...`. Read supplied artifacts at their explicit paths.

          **Base:** [BASE_SHA]
          **Head:** [HEAD_SHA]
          **Diff file:** [DIFF_FILE]

          Read the diff file once — it contains the commit list, a stat summary,
          and the full diff with surrounding context, and it is your view of the
          change. The diff's context lines ARE the changed files: do not Read a
          changed file separately unless a hunk you must judge is cut off
          mid-function — and say so in your report. Do not re-run git commands.
          If the diff file is missing, fetch the diff yourself:
          `git -C "[WORKTREE_PATH]" diff --stat [BASE_SHA]..[HEAD_SHA]` and `git -C "[WORKTREE_PATH]" diff [BASE_SHA]..[HEAD_SHA]`.
          Do not crawl the broader codebase. Inspect code outside the diff only
          to evaluate a concrete risk you can name — one focused check per named
          risk, and name both the risk and what you checked in your report.
          Cross-cutting changes are legitimate named risks: if the diff changes
          lock ordering, a function or API contract, or shared mutable state,
          checking the call sites is the right method.

          Your review is read-only on this checkout. Do not mutate the working
          tree, the index, HEAD, or branch state in any way.

          ## You Do Not Dispatch Subagents

          Do all of this review yourself. Never spawn a subagent to review part
          of the diff, and never spawn another reviewer for a second opinion.
          This process already provides every review seat the work gets; a
          reviewer you spawn duplicates one of them at full cost, and its
          verdict counts for nothing. If the diff feels too large for one
          pass, review it in passes yourself and say so in your report.

          ## Do Not Trust the Report

          Treat the implementer's report as unverified claims about the code. It
          may be incomplete, inaccurate, or optimistic. Verify the claims against
          the diff. Design rationales in the report are claims too: "left it per
          YAGNI," "kept it simple deliberately," or any other justification is the
          implementer grading their own work. Judge the code on its merits — a
          stated rationale never downgrades a finding's severity.

          ## Tests

          The implementer already ran the tests and reported results with TDD
          evidence for exactly this code. Do not re-run the suite to confirm their
          report. Run a test only when reading the code raises a specific doubt
          that no existing run answers — and then a focused test, never a
          package-wide suite, race detector run, or repeated/high-count loop. If
          heavy validation seems warranted, recommend it in your report instead of
          running it. If you cannot run commands in this environment, name the
          test you would run.

          Warnings or other noise in the implementer's reported test output are
          findings — test output should be pristine.

          Evidence you cannot see is not evidence that doesn't exist. If the
          report or its test evidence looks truncated, or you cannot locate the
          results it claims, re-read the file at its stated path — and if it is
          genuinely missing or garbled, report that as a gap for the controller.
          Re-running the suite to regenerate what you failed to read is not
          verification; illegibility of the evidence is not invalidation of it.

          ## Part 1: Spec Compliance

          Compare the diff against the current User Request first, then What Was Requested:

          - **Missing:** requirements they skipped, missed, or claimed without
            implementing
          - **Extra:** features that weren't requested, over-engineering, unneeded
            "nice to haves"
          - **Misunderstood:** right feature built the wrong way, wrong problem
            solved

          If the brief lists several files each with its own change (a batched
          dispatch), check the diff against that list file by file: every listed
          file must have its corresponding hunk. A listed file the diff never
          touches is a Missing finding, no matter how clean the rest of the
          batch looks.

          If a requirement cannot be verified from this diff alone (it lives in
          unchanged code or spans tasks), report it as a ⚠️ item instead of
          broadening your search.

          ## Part 2: Code Quality

          **Code quality:**
          - Clean separation of concerns?
          - Proper error handling?
          - DRY without premature abstraction?
          - Edge cases handled?

          **Tests:**
          - Do the new and changed tests verify real behavior, not mocks?
          - Are the task's edge cases covered?

          **Structure:**
          - Does each file have one clear responsibility with a well-defined interface?
          - Are units decomposed so they can be understood and tested independently?
          - Is the implementation following the file structure from the plan?
          - Did this change create new files that are already large, or
            significantly grow existing files? (Don't flag pre-existing file
            sizes — focus on what this change contributed.)

          Your report should point at evidence: file:line references for every
          finding and for any check you would otherwise answer with a bare
          "yes." A tight report that cites lines gives the controller everything
          it needs.

          Your final message is the report itself: begin directly with the
          spec-compliance verdict. Every line is a verdict, a finding with
          file:line, or a check you ran — no preamble, no process narration,
          no closing summary.

          ## Calibration

          Categorize issues by actual severity. Not everything is Critical.
          Important means this task cannot be trusted until it is fixed: incorrect
          or fragile behavior, a missed requirement, or maintainability damage you
          would block a merge over — verbatim duplication of a logic block,
          swallowed errors, tests that assert nothing. "Coverage could be broader"
          and polish suggestions are Minor.
          If the plan or brief explicitly mandates something this rubric calls a
          defect (a test that asserts nothing, verbatim duplication of a logic
          block), that IS a finding — report it as Important, labeled
          plan-mandated. The coordinator assesses the finding against the current
          User Request and supplied scope rule.
          Acknowledge what was done well before listing issues — accurate praise
          helps the implementer trust the rest of the feedback.

          ## Output Format

          ### Spec Compliance

          - ✅ Spec compliant | ❌ Issues found: [what's missing/extra/misunderstood,
            with file:line references]
          - ⚠️ Cannot verify from diff: [requirements you could not verify from the
            diff alone, and what the controller should check — report alongside the
            ✅/❌ verdict for everything you could verify]

          ### Strengths
          [What's well done? Be specific.]

          ### Issues

          #### Critical (Must Fix)
          #### Important (Should Fix)
          #### Minor (Nice to Have)

          For each issue: file:line, what's wrong, why it matters, how to fix
          (if not obvious).

          ### Assessment

          **Task quality:** [Approved | Needs fixes]

          **Reasoning:** [1-2 sentence technical assessment]

          REVIEW_RESULT: [CLEAN | FINDINGS | BLOCKED]
      ```

      **Placeholders:**
      - `[REVIEW_CONTEXT]` — the complete context prepared in step 1, including the result contract
      - `[WORKTREE_PATH]` — the caller's recorded absolute worktree_path
      - `[MODEL_ROLE]` — REQUIRED: explicit fast/coding/reasoning role selected in step 2
      - `[BRIEF_FILE]` — REQUIRED: the complete task brief from step 1, the same file the implementer worked from
      - `[GLOBAL_CONSTRAINTS]` — the binding requirements copied verbatim from
        the plan's Global Constraints section or the spec: exact values, formats,
        and stated relationships between components (not process rules — those
        are already in this template)
      - `[REPORT_FILE]` — REQUIRED: the file the implementer wrote its detailed
        report to
      - `[BASE_SHA]` — commit before this task
      - `[HEAD_SHA]` — current commit
      - `[DIFF_FILE]` — REQUIRED: the review artifact prepared in step 1; the diff stays outside the coordinator's context

      **Reviewer returns:** Spec Compliance verdict (✅/❌/⚠️), Strengths, Issues
      (Critical/Important/Minor), Task quality verdict

      ## Scoped Re-Review Prompt Template

      Use this template when dispatching a re-review after a fix round. The
      re-reviewer verifies the findings were addressed and checks the fix diff for
      new breakage. It is not a fresh review — the full review already happened.

      **Purpose:** Verify each finding from the previous review was addressed, and
      that the fix itself broke nothing.

      ```
      delegate(context_depth="none") with:
        agent: "the-usual:step-runner"
        model_role: [MODEL_ROLE — REQUIRED: choose in step 2; an omitted
               model_role silently inherits the session's most expensive one]
        instruction: |
          [REVIEW_CONTEXT]

          You are re-reviewing the supplied scope's fix round. A previous review produced
          findings; an implementer has attempted to fix them. Your job is to
          verdict each finding and inspect the fix diff — nothing else.

          ## The Task

          Read the applicable task brief or plan: [BRIEF_FILE]

          ## The Findings Under Verification

          [FINDINGS]

          ## The Fix

          **Worktree:** [WORKTREE_PATH]
          Read repository files beneath this absolute path and run Git commands as
          `git -C "[WORKTREE_PATH]" ...`. Read supplied artifacts at their explicit paths.

          Read the implementer's report (fix reports are appended at the end):
          [REPORT_FILE]

          **Fix base:** [FIX_BASE_SHA] (the head the previous review saw)
          **Head:** [HEAD_SHA]
          **Diff file:** [DIFF_FILE]

          Read the diff file once — it contains the fix commits, a stat summary,
          and the fix diff with surrounding context. Do not re-run git commands.
          If the diff file is missing, fetch the diff yourself:
          `git -C "[WORKTREE_PATH]" diff --stat [FIX_BASE_SHA]..[HEAD_SHA]` and
          `git -C "[WORKTREE_PATH]" diff [FIX_BASE_SHA]..[HEAD_SHA]`.

          Your review is read-only on this checkout. Do not mutate the working
          tree, the index, HEAD, or branch state in any way.

          ## You Do Not Dispatch Subagents

          Do all of this review yourself. Never spawn a subagent to review part
          of the diff, and never spawn another reviewer for a second opinion.
          This process already provides every review seat the work gets; a
          reviewer you spawn duplicates one of them at full cost, and its
          verdict counts for nothing. If the diff feels too large for one
          pass, review it in passes yourself and say so in your report.

          ## Scope

          Your scope is the findings list and the fix diff. Verdict every finding.
          Inspect the fix diff for new problems the fix itself introduced. Do NOT
          re-review code the fix did not touch: if you notice an issue entirely
          outside the fix diff, report it under Out-of-Scope Observations — it
          does not block this fix round and does not extend the loop. Return
          these observations to the caller for its broader review scope.

          ## Tests

          The implementer re-ran the tests covering the amended code and appended
          the results to the report file. Treat the report as unverified claims:
          confirm the fix report names the covering tests and shows their output,
          and verify the claims against the diff. Do not re-run the suite to
          confirm their report. Run a test only when reading the code raises a
          specific doubt that no existing run answers — and then a focused test,
          never a package-wide suite.

          ## Output Format

          Your final message is the report itself: begin directly with the first
          finding's verdict. Every line is a verdict, a finding with file:line,
          or a check you ran — no preamble, no process narration.

          ### Finding Verdicts

          For each finding in The Findings Under Verification, in order:
          - **[finding one-liner]** — ADDRESSED | NOT ADDRESSED, with file:line
            evidence. "Attempted" is not addressed: the specific defect must no
            longer exist.

          ### New Breakage in the Fix Diff

          Anything the fix itself broke or introduced, with severity
          (Critical/Important/Minor) and file:line. "None" if clean.

          ### Out-of-Scope Observations

          Issues you noticed entirely outside the fix diff. Non-blocking; the
          controller ledgers these for the final review. "None" if none.

          ### Verdict

          **Fix round:** [All findings addressed, no new Critical/Important
          breakage | Findings remain open] — list the open ones.

          REVIEW_RESULT: [CLEAN | FINDINGS | BLOCKED]
      ```

      **Placeholders:**
      - `[REVIEW_CONTEXT]` — the complete context prepared in step 1, including the result contract
      - `[WORKTREE_PATH]` — the caller's recorded absolute worktree_path
      - `[SCOPE]` — the caller's task or whole-branch fix scope
      - `[ROUND]` — the caller's existing fix-round number
      - `[MODEL_ROLE]` — REQUIRED: explicit fast/coding/reasoning role selected in step 2; scoped
        re-reviews of small fix diffs take a cheap-to-mid tier
      - `[BRIEF_FILE]` — the applicable task brief or plan supplied in step 1
      - `[FINDINGS]` — the Critical/Important findings and spec gaps from the
        previous review, copied verbatim, one per bullet
      - `[REPORT_FILE]` — the implementer's report file (fix reports appended)
      - `[FIX_BASE_SHA]` — the head the previous review saw
      - `[HEAD_SHA]` — current commit
      - `[DIFF_FILE]` — the exact fix-base-to-head review artifact prepared in step 1

      **Re-reviewer returns:** per-finding verdicts (ADDRESSED / NOT ADDRESSED),
      new breakage in the fix diff, out-of-scope observations, and a round verdict.

      Cross-cutting rules (enforce in every dispatch and fix):
      - NEVER reduce test coverage or skip/disable tests to make things pass.
      - Preserve unrelated changes from other agents in the same repo.
      - Commits stay focused and atomic.
      - README.md is the only end-user markdown doc unless the user requested others.
      - Runtime methodology is in the named inline sections above.
      - Do not start implementation on main/master.

      Return ONLY a JSON object (no prose, no fences) with exactly
      (total_tasks = the total task count from the plan):
      {
        "blocked": "true|false",
        "blocked_reason": "<empty unless blocked; then the specific blocker>",
        "tasks_completed": 0,
        "total_tasks": 0,
        "final_review_verdict": "<the final whole-branch reviewer's verdict, or 'n/a' if blocked>",
        "execution_notes": "<2-4 sentence factual summary of what was built and any concerns>"
      }

  # ---- Collect: file-based pickup of the execute output contract (same
  # rationale as load-bearing-collect; the execute step is the longest-running
  # and most compaction-prone step in the pipeline).
  - id: "execute-collect"
    type: "bash"
    output: "execute_result"
    parse_json: true
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
    command: |
      if [ -s "$LOGS_DIR/execute-result.json" ]; then
        result_file="$LOGS_DIR/execute-result.json"
      elif [ -s "$LOGS_DIR/pending-output.json" ] && grep -q -- '"blocked"' "$LOGS_DIR/pending-output.json"; then
        printf '%s\n' "WARNING: execute-result.json missing; using pending-output.json anchor" >&2
        result_file="$LOGS_DIR/pending-output.json"
      else
        printf '%s\n' "FATAL: execution output is missing after the execute step" >&2
        exit 1
      fi
      python3 - "$result_file" <<'PY'
      import json
      import sys
      from pathlib import Path

      try:
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
      except (OSError, json.JSONDecodeError):
          print("FATAL: execution output is invalid", file=sys.stderr)
          raise SystemExit(1)
      if not isinstance(result, dict):
          print("FATAL: execution output is invalid", file=sys.stderr)
          raise SystemExit(1)
      if str(result.get("blocked", "")).lower() == "true":
          print(
              "HALT: execution stopped per 'When to Stop and Ask for Help'.",
              file=sys.stderr,
          )
          print(
              "Inspect the durable execution logs and progress ledger for details.",
              file=sys.stderr,
          )
          raise SystemExit(1)
      print(json.dumps(result, separators=(",", ":")))
      PY
    on_error: "fail"

  # ===========================================================================
  # STEP 5 — fresheyes on the DELTA (worktree vs original fork; max 5, PASS-early)
  #
  # Same reviewer prompt as Step 3, inlined verbatim, with the scope already
  # substituted for the branch delta.
  # ===========================================================================
  - id: "fresheyes-delta-resume-guard"
    type: "bash"
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
      WORKTREE: "{{workspace.worktree_path}}"
      REVIEW_TARGET: "delta"
      REVIEW_PHASE: "pre"
      REVIEW_RESULT: "{}"
      REVIEW_BLOCKED: "false"
      REVIEW_PASSED: "false"
    command: *review_execution_guard
    on_error: "fail"

  - id: "fresheyes-delta"
    # The agent that executes this step's instructions (this stage's worker).
    agent: "the-usual:step-runner"
    timeout: 864000
    output: "fresheyes_delta_result"
    parse_json: true
    while_condition: "{{delta_passed}} != 'true' and {{delta_execution_blocked}} != 'true'"
    max_while_iterations: 5
    break_when: "{{delta_passed}} == 'true' or {{delta_execution_blocked}} == 'true' or {{fresheyes_delta_result.verdict}} == 'PASSED'"
    update_context:
      delta_passed: "{{fresheyes_delta_result.passed}}"
      delta_execution_blocked: "{{fresheyes_delta_result.execution_blocked}}"
    prompt: |
      CRITICAL OUTPUT CONTRACT — read first. Your FINAL message must contain
      exactly the JSON block specified below — this is a verbatim copy of
      the contract in the "Return ONLY a JSON object" section at the end of
      these instructions, and it is authoritative even if everything below
      it has been compacted out of your context. Work is judged failed
      without it, regardless of quality.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "passed": "true|false",
        "execution_blocked": "true|false",
        "verdict": "PASSED|FAILED|NO_MARKER|NOT_RUN",
        "rounds_completed": 0,
        "blocking_count": 0,
        "blocked_target": "<plan|delta|focused on failure; otherwise empty>",
        "blocker_reason": "<execution failure reason; otherwise empty>",
        "evidence_paths": [],
        "report_path": "<last completed report path; empty when NOT_RUN>",
        "summary": "<one-line findings or execution-blocker summary>"
      }

      DURABLE RESULT / RECOVERY — before any dispatch, repair, commit, or gate,
      inspect {{workspace.logs_dir}}/review-execution-blocker.json and all
      fresheyes-*-result.json receipts. An execution blocker remains terminal
      on resume; do not retry exhausted review routes or start later stages.
      Only evidence recording and recap remain authorized after that stop.
      Return this target's blocked receipt immediately, retaining its completed
      count and last completed verdict (NOT_RUN/0 if none). If the blocker is
      focused, return a blocked delta receipt without another delta dispatch.

      Reconcile pending-output.json against the durable review logs, reports,
      receipts, and fix commits BEFORE writing an anchor. Artifacts govern;
      correct the cache, never the artifacts. Reuse a completed round whose
      final response was lost; do not redo review or repairs. Count substantive
      rounds in the log, not engine iterations or execution-attempt entries;
      enforce the 5-round cap across replay/resume as well as this invocation.
      If a prior valid PASSED round or the cap already closed this target,
      emit its reconciled receipt without another dispatch.

      Then maintain {{workspace.logs_dir}}/pending-output.json as the output
      anchor and a todo "FINAL ACT: emit completed output JSON as my last
      message". Persist the completed contract JSON atomically to
      {{workspace.logs_dir}}/fresheyes-delta-result.json after each
      substantive review (before remediation), update it after dispositions,
      and read it back before returning the identical JSON. Persist failures
      before returning too. Never replace a real receipt with a placeholder.
      Focused reviews use fresheyes-focused-result.json with the same fields;
      rounds_completed there is the total completed focused rounds across
      episodes (at most 25); the log retains each episode's separate 5-round cap.

      DELEGATION MANDATE (fixed policy — no discretion). Reason: this step
      agent's context is the scarcest resource in the pipeline; exploration
      belongs in disposable subagent contexts. If understanding or fixing
      the reviewer's blocking issues requires repository exploration, it
      MUST go through the delegate tool (foundation:explorer for surveys
      and any multi-file reading; one delegate per topic; parallel when
      independent) — do NOT read repository files directly and do NOT use
      bash/grep/glob for exploration. Direct file access is permitted ONLY
      for: files this step itself writes (the plan file, pending-output.json,
      logs), reading back your own artifacts, and git/build/test commands
      via bash. EXPLORER REPORT PROTOCOL: instruct every delegated explorer
      to WRITE its full report to {{workspace.logs_dir}}/reports/<topic>.md
      (mkdir -p the reports dir first) and RETURN only that file path plus a
      summary of at most ~500 tokens; work from summaries with bounded reads.

      Run ONE fresheyes review iteration on the DELTA between the original fork
      point and current HEAD. The reviewer gets zero conversation context, a
      different model family than this session, and EXACTLY the instruction text
      between the BEGIN/END markers below — nothing added, nothing removed.

      PROGRESS BANNER (mandatory, fixed policy — no discretion): FIRST, before
      any other work, print the following banner as plain visible response text
      (never inside a tool call, never in a file), with a blank line above
      and below the block so it separates from surrounding output. Determine i by counting the
      iteration entries already recorded in the fresheyes-delta.md log file,
      plus 1 (i = 1 if the file does not exist yet):

      ==================================================================
      ==================================================================
      >>> THE USUAL | STAGE 5/6: FRESH EYES ON DELTA — review i of up to 5 (independent cross-model review)
      >>> Dispatching an independent reviewer against the full branch delta
      >>> One cross-model review dispatch plus any fixes — this may take a while
      ==================================================================
      ==================================================================

      This banner covers both the review dispatch and any fixes that follow it
      in this iteration. NOT announced (no extra banners; do not improvise):
      verdict parsing, commits, and fix work.

      Focused repair-review rounds (item (f) below) have their own banner,
      printed once per focused round before its dispatch (N = episode number,
      j = focused round within the episode):

      ==================================================================
      ==================================================================
      >>> THE USUAL | STAGE 5/6: FOCUSED REPAIR REVIEW — episode N, round j of up to 5 (independent cross-model review)
      >>> Reviewing the committed repairs from the failed delta round
      >>> One cross-model review dispatch plus any fixes — this may take a while
      ==================================================================
      ==================================================================

      Stage timing (append-only bookkeeping; the recap turns these lines into
      its Results table). The log is {{workspace.logs_dir}}/stage-timing.txt,
      one space-separated line per event: `<stage> started|completed
      <ISO-8601 UTC>` — stamp with `date -u +%FT%TZ`.
      - As your FIRST action after the anchor setup, append
        `delta-review started <ts>` ONLY if the file has no
        `delta-review started ` line yet — the while-loop re-enters this step
        each round and a retried or recovered attempt keeps the original
        timestamp.
      - Append `delta-review completed <ts>` once, at the end of the round
        that ENDS the loop for this run: a round that records PASSED, or the
        final allowed round (round 5), or execution failure (record that
        closure reason). Never between rounds.
      - Never edit, rewrite, or delete existing lines.

      Worktree:      {{workspace.worktree_path}}
      Original fork: {{workspace.base_ref}}
      Logs dir:      {{workspace.logs_dir}}

      Re-read the committed plan now. Extract the complete current
      `## User Request` block and keep it verbatim for this entire round. The
      parent may have updated the plan after a prior blocking call returned or
      was interrupted; current plan content governs. Reviewer receives the
      complete current User Request block verbatim. Remediation receives the
      complete current User Request block verbatim. Neither receives a summary
      or relevance-filtered subset.

      {{scope_rule}} Findings bind; reviewer
      remedies advise. The remediation actor chooses the proportionate response
      within the current User Request while satisfying each finding's clearance
      condition.

      {{turn_economy}}

      (a) COMMIT FIRST: ensure all work in the worktree is committed before
          review. Do not commit anything under the logs dir.

      (b) DELEGATE THE REVIEW: first verify the configured reviewer is a
          DIFFERENT model family than the actual executor for this session —
          {{reviewer_provider}}/{{reviewer_model}}. Independence is the point
          of this step, so a same-family selection is rejected, not run: treat
          it as an execution blocker under (c), without consuming a round.
          Use only the native delegate's supported route policy and the
          configured provider/model. Do not invent an external provider fallback
          or retry outside that policy. Otherwise call the delegate tool with:
            - agent = "the-usual:step-runner" (the registered generic target).
            - instruction = the exact text between the BEGIN/END markers below
              (markers excluded), and NOTHING more.
            - context_depth = "none"
            - provider_preferences = [ { "provider": "{{reviewer_provider}}",
                                         "model": "{{reviewer_model}}",
                                         "config": { "reasoning_effort": "{{reviewer_reasoning_effort}}" } } ]
              (provider_preferences pins the reviewer model and its reasoning
              effort, so no model_role is needed on this dispatch; if
              reviewer_reasoning_effort is empty, omit the "config" entry)
            - No specialized reviewer agent/persona; general-purpose target only.
          NOTE: the reviewer's working directory is NOT guaranteed to be the
          worktree, which is why the verbatim instruction below carries the
          worktree path itself. Still send the block verbatim — nothing added,
          nothing removed.

      ---------- BEGIN REVIEWER INSTRUCTION (send verbatim) ----------
      {{fresheyes_reviewer_head}}

      The repository under review is a git worktree at {{workspace.worktree_path}}. Your current working directory may be a DIFFERENT directory, so run every git command as `git -C {{workspace.worktree_path}} ...` (or cd into that path first), and read every repository file (AGENTS.md, README.md, related source) from under that path.

      Review the changes between {{workspace.base_ref}} and the worktree's HEAD using `git -C {{workspace.worktree_path}} diff {{workspace.base_ref}}...HEAD`.

      Empty-diff sanity check: before concluding there are no changes, run `git -C {{workspace.worktree_path}} rev-parse HEAD` and compare it to {{workspace.base_ref}}. If the SHAs differ but the diff appears empty, your command targeted the wrong directory (not the worktree) — re-run it with the `-C {{workspace.worktree_path}}` flag rather than failing with "no changes found".

      CURRENT USER REQUEST (complete block, pasted verbatim from the committed plan):
      [paste the complete current User Request block here]

      {{turn_economy}}

      {{fresheyes_reviewer_body}}
      ---------- END REVIEWER INSTRUCTION ----------

      (c) CHECK EXECUTION BEFORE COUNTING A ROUND: same-family refusal,
          unavailable delegate/reviewer, exhausted supported routes, no report,
          timeout, or explicit unable-to-review text is an execution failure,
          even with a FAILED or PASSED marker. Apply this check before verdict
          handling, round accounting, or remediation. Independent task/fix/
          whole-branch review and context-isolated cross-family Fresh Eyes are
          distinct gates; neither substitutes for the other or for self-review.

          Preserve all reports, diagnostics, events, and existing artifacts.
          Record the target, attempted native delegate routes, delegate status,
          blocker reason, and evidence paths in an execution-attempt entry
          separate from substantive round entries in the target's review log.
          Do not manufacture findings, increment any review counter, replace
          the last completed verdict, invoke repair, retry exhausted routes,
          or substitute self-review. Use NOT_RUN with zero rounds when no
          review completed; otherwise retain the last completed verdict and
          count. Keep any partial observations as evidence, not repair work.
          Write the target receipt with execution_blocked="true", passed="false",
          blocked_target, blocker_reason, and evidence_paths. Then atomically
          create {{workspace.logs_dir}}/review-execution-blocker.json containing
          target, reason, attempted_routes (array), delegate_status, and
          evidence_paths (array). Never clear or overwrite terminal evidence.
          For focused failure also persist a blocked delta receipt, retaining
          the delta's completed count, verdict, and last completed report.
          Return the blocked step receipt IMMEDIATELY. Only evidence recording
          and an unsuccessful recap may follow: no further implementation,
          review, repair, or gate work. No full-suite work after execution failure.

          For a performed review, format problems are logged as warnings and
          never discard a substantive report or turn it into execution failure.
          Count that review even with NO_MARKER and assess its findings under
          the normal bounded review logic below. Save the full report under
          the existing logs and set report_path before any remediation.
          - PASSED: the report ends with INDEPENDENT CODE REVIEW PASSED, has an
            Issues Found section, and lists no Critical or Major finding.
          - FAILED: the report ends with INDEPENDENT CODE REVIEW FAILED, or it
            ends with the PASSED marker but lists a Critical or Major finding.
          - NO_MARKER: no final marker, conflicting markers, or a PASSED marker
            without an Issues Found section. A nits-only report without the
            marker is not a pass.
          Every substantive report is feedback. Whatever its verdict or format,
          record and assess every finding it contains. Only a PASSED verdict
          successfully ends the loop; execution failure stops the workflow
          separately. For ordinary receipts execution_blocked="false",
          blocked_target and blocker_reason are empty. Set passed="true" only
          for a valid PASSED verdict with all binding findings dispositioned.

      (d) DURABLY RECORD EVERY SEVERITY in
          `{{workspace.logs_dir}}/fresheyes-delta.md`. For every Critical,
          Major, Minor, and Nit finding record severity, location, description,
          assessment (`substantiated` or `unsubstantiated`),
          disposition/status, and clearing evidence. Also record the raw
          verdict, reviewer summary, reviewer identity label actually used
          ({{reviewer_provider}}/{{reviewer_model}}, or the override in force),
          and the Reviewed head (the full HEAD SHA the review covered — a failed
          delta round's Reviewed head is the focused loop's repair base).
          Read prior entries first. Every finding is durably recorded and
          assessed. Unresolved substantiated findings are carried until explicit
          clearance across context-free rounds; a later PASSED cannot erase
          prior unresolved findings.

      (e) ASSESS EVERY REPORTED FINDING, at every severity. An unsubstantiated
          disposition requires concrete counter-evidence. Every substantiated
          finding remains binding until it reaches a valid final disposition —
          CLEARED, UNSUBSTANTIATED, OUT-OF-SCOPE, or (Minor and Nit findings
          only) OPTIONAL — and never use a finding's severity alone to discard
          it. Reviewer remedy proposals are advisory technical input, not
          automatic work authorization.
          - If the raw verdict is FAILED or NO_MARKER, fix, replace, simplify,
            or remove the implicated work as appropriate. Do not reduce test
            coverage or skip tests to pass. Verify every change with focused
            and impacted tests, preserve unrelated work, COMMIT focused fixes,
            and report `passed=false` so the next independent round reviews the
            result.
          - Before reporting the round for re-review, self-audit only the
            regions the remediation just edited: every literal, count,
            cross-reference, and inline command there must stay consistent with
            the whole artifact and with every file the fix touched. Late-loop
            findings are typically new inconsistencies introduced by remediation
            edits, not missed defects in the original work.
          - If the raw verdict is PASSED, the loop ends: it authorizes no
            further fixes and no further rounds. Reconcile every current and
            carried finding explicitly and record a final disposition for each
            without changing the work — CLEARED only with evidence the passing
            round already reviewed, UNSUBSTANTIATED with concrete
            counter-evidence, OUT-OF-SCOPE, or (Minor and Nit findings only)
            OPTIONAL — then proceed.
          - Set logical `passed=true` only when the raw current report is PASSED
            and every substantiated current or carried finding — in either the
            delta or the focused accumulator — has a valid final disposition.
          - Before reporting `passed=true`, if any fix commits landed during
            this delta-review loop (including its focused episodes) since the
            last passing full-suite gate entry,
            run the full test suite once on current HEAD. If it is not green
            excluding ledger-recorded pre-existing failures, record and fix the
            complete failure set, verify and COMMIT the fixes, append the
            outcome, and re-run the suite; when green, report `passed=true`. A
            PASSED round stays passed: gate fixes are authorized by the gate and
            never re-enter the review loop.

      (f) FOCUSED REPAIR-REVIEW LOOP — when this round's raw verdict is FAILED
          and its repairs are committed, the repairs themselves are reviewed
          before this step returns: run up to five focused review rounds
          against the cumulative repair delta — the commits from this failed
          round's recorded Reviewed head through the current repair HEAD —
          recording rounds in {{workspace.logs_dir}}/fresheyes-focused.md.
          This episode is one of at most five per run (one per failed delta
          round). When the failed delta round was the fifth, the episode still
          runs; the run then continues to the recap because the delta cap is
          spent. The delta and focused loops keep separate counters, logs, and
          caps: neither loop's rounds count toward the other, and the delta
          loop never gains a sixth round.

          Before each focused dispatch, check durable blocker evidence as in
          RECOVERY. Each focused round applies (b), then the execution check in
          (c) BEFORE counting, verdict handling, or repairs. On execution failure,
          close the episode with its original started line and a completed line
          naming execution failure, preserve focused and delta counts/verdicts,
          persist both blocked receipts and terminal evidence, and return the
          blocked DELTA step receipt immediately. Do not run another focused
          or delta round, repair, or final full-suite gate.

          Each performed focused round works like (b)-(e) above, except the
          full-suite gate in (e) belongs only to the enclosing delta loop and
          never runs inside a focused episode, with these other differences:

          - SCOPE: the reviewer instruction is the same BEGIN/END block, but
            its review sentence becomes:
            "Review the repair delta from <this failed delta round's Reviewed
            head> through HEAD using `git -C {{workspace.worktree_path}} diff
            <repair-base>...HEAD`. These commits repair code that an earlier
            independent review already found defective. You may inspect any
            repository context you need, but report only findings that
            identify a defect in the edited repair lines themselves; do not
            report findings about any other code."
            The same endpoint sanity check applies with the repair base in
            place of {{workspace.base_ref}}: confirm the repair base and HEAD
            are the intended endpoints, and if their SHAs differ but the diff
            appears empty, fix the path or range before review rather than
            concluding there are no changes.
          - LOG: focused rounds are recorded in
            {{workspace.logs_dir}}/fresheyes-focused.md, one entry per round:

            ## Focused round <j> of 5, episode <N> of at most 5
            Verdict: PASSED | FAILED | NO_MARKER
            Repair base: <this failed delta round's Reviewed head, full SHA>
            Reviewed head: <full SHA reviewed this round>
            Blocking issues: <count>
            <per-finding records exactly as (d): severity, location,
            description, assessment, disposition/status, clearing evidence>

            ### Accumulators after this round
            Focused accumulator: <unresolved substantiated findings carried by
            focused episodes and still binding — finding ids or locations, or
            none>
            Delta accumulator: <unresolved substantiated findings carried by
            the delta loop and still binding — finding ids or locations, or
            none>

            Summary: <one sentence>
            Review report: <path, if stored separately>
            Fix commit: <sha, or none>

            The accumulators stay separate: a focused round consumes no delta
            round, and the delta target may be declared successful only when
            neither accumulator carries an unresolved finding.
          - TIMING: the focused log also carries one
            `episode <N> started <ISO-8601 UTC>` line appended when the episode
            opens — a retried or recovered episode keeps its original `started`
            line, which is never rewritten — and one `episode <N> completed
            <ISO-8601 UTC>` line appended when the episode closes, whether by a
            passing round, cap exhaustion, or execution failure; record the
            closure reason. Round entries sit between their
            episode's boundary lines.

          A PASSED focused round ends the episode: it authorizes no further
          fixes and no further focused rounds. The passing round reviewed the
          enlarged cumulative repair delta, so findings from the episode's
          earlier rounds reach CLEARED with that evidence. The passing report's
          own findings receive recorded final dispositions without fixes —
          under the scope rule, with OPTIONAL available to Minor and Nit
          findings — and they never trigger another focused round. A focused
          substantive NO_MARKER consumes a focused round; missing execution
          does not. Assess its findings under (c)-(e). After each focused
          FAILED round —
          including the fifth — disposition and repair the findings, verify
          with focused tests, and commit; after the fifth, no further focused
          round runs and the episode closes with every unresolved focused
          finding still binding in the focused accumulator. When the episode
          closes — pass or exhaustion — report `passed=false` so the delta
          while-loop runs the next delta round (or, after the fifth delta
          round, exits spent to the recap).

      The 3-round plan, 5-round delta, and 5-round-per-episode focused caps
      remain bounded circuit breakers. If ANY cap is reached while any
      substantiated finding remains unresolved — in either accumulator —
      preserve every unresolved finding and record the delta review as
      FAILED/non-converged, with no success and no merge recommendation.
      Delta-review non-convergence is the major review failure: the recap's
      final recommendation states whether the loop was converging and needs
      more iterations, or why it is failing to converge. Never extend a loop
      merely to chase optional improvements.

      Cross-cutting rules (complete as stated):
      - All methods and review templates are inlined in this recipe.
        Do not load installed skills or substitute another review workflow.
      - Any subagent, reviewer, or skill you dispatch runs with an UNKNOWN
        working directory. Every dispatch prompt that touches the repo MUST
        state the repo root explicitly ({{workspace.worktree_path}}) and
        require `git -C` / path-prefixed access. Never rely on cwd.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "passed": "true|false",
        "execution_blocked": "true|false",
        "verdict": "PASSED|FAILED|NO_MARKER|NOT_RUN",
        "rounds_completed": 0,
        "blocking_count": 0,
        "blocked_target": "<plan|delta|focused on failure; otherwise empty>",
        "blocker_reason": "<execution failure reason; otherwise empty>",
        "evidence_paths": [],
        "report_path": "<last completed report path; empty when NOT_RUN>",
        "summary": "<one-line findings or execution-blocker summary>"
      }

  - id: "fresheyes-delta-halt-guard"
    type: "bash"
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
      WORKTREE: "{{workspace.worktree_path}}"
      REVIEW_TARGET: "delta"
      REVIEW_PHASE: "post"
      REVIEW_RESULT: "{{fresheyes_delta_result}}"
      REVIEW_BLOCKED: "{{delta_execution_blocked}}"
      REVIEW_PASSED: "{{delta_passed}}"
    command: *review_execution_guard
    on_error: "fail"

  # ===========================================================================
  # STEP 6 — Recap: per-stage findings + low-jargon summary + next steps
  # ===========================================================================
  - id: "recap"
    # The agent that executes this step's instructions (this stage's worker).
    agent: "the-usual:step-runner"
    timeout: 864000
    output: "final_output"
    prompt: |
      REMINDER — read first: your FINAL message must be the recap prose
      itself; end with it even if your context was compacted along the way.

      Produce the final recap for the user. This is the end of "the usual": report
      what was found at each stage, then a low-jargon summary of everything that
      was built, plus suggested next steps.

      Re-read the current committed plan before writing. Recap receives the
      complete current User Request block verbatim and compares the delivered
      result, constraints, accepted tradeoffs, and residuals against it. Do not
      reconstruct current intent from the initial recipe `task` or stale context.
      Never compare the delivered result against the plan's code or patch
      listings; once execution begins, the source tree supersedes them.

      Progress banners: do NOT print a progress banner for this step — the
      recap itself IS the output.

      Stage timing (append-only bookkeeping): the log is
      {{workspace.logs_dir}}/stage-timing.txt, one space-separated line per
      event: `<stage> started|completed <ISO-8601 UTC>` — stamp with
      `date -u +%FT%TZ`. As your FIRST action, append `recap started <ts>`
      ONLY if the file has no `recap started ` line yet — a retried or
      recovered attempt keeps the original timestamp. Just BEFORE writing
      recap.md, append `recap completed <ts>` once, then compute the Results
      table below from the complete log, so it includes this stage.

      Gather the record from context and the log files (read them):
      - Stage-timing log:       {{workspace.logs_dir}}/stage-timing.txt
      - Load-bearing ledger:  {{load_bearing_result.ledger_path}}
        (verified: {{load_bearing_result.verified_count}}, falsified:
        {{load_bearing_result.falsified_count}}; acceptable-path decisions:
        {{load_bearing_result.acceptable_decisions}})
      - Execution blockers and per-target receipts:
        {{workspace.logs_dir}}/review-execution-blocker.json and
        {{workspace.logs_dir}}/fresheyes-*-result.json (when present).
      - Plan fresheyes log:   {{workspace.logs_dir}}/fresheyes-plan.md
        (final: passed={{plan_passed}})
      - Delta fresheyes log:  {{workspace.logs_dir}}/fresheyes-delta.md
        (final: passed={{delta_passed}})
      - Focused fresheyes log: {{workspace.logs_dir}}/fresheyes-focused.md
        (only when the focused loop ran; carries per-episode
        `episode <N> started|completed <ISO-8601 UTC>` boundary lines)
      - Execution notes:      {{execute_result.execution_notes}}
        (tasks completed: {{execute_result.tasks_completed}} of
        {{execute_result.total_tasks}}; final whole-branch review verdict:
        {{execute_result.final_review_verdict}})
      - Worktree: {{workspace.worktree_path}} on branch {{workspace.branch}};
        original fork point: {{workspace.base_ref}}; plan: {{plan.plan_path}}.

      Note if any fresheyes loop hit its iteration cap WITHOUT passing (plan
      cap 3, delta cap 5, focused cap 5 rounds per episode) — that means it
      exited FAILED/non-converged, not a clean PASS. A capped substantive
      plan-loop non-convergence is a footnote (one line, per the ending rules below); a
      delta-loop non-convergence is the major review failure. List every
      unresolved substantiated finding carried in the durable review logs,
      including the focused log's accumulator when the focused loop ran. No
      success and no merge recommendation are permitted while any such finding
      remains unresolved.

      Write the recap as plain, low-jargon prose (the user reads these to decide
      what to do next — favor clarity over ceremony). The recap OPENS with the
      Outcome Block specified at the end of these instructions: exactly one
      "## Outcome Block" heading followed by its one fenced json object, with
      NOTHING before that heading. Immediately after its closing fence, write
      one result line:

      **Result:** <success or non-convergence>; <one short plain-language phrase
      giving the task count and review verdicts>

      and then the following sections in order:

      ## What happened at each stage
      - Plan: <1-2 lines>
      - Load-bearing: verified/falsified counts, the notable falsified
        assumptions and how the plan changed, and each `acceptable` decision
        (the claim, the alternatives considered, and why the chosen path won) —
        presented as decisions made during the run, not items awaiting the
        user's adjudication.
      - Plan review (fresheyes): how many rounds, final verdict, notable
        findings cleared, and every unresolved substantiated finding.
      - Execution: what was built, final review verdict, any concerns. State
        "N of M tasks completed" (N = tasks_completed, M = total_tasks). If
        N < M, visually flag the partial completion on its own line (e.g.
        "!! PARTIAL: only N of M tasks completed") — do not bury it.
        Also list each full-suite gate run -- when it ran, at what HEAD, and
        what it caught -- one line each, plus any ledger-recorded pre-existing
        failures left unfixed. Read the entries from the progress ledger:
        `(cd {{workspace.worktree_path}} && cat "$(git rev-parse --git-path sdd)/progress.md")`.
      - Delta review (fresheyes): how many rounds, final verdict, notable
        findings cleared, and every unresolved substantiated finding. When the
        focused loop ran, include its episode count, its total rounds across
        episodes, and the last episode's verdict.

      ## Results
      <Compute each stage's elapsed wall-clock time from its `started` and
      `completed` lines in the stage-timing log, and total the stages. Show
      hours and minutes (`47m`, `2h 14m`; under a minute, `<1m`). A stage with
      no `started` line shows `—`; a stage with `started` but no `completed`
      shows `incomplete`. These spans include time spent waiting on reviewers
      and delegated agents.

      The Rounds and Verdict columns apply only to the fresheyes loops;
      every other stage shows `—`. Rounds is the recorded review round count
      with an `x` suffix (`2x`, `3x`); Verdict is `converged` when the loop
      ended PASSED, `not converged` for substantive non-convergence, and
      `execution blocked` for execution failure. Rounds count only completed
      reviews; use zero and NOT_RUN when none completed.

      When the focused loop ran, give it one subordinate row directly under
      Delta review, indented two spaces and named `focused`: Rounds shows
      `<E> episodes, <M>x` — the episode count and the total focused rounds —
      and Verdict shows the last episode's outcome, `converged` when it passed
      back to the delta loop and `not converged` when it exhausted its rounds
      with binding findings, or `execution blocked` when execution failed,
      including with zero focused rounds. The row's Time is the sum of the episode spans
      recorded as `episode <N> started|completed` lines in the focused log,
      formatted like a stage; an episode with `started` but no `completed`
      shows `incomplete`. Episode time is inside the Delta review row's span —
      that row still shows all of Stage 5 — and Total sums the six stage rows
      only. Format the table as plain text, columns aligned with spaces,
      inside a fenced block, e.g.:

      Stage          Time     Rounds  Verdict
      Plan           23m      —       —
      Load-bearing   41m      —       —
      Plan review    58m      2x      converged
      Execution      2h 14m   —       —
      Delta review   1h 36m   3x      converged
      Recap          2m       —       —
      Total          5h 54m

      With a focused loop that ran two episodes:

      Stage          Time     Rounds           Verdict
      Plan           23m      —                —
      Load-bearing   41m      —                —
      Plan review    58m      2x               converged
      Execution      2h 14m   —                —
      Delta review   2h 03m   4x               converged
        focused      37m      2 episodes, 7x   converged
      Recap          2m       —                —
      Total          5h 59m
      >

      ## In plain terms, here's what got built
      <a short, jargon-free paragraph a non-specialist could follow>

      ## Out-of-scope suggestions
      <List every finding recorded OUT-OF-SCOPE during any review, in plain
      language with its one-line reason. These are ideas that may be valuable
      but the run deliberately did not build because the User Request did not
      require them; they do not block completion or merging. Omit this section
      when there are none.>

      ## Optional findings
      <List every finding recorded OPTIONAL during any review, in plain language
      with its recorded reason for being useful and for why it is only optional.
      These were probably real improvements that nothing required; they never
      blocked anything and may be picked up at any time or never. Omit this
      section when there are none.>

      ## Suggested next steps
      <the branch was intentionally NOT merged or finished. Offer the standard
      finishing options — merge the branch locally, push and open a PR, keep
      iterating, or discard — only when the delta fresheyes loop passed and no
      substantiated finding from any review loop (including a focused episode)
      remains unresolved, and no review execution blocker exists. Name the
      worktree/branch so the user can act. After execution failure, lead with
      the execution blocker and the evidence needed to resolve it. Do not
      recommend more iterations on exhausted routes, claim readiness, or treat
      the recap as authorization to resume work. For substantive review
      non-convergence or unresolved findings without an execution blocker,
      lead with clearing the remaining findings and do not recommend merging
      or opening a pull request as ready for review.>

      Review-failure ending (mandatory, conditional):
      - If any review execution failed, end with
        `WARNING: WORKFLOW STOPPED — INDEPENDENT REVIEW EXECUTION BLOCKED`.
        Name the target, blocker, and evidence; list only actual unresolved
        findings, or state that none were recorded. Do not imply later stages
        or reviews ran. Execution failure is not evidence of substantive
        non-convergence. Analyze only reviews actually completed, and say when
        there is insufficient evidence for a trend. Do not infer findings or
        recommend retrying exhausted routes.
      - When no execution failure occurred, if delta_passed is not 'true'
        (current value: {{delta_passed}}), or any
        substantiated finding from any review loop (including a focused
        episode) remains unresolved, the recap MUST END with a clearly
        set-apart warning block that cannot be missed, in this style:

        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        !!! WARNING: THE FINAL CODE DID NOT PASS INDEPENDENT REVIEW
        !!! after all review attempts. Remaining unresolved findings:
        !!! - <issue 1>
        !!! - <issue 2>
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

        Read every unresolved substantiated finding, including carried findings
        from earlier iterations, from
        {{workspace.logs_dir}}/fresheyes-delta.md — and from
        {{workspace.logs_dir}}/fresheyes-focused.md when the focused loop ran —
        and describe EACH one in a single line of plain language a
        non-programmer can follow (what is wrong and what it could affect — no
        jargon). One line per issue. An exhausted focused episode whose
        findings all reached final dispositions does not by itself trigger
        this warning; the delta loop's pass covers the cleared state.
        In this case, "Suggested next steps" must NOT recommend merging — lead
        with fixing the listed issues instead — and the final recommendation
        must include a convergence analysis: read
        {{workspace.logs_dir}}/fresheyes-delta.md — and
        {{workspace.logs_dir}}/fresheyes-focused.md when the focused loop ran —
        round by round (blocking-finding counts, finding severities, and
        whether cleared findings stayed cleared). If findings grew fewer and
        less severe across rounds, say the loop is converging and recommend
        more review iterations as the next step. If they held flat, grew, or
        oscillated, say the loop is failing to converge, state the apparent
        reason — a recurring root cause the fixes never touch, fixes that
        trade one finding for another, or a requirement the change cannot
        satisfy — and recommend the matching corrective step, such as revising
        the plan or clarifying the request, rather than more blind iterations.
      - If plan_passed is not 'true' (current value: {{plan_passed}}), the plan
        completed its three substantive rounds, and no execution failure
        occurred, treat
        the plan review's non-convergence as a footnote: add exactly one line
        after the stage bullets in "What happened at each stage" — "* The plan
        review did not converge within its three rounds; the delta review,
        which covers the final code, governs the run." — and give it no other
        emphasis: the plan verdict alone never withholds next-step choices,
        never lowers the run's status, and never triggers the warning block.
      - If delta_passed is 'true', no substantiated finding remains unresolved
        in any review log, and no review execution blocker exists: no warning
        block — end normally.

      Write the full recap to {{workspace.logs_dir}}/recap.md.

      ## Outcome Block

      The recap OPENS with exactly one "## Outcome Block" heading and one
      fenced json object: NOTHING may precede the heading, and the schema
      below is unchanged. The human-facing sections follow its closing fence,
      and the failure-warning rule above still governs how the recap ENDS.
      Copy every value from the recorded artifacts — invent nothing:

      - execution_tasks: completed={{execute_result.tasks_completed}},
        total={{execute_result.total_tasks}}
      - full_suite_gate.result: from the final-HEAD gate entry in the
        progress ledger — passed, failed, not-run, or blocked.
      - Execution blockers: read review-execution-blocker.json and all
        fresheyes-*-result.json receipts before claiming success. Count only
        performed reviews; execution-attempt diagnostics contribute no round
        or verdict. Preserve the last completed count/verdict, or NOT_RUN/0.
        Any execution blocker requires non-convergence with its target, reason,
        attempted routes, and evidence prominently reported. Do not recommend
        merge, invent convergence activity, or run more work. The Bash failure
        guard emits review-execution-failure.md with available facts instead of
        inventing a normal Outcome Block for an interrupted workflow.
      - review_loops: rounds and final verdict from
        {{workspace.logs_dir}}/fresheyes-plan.md and
        {{workspace.logs_dir}}/fresheyes-delta.md. Verdicts: PASSED, FAILED,
        NO_MARKER, NOT_RUN. Plan rounds 0-3, delta rounds 0-5; NOT_RUN
        requires 0 rounds, every other verdict at least 1.
      - head_commit_sha: `git -C {{workspace.worktree_path}} rev-parse HEAD`
        (full lowercase 40-char SHA).
      - status "success" requires completed == total, gate result passed, the
        final delta verdict PASSED, and no unresolved substantiated finding in
        any durable review log (plan, delta, or focused when it ran), and no
        review execution blocker, with reason null. The focused loop has no
        outcome-block field of its own; execution failure there still blocks
        success and is named in reason, without inventing a focused verdict.
        Record the plan verdict
        in full; it never gates success by itself. A raw
        PASSED marker does not satisfy this while a carried finding remains
        unresolved. Anything else is status "non-convergence" with a non-empty
        reason naming the partial, blocked, failed-gate, failed-review, or
        unresolved-finding fact.
        Keep the existing Outcome Block schema unchanged. schema_version is the
        integer 1.

      {
        "schema_version": 1,
        "status": "success",
        "reason": null,
        "execution_tasks": { "completed": 2, "total": 2 },
        "full_suite_gate": { "result": "passed" },
        "review_loops": {
          "plan":  { "rounds": 1, "final_verdict": "PASSED" },
          "delta": { "rounds": 1, "final_verdict": "PASSED" }
        },
        "head_commit_sha": "0123456789abcdef0123456789abcdef01234567"
      }

      After writing recap.md, validate the outcome block and fix + rerun until
      the validator exits 0 (a validation failure is a failed recap — correct
      the block from the recorded artifacts, never weaken the check):

      BUNDLE_LOCATION="${THE_USUAL_BUNDLE_DIR:-}"
      if [ -z "$BUNDLE_LOCATION" ]; then
        BUNDLE_LOCATION="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.amplifier/registry.json"), encoding="utf-8"))["bundles"]["the-usual"]["local_path"])')"
      fi
      if [ -f "$BUNDLE_LOCATION" ]; then
        BUNDLE_DIR="$(dirname -- "$BUNDLE_LOCATION")"
      else
        BUNDLE_DIR="$BUNDLE_LOCATION"
      fi
      VALIDATOR="$BUNDLE_DIR/scripts/validate-recap-outcome.py"
      [ -f "$VALIDATOR" ] || { printf '%s\n' "FATAL: recap validator is unavailable at $VALIDATOR" >&2; exit 1; }
      python3 "$VALIDATOR" "{{workspace.logs_dir}}/recap.md"

      Return the full recap as your message text (plain prose including the
      outcome block; no additional JSON framing).

  # ---- Hard gate: the recap's outcome block must pass the deterministic
  # validator (ported from skill-the-usual 08fa196). A skipped or false
  # "validated" claim in the recap step cannot ship: this step re-runs the
  # check against the recap file on disk.
  - id: "recap-outcome-validate"
    type: "bash"
    # Contract target: {{workspace.logs_dir}}/recap.md. The env binding carries
    # the dynamic base path as inert data rather than shell source.
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
    command: |
      BUNDLE_LOCATION="${THE_USUAL_BUNDLE_DIR:-}"
      if [ -z "$BUNDLE_LOCATION" ]; then
        BUNDLE_LOCATION="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.amplifier/registry.json"), encoding="utf-8"))["bundles"]["the-usual"]["local_path"])')" || {
          printf '%s\n' "FATAL: cannot locate the the-usual bundle (set THE_USUAL_BUNDLE_DIR or register the bundle in ~/.amplifier/registry.json)" >&2
          exit 1
        }
      fi
      if [ -f "$BUNDLE_LOCATION" ]; then
        BUNDLE_DIR="$(dirname -- "$BUNDLE_LOCATION")"
      else
        BUNDLE_DIR="$BUNDLE_LOCATION"
      fi
      VALIDATOR="$BUNDLE_DIR/scripts/validate-recap-outcome.py"
      [ -f "$VALIDATOR" ] || { printf '%s\n' "FATAL: recap validator is unavailable at $VALIDATOR" >&2; exit 1; }
      RECAP="$LOGS_DIR/recap.md"
      [ -f "$RECAP" ] || { printf '%s\n' "FATAL: recap file is missing; the recap step must write it" >&2; exit 1; }
      python3 "$VALIDATOR" "$RECAP"
    on_error: "fail"
