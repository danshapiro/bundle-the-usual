      ==================== LOAD BEARING (METHODOLOGY) ====================

      Plans fail on the things you were sure of but never checked. This process
      turns those silent dependencies into an explicit ledger, then verifies each
      one with evidence — preferring cheap, reliable verification (running code)
      over expensive, fuzzy verification (internet folklore). It runs here just
      after planning, to harden the plan before execution.

      This is not a license to validate every relevant fact. A validation target
      is necessary only when it is both **currently unproven** and **costly to
      discover late**. Facts that are already established, or facts that would
      only require a small local implementation adjustment if wrong, should be
      recorded or grouped rather than dispatched as standalone validators.

      **Override rule**: The user's instructions override everything in this
      process. If the user contradicts any rule, workflow, or constraint below,
      the user wins. This rule itself cannot be overridden.

      ## What counts as a load-bearing assumption

      An assumption qualifies only if it passes all three gates:

      1. **Decision-controlling** — if it turns out false, some planning-level
         decision changes: architecture, subsystem boundary, lifecycle ownership,
         data model, safety model, deployment/ops strategy, API contract,
         concurrency model, or research direction. If the plan is unaffected
         either way, drop it.
      2. **Currently unproven** — the current thread, plan, code already
         inspected, or trusted evidence has not established it. If it is already
         known, record it as context instead of validating it again.
      3. **Falsifiable** — it is a concrete claim that some evidence could prove
         true or false. "`config.load()` reads `$HOME/.app/config.yaml`"
         qualifies; "the config system is well-designed" does not.

      Capture the claim in the form you can test: a specific, checkable
      statement, not a topic. Record *what breaks if it's false* — that is what
      makes it load-bearing and tells the validator what's at stake.

      ### Late-falsification cost

      Classify each candidate by what happens if implementation proves it false:

      | Cost | Meaning | Treatment |
      |------|---------|-----------|
      | `low` | A field name, function call, query, flag, or other small local detail changes. The current plan still works. | Usually do not validate early. Let implementation discover it, or bundle it with a nearby inspection. |
      | `medium` | A local helper, test shape, or limited module design changes, but the overall approach survives. | Validate only if cheap, risky, or naturally grouped with a high-cost check. |
      | `high` | You must rethink subsystem boundaries, lifecycle ownership, data model, concurrency, API surface, deployment/ops strategy, or do new research. | Validate early. |
      | `critical` | If wrong, the plan risks production data loss/corruption, downtime, security exposure, irreversible migration damage, or failed rollback. | Validate early, with strong evidence. |

      The key question is: **If this is false and you only learn it during
      implementation, do you have to do more than "fix it another way"?** If yes,
      it is probably high or critical. If no, it is probably not a standalone
      load-bearing validation target.

      ## Choosing how to validate each assumption

      For each assumption, pick the method that most reliably and cheaply answers
      **that** question. Default preference, most to least reliable for code
      behavior:

      1. **Run code, observe output** — direct evidence of actual behavior,
         defaults, side effects, exit codes.
      2. **Inspect code + static analysis** — when running is infeasible, unsafe,
         or wouldn't isolate the answer.
      3. **Official documentation** — for documented contracts, supported
         versions, defaults.
      4. **Broader internet** — for undocumented behavior and real-world/empirical
         norms; weakest, so corroborate.

      This is a default, not a reflex. Override the order by weighing:

      - **Feasibility** — can you actually run/inspect it here (binary present,
        buildable, reachable)? If not, drop a tier.
      - **Safety** — prefer running only when it's non-destructive (no data,
        money, or external side effects). Make it safe with `--help`/`--dry-run`/
        temp copies/sandbox/read-only flags. Subagents make no actual changes on
        their own: if the only way to validate requires a state-changing action,
        get the user's explicit OK before running it (or fall back a tier).
      - **Question type** — deterministic local behavior -> run/inspect;
        dynamic/empirical (memory, latency) -> a single run is one noisy data
        point, so measure repeatedly for *this* system or use the internet for
        typical values; documented contract -> docs; real-world or undocumented
        norm -> internet. **Locality flips the tier**: "what is Word's memory
        footprint?" is an internet question in general, but a run/inspect
        question inside the Word repo with a build.

      When unsure a method will resolve the question, write a **fallback chain**
      and let the validator walk it: try tier *n*, and on failure (tool absent,
      output ambiguous, doc silent) move to *n+1*. Format:
      `run (foo.sh --help) -> inspect (arg parsing) -> docs`. One reliable method
      is fine when no fallback is needed — e.g. "does `foo.sh` have a `-x` flag?"
      is just `run (foo.sh --help) -> inspect the script`.

      ## Workflow

      Phases run in order. Three checkpoints are **yours** — do not delegate the
      judgment.

      ### Phase 0 — Frame
      Collect the plan and restate the goal in one or two sentences. This is the
      context every subagent needs; assemble exactly what they need rather than
      handing them your whole session.

      ### Phase 1 — Discover (stateful finder, maximum power)
      Spawn one subagent with the most capable model available to you, at maximum
      reasoning effort. Keep it **stateful** — you will send follow-up messages
      to refine its list, and it should retain its reasoning rather than
      re-derive from scratch. Its job: enumerate **every** falsifiable
      load-bearing assumption the plan depends on. Bias it toward exhaustive
      discovery; completeness matters more than precision here.

      **Checkpoint (yours):** Review the list looking for what it *missed* —
      implicit environmental, version, data-shape, and concurrency assumptions
      are commonly overlooked. Add the missing ones (feed them back to the finder
      so its list stays the system of record), then prune for necessity:

      - Cut anything that is not decision-controlling, currently unproven, and
        falsifiable.
      - Downgrade low-cost implementation details to notes unless they are
        essentially free to verify inside another check.
      - Merge assumptions that one code inspection, command, or source can
        validate together.
      - Keep high/critical late-falsification-cost assumptions as standalone
        validation targets unless they are safely grouped.

      ### Phase 2 — Strategize (separate stateful strategist, maximum power)
      Spawn a **second, separate** stateful subagent (most capable model
      available, maximum reasoning). Give it the reviewed assumption list and the
      preference tree. Its job: assign each assumption the best validation
      method, with a fallback chain when it's uncertain a method will resolve the
      question. Require it to justify each choice against feasibility, safety,
      and question type.

      **Checkpoint (yours):** Inspect its assignments looking for weak choices —
      a method that won't actually isolate the answer, an unsafe "run it," a
      default-tier pick where a better tier fits, or unnecessary validator
      fan-out. Prefer grouped validation when one safe action can establish
      several assumptions without making the validator's task ambiguous. Correct
      them with the strategist.

      ### Phase 3 — Validate (parallel stateless validators, maximum power)
      Spawn one subagent **per validation target**: usually one high/critical
      assumption, or a grouped set when one safe action can validate several
      assumptions cleanly. Run them all in parallel, each **stateless** (fresh
      context, no continuation) with the most capable model available to you.
      Give each a detailed, self-contained instruction: the claim or grouped
      claims, decision controlled, current evidence/uncertainty,
      late-falsification cost, assigned method and fallback chain, and the
      required report shape. Validators that run code or search the web need full
      tool access (able to run commands, read files, and search the web), not a
      read-only agent. They run only read-only, non-destructive commands on their
      own; if confirming a claim would require changing state (deleting,
      overwriting, mutating data or config, installing, or external/production
      writes), they must not do it — they report the needed action back for
      approval instead. Each returns: **verdict** (confirmed / falsified /
      inconclusive) per claim, the **evidence** (commands run + output, code
      cited, doc/source quoted with link), its **confidence**, **any new
      assumptions surfaced**, and **any state-changing action it was blocked on**
      (reported, not performed). Surface those blocked actions to the user and
      get an explicit OK before authorizing them.

      ### Phase 4 — Evaluate & loop
      Judge each report skeptically: does the evidence actually establish the
      claim, or merely suggest it? Then:
      - **Inconclusive or weak evidence** -> send back down the fallback chain or
        re-strategize the method.
      - **New assumptions surfaced** (e.g. "this depends on the OS" -> new
        assumption: "we are running on Linux x86_64") -> add to the ledger and
        run them through Phase 2-3.
      - **Falsified** -> flag it; the plan must change. Surface it immediately.

      Loop until every load-bearing assumption is **verified**, **falsified**, or
      **explicitly accepted as a residual risk** by the user.

      ### Phase 5 — Report
      Summarize for the user: verified facts the plan can rely on, falsified
      assumptions (and how the plan must change), accepted residual risks, and
      anything still open.

      ## The assumption ledger

      Maintain a single ledger across all phases (write it to a file for a large
      effort). One row per assumption:

      | ID | Assumption (falsifiable claim) | Decision controlled | Current evidence / uncertainty | Late-falsification cost | Method (+ fallback chain) | Status | Evidence / finding |
      |----|--------------------------------|---------------------|----------------------------|-------------------------|---------------------------|--------|--------------------|

      Status values: `unverified` -> `verifying` -> `verified` / `falsified` /
      `acceptable`.

      ## Important Rules

      - **User overrides everything**: The user's instructions supersede any rule
        in this process. This is not negotiable.
      - **Keep the three checkpoints yours.** The finder and strategist propose;
        you decide what's missing, wrong, or weak before moving on.
      - **Statefulness is deliberate.** Finder and strategist are stateful so
        they incorporate your feedback without re-deriving. Validators are
        stateless and parallel so they stay independent and fast.
      - **Evidence beats assertion.** A "confirmed" verdict without runnable
        commands, cited code, or a quoted source is not confirmed — send it back.
      - **No changes without approval.** Subagents may run read-only,
        non-destructive commands freely, but must not delete, overwrite, mutate,
        install, or make external/production writes without explicit user
        approval — they report the needed action back instead. Prefer
        non-destructive verification; fall back to inspection/docs/internet when
        running isn't safe.

      ==================== SUBAGENT PROMPTS (USE VERBATIM) ====================

      Copy-paste prompts for the three subagent roles. Replace `[bracketed]`
      placeholders. Spawn all three with model_role="reasoning".

      Statefulness: spawn the **finder** and **strategist** once and continue the
      same conversation (resume by session_id) when you send review feedback, so
      they refine their own work instead of re-deriving it. Spawn each
      **validator** fresh — never continue one — and dispatch them in parallel.

      ### 1. Finder (Phase 1 — stateful)

      ```
      You are finding the load-bearing assumptions in a plan. Think as hard as you can.

      CURRENT USER REQUEST (complete block, verbatim from the committed plan):
      [paste the complete current User Request block]

      GOAL: [restate the goal in 1-2 sentences]

      PLAN / INTENDED APPROACH:
      [paste the plan or task + approach]

      RELEVANT CONTEXT:
      [codebase facts, environment, tools, APIs, data the plan touches — only what's needed]

      A load-bearing assumption is a claim that passes ALL THREE gates:
      - decision-controlling: if false, a planning-level decision changes (architecture,
        subsystem boundary, lifecycle ownership, data model, safety model, deployment/ops
        strategy, API contract, concurrency model, or research direction),
      - currently unproven: not already established by the provided context/evidence, AND
      - falsifiable: a concrete claim some evidence could prove true or false.

      Find EVERY such assumption the plan silently depends on. Be exhaustive, but do not
      inflate the list with facts that are merely relevant. Probe the easily-missed categories:
      environment/OS/arch, tool availability and versions, API/library contracts and defaults,
      data shape and volume, concurrency and ordering, permissions and auth, error/edge behavior,
      and "this works the way I remember" beliefs.

      Classify late-falsification cost:
      - low: if false, implementation can fix a local detail another way.
      - medium: if false, a local helper/test/module design changes, but the plan survives.
      - high: if false, architecture, boundaries, lifecycle, data model, concurrency, API,
        deployment/ops, or research direction must be rethought.
      - critical: if false, the plan risks production data loss/corruption, downtime, security
        exposure, irreversible migration damage, or failed rollback.

      For each, output a row:
      - claim (the specific, testable statement — not a topic)
      - decision controlled (what planning choice relies on it)
      - current evidence / uncertainty (why it is not already known)
      - late-falsification cost (low | medium | high | critical)
      - what would have to change if false
      - why you think it's currently unproven

      Exclude anything that is not decision-controlling, currently unproven, and falsifiable
      (opinions, aesthetics, already-known facts, or details that would only require a small
      local implementation adjustment). Return the list only.
      ```

      When you send additions/cuts back, keep it terse: "Add these: ... Remove
      these (not load-bearing/falsifiable): ... Return the updated list."

      ### 2. Strategist (Phase 2 — stateful)

      ```
      You are assigning each assumption the best way to VALIDATE it. Think as hard as you can.

      CURRENT USER REQUEST (complete block, verbatim from the committed plan):
      [paste the complete current User Request block]

      ASSUMPTIONS (reviewed list):
      [paste the ledger claims + decision controlled + current evidence/uncertainty + late-falsification cost]

      ENVIRONMENT: [OS/arch, what's installed/buildable/reachable, repo on hand, network/creds available]

      Choose, per assumption or safely grouped set of assumptions, the method that most reliably
      and cheaply answers THAT question. The goal is not maximum validator count; it is enough
      evidence with the least duplicated work.

      Default preference order:
        1. run code, observe output   2. inspect code + static analysis
        3. official documentation     4. broader internet

      But this is a default, not a reflex. Override it by weighing:
      - FEASIBILITY: can it actually be run/inspected here?
      - SAFETY: prefer running only when feasible AND non-destructive (no data/money/external
        side effects; use --help/--dry-run/temp copies/sandbox to make it safe). If the only path
        to validate requires a state-changing action, mark it "needs user approval" instead of
        assigning a plain run.
      - QUESTION TYPE: deterministic local behavior -> run/inspect; dynamic/empirical (footprint,
        latency) -> measure repeatedly or use internet for typical values; documented contract -> docs;
        real-world/undocumented norm -> internet. Locality can flip the tier.
      - NECESSITY: high/critical late-falsification-cost assumptions deserve standalone or clearly
        grouped validation. Medium assumptions should be validated only when cheap, risky, or naturally
        grouped. Low-cost implementation details should usually be marked "defer to implementation"
        instead of assigned a standalone validator.
      - GROUPING: when one safe command, code inspection, or source can validate several assumptions,
        group them unless the combined task would become ambiguous or weaken the evidence.

      When you're not certain a method will resolve it, give an ordered FALLBACK CHAIN
      (e.g. "run (foo.sh --help) -> inspect (arg parsing) -> docs"). One reliable method is fine
      when no fallback is needed.

      For each assumption output:
      - validate now? (yes | grouped with [IDs] | defer) and why
      - chosen method (+ fallback chain)
      - one-line justification citing feasibility / safety / question type
      - the exact first action (command to run, file to inspect, doc/page to read, or query)
      ```

      When you send corrections back: name the assumption, what's wrong with the
      choice (won't isolate the answer / unsafe to run / wrong tier), and ask for
      a revised assignment.

      ### 3. Validator (Phase 3 — stateless, one per validation target, in parallel)

      Spawn one per validation target with full tool access — usually one
      high/critical assumption, or a grouped set when one safe action can
      validate several assumptions cleanly. It may need to run commands, read
      files, and search the web (not a read-only agent, but it must run only
      non-destructive commands; see SAFETY below). Fill in every placeholder; the
      validator has no other context.

      ```
      Validate the assigned assumption(s) and report back. Think rigorously; do not rubber-stamp them.

      CURRENT USER REQUEST (complete block, verbatim from the committed plan):
      [paste the complete current User Request block]

      ASSUMPTION(S) (claim(s) to test):
      [ID: exact falsifiable claim]

      FOR EACH ASSUMPTION:
      - DECISION CONTROLLED: [planning choice that relies on this]
      - CURRENT EVIDENCE / UNCERTAINTY: [why it is not already known]
      - LATE-FALSIFICATION COST: [low | medium | high | critical, plus short reason]
      - WHAT WOULD HAVE TO CHANGE IF FALSE: [stakes]

      ASSIGNED METHOD + FALLBACK CHAIN: [e.g. run (foo.sh --help) -> inspect (arg parsing) -> docs]
      CONTEXT NEEDED: [repo path, command, env, doc URL, anything required to act]
      SAFETY: run only read-only / non-destructive commands. Do NOT make actual changes — no
      deleting, overwriting, or mutating files/data/config, installing packages, or external/
      production writes — even if it would help confirm the claim. If validating genuinely
      requires a state-changing action, do NOT perform it: report it as a blocked step (the exact
      command + why it's needed) for the user to approve, and fall back to the next safe link in
      the chain if one exists.

      Execute the chain: try the first method; on failure, ambiguity, or inconclusive output,
      proceed to the next link. Reach a verdict only on evidence you actually gathered.

      Return exactly:
      - VERDICT: confirmed | falsified | inconclusive, per assumption ID
      - EVIDENCE: the proof — commands run + their output, code quoted with file:line, or
        doc/source quoted with a link. No evidence = not confirmed.
      - CONFIDENCE: high | medium | low, with the reason.
      - NEW ASSUMPTIONS SURFACED: any new falsifiable dependency you discovered (e.g. "the answer
        depends on the OS" -> "we are running on [X]"), or "none".
      - BLOCKED ON APPROVAL: any state-changing action that would confirm this but needs the
        user's OK before running — the exact command + why — or "none".
      ```

      ==================== END LOAD BEARING ====================

      Recipe-specific instructions:
      - WRITE the assumption ledger to `{{workspace.logs_dir}}/load-bearing-ledger.md`
        (the recap stage reads it).
      - Then FIX THE PLAN: apply changes required by verified/falsified findings,
        updating {{plan.plan_path}}. Re-run the writing-plans Self-Review (from
        Step 1's methodology, incl. item 1b) over any edited tasks. COMMIT the
        plan updates (focused, atomic message). Preserve unrelated changes by
        other agents. Preserve the complete current User Request block unchanged
        exactly once through every plan edit.
      - Corrections record decisions and their consequences: update the affected
        goal, architecture, constraints, task intent, and any planned code or
        tests the decision changes. Evidence itself stays out of the plan —
        commands, observed output, and validated snippets remain in the
        validator reports, cited by path. Only code a validator actually
        executed may enter a correction, cited to its report. When a falsified
        claim invalidates planned code, replace it with the corrected decision
        and intended behavior — never with freshly authored, unexecuted code.
      - HALT rule: only halt the whole workflow if a FALSIFIED
        assumption implies real data-loss / corruption / irreversible-damage risk
        that CANNOT be planned around. Ordinary falsified assumptions are fixed
        in the plan and are NOT halts. Otherwise, record each `acceptable`
        decision for the final recap.
      - User-interaction translation — these recipe rules take PRECEDENCE over
        the inlined methodology's user-interaction phrasing, which was written
        for a live conversation. There is no user to consult mid-run; YOU
        adjudicate. Since the process has to pick a course, when no path is
        verified your goal is the MOST ACCEPTABLE path. "Acceptable" means: try
        other things to see if they're better BEFORE deciding the acceptable
        solution is the best.
        (a) Validators must still never perform state-changing actions. When a
            validation is blocked on an action requiring approval, do NOT
            authorize it mid-run — walk the fallback chain instead.
        (b) When an assumption exhausts its fallback chain unverified (or is
            blocked per (a) with no safe link left), run this decision
            procedure — do not simply accept the plan's current path:
            1. Generate alternative approaches that would avoid or reduce
               reliance on the unverified assumption.
            2. Evaluate those alternatives cheaply, using the same validation
               preference tree (run > inspect > docs > internet) — a verifiable
               alternative beats an unverifiable incumbent.
            3. Choose the best available: a verified alternative wins outright;
               otherwise compare acceptability across candidates (risk severity,
               reversibility, blast radius, how much of the plan depends on it)
               and pick the most acceptable.
            4. Record the decision in the ledger with status `acceptable`,
               including the alternatives considered and why the chosen path
               won (note any blocked state-changing action that forced the
               call). Update the plan to match the chosen path.
        (c) The loop-exit condition "explicitly accepted as a residual risk by
            the user" translates to: the claim reached a recorded `acceptable`
            decision via the procedure in (b). Report every such decision in
            your step output's acceptable_decisions — the recap presents them
            as decisions made, for transparency.
        (d) The data-loss HALT rule above is unchanged and takes precedence: a
            candidate path whose failure mode is data loss/corruption that
            cannot be planned around is a halt, never `acceptable`.

      Cross-cutting rules (complete as stated):
      - All methods and review templates are inlined in this recipe.
        Do not load installed skills or substitute another review workflow.
      - Any subagent, reviewer, or skill you dispatch runs with an UNKNOWN
        working directory. Every dispatch prompt that touches the repo MUST
        state the repo root explicitly ({{workspace.worktree_path}}) and
        require `git -C` / path-prefixed access. Never rely on cwd.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "halt": "true|false",
        "halt_reason": "<empty string unless halt is true; then the specific data-loss/corruption risk>",
        "verified_count": 0,
        "falsified_count": 0,
        "acceptable_decisions": "<one paragraph summarizing each `acceptable` decision (claim, alternatives considered, why the chosen path won), or 'none'>",
        "ledger_path": "{{workspace.logs_dir}}/load-bearing-ledger.md"
      }

  # ---- Collect: file-based pickup of the load-bearing output contract.
  # The chat-captured output can be lost (context compaction, or a run whose
  # final message ended on a tool call), which previously crashed the halt
  # guard with "Undefined variable: load_bearing_result.halt". The step writes
  # its completed JSON to a file; this step re-reads it authoritatively and
  # falls back to the pending-output anchor, then to safe defaults.
  - id: "load-bearing-collect"
    type: "bash"
    output: "load_bearing_result"
    parse_json: true
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
    command: |
      if [ -s "$LOGS_DIR/load-bearing-result.json" ]; then
        cat -- "$LOGS_DIR/load-bearing-result.json"
      elif [ -s "$LOGS_DIR/pending-output.json" ] && grep -q -- '"halt"' "$LOGS_DIR/pending-output.json"; then
        printf '%s\n' "WARNING: load-bearing-result.json missing; using pending-output.json anchor" >&2
        cat -- "$LOGS_DIR/pending-output.json"
      else
        printf '%s\n' "WARNING: load-bearing output lost; substituting safe defaults (halt=false)" >&2
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      payload = {
          "halt": "false",
          "halt_reason": "",
          "verified_count": -1,
          "falsified_count": -1,
          "acceptable_decisions": (
              "UNKNOWN - the load-bearing chat output was lost; "
              "consult the ledger file if it exists"
          ),
          "ledger_path": str(Path(os.environ["LOGS_DIR"]) / "load-bearing-ledger.md"),
      }
      print(json.dumps(payload, separators=(",", ":")))
      PY
      fi

  # ---- Halt guard: fail loudly if load-bearing found unplannable data-loss risk
  - id: "load-bearing-halt-guard"
    type: "bash"
    condition: "{{load_bearing_result.halt}} == 'true'"
    command: |
      printf '%s\n' \
        "HALT: load-bearing surfaced a data-loss/corruption risk that cannot be planned around." \
        "Inspect the durable load-bearing ledger and logs for details." >&2
      exit 1
    on_error: "fail"

  # ===========================================================================
  # STEP 3 — fresheyes on the PLAN (loop: max 3, exit early on PASS)
  #
  # The complete reviewer prompt is inlined below with the review scope already
  # substituted. The delegated reviewer receives that text as its ENTIRE
  # instruction — nothing added, nothing removed.
  # ===========================================================================
  - id: "fresheyes-plan-resume-guard"
    type: "bash"
    env:
      LOGS_DIR: "{{workspace.logs_dir}}"
      WORKTREE: "{{workspace.worktree_path}}"
      REVIEW_TARGET: "plan"
      REVIEW_PHASE: "pre"
      REVIEW_RESULT: "{}"
      REVIEW_BLOCKED: "false"
      REVIEW_PASSED: "false"
    command: &review_execution_guard |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path
      import re
      import sys

      logs = Path(os.environ['LOGS_DIR'])
      logs.mkdir(parents=True, exist_ok=True)
      target = os.environ['REVIEW_TARGET']
      phase = os.environ['REVIEW_PHASE']
      blocker_path = logs / 'review-execution-blocker.json'
      errors, receipts = [], {}

      def read(path):
          try:
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise ValueError('expected object')
              return value
          except (OSError, ValueError) as error:
              errors.append(f'{path.name}: invalid or unreadable evidence ({type(error).__name__})')
              return {}

      def save(path, value):
          temporary = path.with_suffix('.tmp')
          temporary.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          temporary.replace(path)

      def check(value, name, cap):
          rounds = value.get('rounds_completed')
          verdict = value.get('verdict')
          if type(rounds) is not int or not 0 <= rounds <= cap:
              errors.append(f'{name}: invalid completed count')
          elif (rounds == 0) != (verdict == 'NOT_RUN'):
              errors.append(f'{name}: count/verdict mismatch')
          if verdict not in ('PASSED', 'FAILED', 'NO_MARKER', 'NOT_RUN'):
              errors.append(f'{name}: invalid last completed verdict')
          if any(value.get(key) not in ('true', 'false') for key in ('passed', 'execution_blocked')):
              errors.append(f'{name}: invalid loop flags')
          if type(value.get('blocking_count')) is not int or value['blocking_count'] < 0:
              errors.append(f'{name}: invalid finding count')
          if value.get('passed') == 'true' and (
              verdict != 'PASSED' or value.get('execution_blocked') != 'false'
              or value.get('blocking_count') != 0
          ):
              errors.append(f'{name}: false success')
          if value.get('execution_blocked') == 'true':
              if not value.get('blocker_reason') or value.get('blocked_target') not in ('plan', 'delta', 'focused'):
                  errors.append(f'{name}: missing blocker identity/reason')
              evidence = value.get('evidence_paths')
              if not isinstance(evidence, list) or not evidence or not all(
                  isinstance(path, str) and Path(path).is_file() for path in evidence
              ):
                  errors.append(f'{name}: missing execution-attempt evidence')
          elif value.get('blocked_target') or value.get('blocker_reason'):
              errors.append(f'{name}: contradictory blocker state')
          if rounds and type(rounds) is int:
              path = value.get('report_path')
              if not isinstance(path, str) or not path or not Path(path).is_file():
                  errors.append(f'{name}: missing completed report')
              elif verdict == 'PASSED':
                  try:
                      report = Path(path).read_text(encoding='utf-8')
                  except (OSError, UnicodeError):
                      errors.append(f'{name}: unreadable completed report')
                      return
                  normalized = report.replace('**', '').strip()
                  issues = re.search(
                      r'^\s*#+\s+Issues Found\s*$\n(.*?)(?=^\s*#{1,2}\s+\S|\Z)',
                      normalized, re.I | re.M | re.S,
                  )
                  markers = re.findall(r'^\s*INDEPENDENT CODE REVIEW (PASSED|FAILED)\s*$', normalized, re.I | re.M)
                  if (not markers or set(m.upper() for m in markers) != {'PASSED'}
                      or not normalized.upper().endswith('INDEPENDENT CODE REVIEW PASSED')
                      or issues is None
                      or any(
                          re.search(r'^\s*(?:[-*+]\s+|\d+[.)]\s+|#{3,6}\s+)?\[?(critical|major)(?=[\s:\]\-]|$)', line, re.I)
                          and not re.fullmatch(
                              r'\s*(?:[-*+]\s+|\d+[.)]\s+|#{3,6}\s+)?\[?(?:critical|major)\]?\s*:\s*'
                              r'(?:none\.?|0(?:\s+(?:issues|findings))?\.?)\s*', line, re.I,
                          )
                          for line in (issues.group(1).splitlines() if issues else [])
                      )):
                      errors.append(f'{name}: invalid PASSED report')
                  if re.search(
                      r'^\s*(?:[-*]\s*)?(?:(?:I|we)\s+(?:cannot|can.t|could not|was unable to|were unable to)\s+'
                      r'(?:perform|complete|conduct)\s+(?:a\s+|the\s+)?(?:meaningful\s+|independent\s+)?review\b'
                      r'|(?:I|we)\s+(?:cannot|can.t|could not)\s+review\b'
                      r'|unable to (?:review|perform (?:a\s+|the\s+)?(?:meaningful\s+)?review)\b)',
                      normalized, re.I | re.M,
                  ):
                      errors.append(f'{name}: refusal cannot pass')

      blocker = read(blocker_path) if blocker_path.exists() else None
      for name, cap in (('plan', 3), ('delta', 5), ('focused', 25)):
          path = logs / f'fresheyes-{name}-result.json'
          if path.exists():
              receipts[name] = read(path)
              check(receipts[name], name, cap)
      if phase == 'post':
          saved = receipts.get(target)
          try:
              returned = json.loads(os.environ['REVIEW_RESULT'])
          except ValueError:
              returned = None
          if saved is None or returned != saved:
              errors.append(f'{target}: missing receipt or returned/persisted state mismatch')
          if saved and (saved.get('execution_blocked') != os.environ['REVIEW_BLOCKED']
                        or saved.get('passed') != os.environ['REVIEW_PASSED']):
              errors.append(f'{target}: engine/receipt flag mismatch')
      blocked = [value for value in receipts.values() if value.get('execution_blocked') == 'true']
      if blocker is None and not blocked and not errors:
          sys.exit(0)

      # A guard-detected failure is durable too: replay must not dispatch again.
      if blocker is None:
          source = blocked[0] if blocked else {}
          blocker = {
              'target': source.get('blocked_target', target),
              'reason': source.get('blocker_reason') or '; '.join(errors),
              'attempted_routes': [],
              'delegate_status': 'see execution-attempt evidence' if blocked else 'guard-invalid-state',
              'evidence_paths': source.get('evidence_paths', []),
          }
          save(blocker_path, blocker)
      if errors:
          save(logs / 'review-guard-errors.json', {'errors': errors})
      reason = f"{blocker.get('target', target)} review execution blocked: {blocker.get('reason', 'invalid terminal evidence')}"
      if errors:
          reason += '; guard state errors: ' + '; '.join(errors)
      # A blocked operation is not a completed workflow. Report only available facts;
      # preserve earlier recap/gate evidence instead of fabricating a normal outcome.
      lines = ['# WORKFLOW STOPPED — INDEPENDENT REVIEW EXECUTION BLOCKED', '', reason, '']
      for name, label in (('plan', 'Plan'), ('delta', 'Delta'), ('focused', 'Focused')):
          value = receipts.get(name)
          if value is None:
              lines.append(f'{label} review: no completed-review receipt available; no count inferred.')
              continue
          count, verdict = value.get('rounds_completed'), value.get('verdict')
          if type(count) is int and count >= 0 and verdict in ('PASSED', 'FAILED', 'NO_MARKER', 'NOT_RUN'):
              lines.append(f'{label} review: {count} completed; last verdict {verdict}.')
          else:
              lines.append(f'{label} review: receipt invalid; see retained evidence.')
      execute_path = logs / 'execute-result.json'
      if execute_path.exists():
          execution = read(execute_path)
          completed, total = execution.get('tasks_completed'), execution.get('total_tasks')
          if type(completed) is int and type(total) is int and 0 <= completed <= total:
              lines.append(f'Execution tasks: {completed} of {total} completed.')
          else:
              lines.append('Execution task counts unavailable; no totals inferred.')
      else:
          lines.append('Execution task counts unavailable; no totals inferred.')
      lines.extend([
          '', 'Attempted routes: ' + json.dumps(blocker.get('attempted_routes', [])),
          'Blocker evidence: ' + str(blocker_path),
      ])
      paths = blocker.get('evidence_paths', [])
      if isinstance(paths, list):
          lines.extend(str(path) for path in paths)
      lines.extend([
          '', 'No full-suite gate was run by this guard; earlier verification evidence is unchanged.',
          'No further implementation, review, repair, or full-suite work is authorized.',
      ])
      diagnostic_path = logs / 'review-execution-failure.md'
      diagnostic = '\n'.join(lines) + '\n'
      diagnostic_path.write_text(diagnostic, encoding='utf-8')
      print(diagnostic)
      print(f'FATAL: {reason}. Failure report: {diagnostic_path}', file=sys.stderr)
      sys.exit(1)
      PY
    on_error: "fail"

  - id: "fresheyes-plan"
    # The agent that executes this step's instructions (this stage's worker).
    agent: "the-usual:step-runner"
    timeout: 864000
    output: "fresheyes_plan_result"
    parse_json: true
    while_condition: "{{plan_passed}} != 'true' and {{plan_execution_blocked}} != 'true'"
    max_while_iterations: 3
    break_when: "{{plan_passed}} == 'true' or {{plan_execution_blocked}} == 'true' or {{fresheyes_plan_result.verdict}} == 'PASSED'"
    update_context:
      plan_passed: "{{fresheyes_plan_result.passed}}"
      plan_execution_blocked: "{{fresheyes_plan_result.execution_blocked}}"
    prompt: |
      CRITICAL OUTPUT CONTRACT — read first. Your FINAL message must contain
      exactly the JSON block specified below — this is a verbatim copy of
      the contract in the "Return ONLY a JSON object" section at the end of
      these instructions, and it is authoritative even if everything below
      it has been compacted out of your context. Work is judged failed
      without it, regardless of quality.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "passed": "true|false",
        "execution_blocked": "true|false",
        "verdict": "PASSED|FAILED|NO_MARKER|NOT_RUN",
        "rounds_completed": 0,
        "blocking_count": 0,
        "blocked_target": "<plan|delta|focused on failure; otherwise empty>",
        "blocker_reason": "<execution failure reason; otherwise empty>",
        "evidence_paths": [],
        "report_path": "<last completed report path; empty when NOT_RUN>",
        "summary": "<one-line findings or execution-blocker summary>"
      }

      DURABLE RESULT / RECOVERY — before any dispatch, repair, commit, or gate,
      inspect {{workspace.logs_dir}}/review-execution-blocker.json and all
      fresheyes-*-result.json receipts. An execution blocker remains terminal
      on resume; do not retry exhausted review routes or start later stages.
      Only evidence recording and recap remain authorized after that stop.
      Return this target's blocked receipt immediately, retaining its completed
      count and last completed verdict (NOT_RUN/0 if none). If the blocker is
      focused, return a blocked delta receipt without another delta dispatch.

      Reconcile pending-output.json against the durable review logs, reports,
      receipts, and fix commits BEFORE writing an anchor. Artifacts govern;
      correct the cache, never the artifacts. Reuse a completed round whose
      final response was lost; do not redo review or repairs. Count substantive
      rounds in the log, not engine iterations or execution-attempt entries;
      enforce the 3-round cap across replay/resume as well as this invocation.
      If a prior valid PASSED round or the cap already closed this target,
      emit its reconciled receipt without another dispatch.

      Then maintain {{workspace.logs_dir}}/pending-output.json as the output
      anchor and a todo "FINAL ACT: emit completed output JSON as my last
      message". Persist the completed contract JSON atomically to
      {{workspace.logs_dir}}/fresheyes-plan-result.json after each
      substantive review (before remediation), update it after dispositions,
      and read it back before returning the identical JSON. Persist failures
      before returning too. Never replace a real receipt with a placeholder.
      Focused reviews use fresheyes-focused-result.json with the same fields;
      rounds_completed there is the total completed focused rounds across
      episodes (at most 25); the log retains each episode's separate 5-round cap.

      DELEGATION MANDATE (fixed policy — no discretion). Reason: this step
      agent's context is the scarcest resource in the pipeline; exploration
      belongs in disposable subagent contexts. If understanding or fixing
      the reviewer's blocking issues requires repository exploration, it
      MUST go through the delegate tool (foundation:explorer for surveys
      and any multi-file reading; one delegate per topic; parallel when
      independent) — do NOT read repository files directly and do NOT use
      bash/grep/glob for exploration. Direct file access is permitted ONLY
      for: files this step itself writes (the plan file, pending-output.json,
      logs), reading back your own artifacts, and git/build/test commands
      via bash. EXPLORER REPORT PROTOCOL: instruct every delegated explorer
      to WRITE its full report to {{workspace.logs_dir}}/reports/<topic>.md
      (mkdir -p the reports dir first) and RETURN only that file path plus a
      summary of at most ~500 tokens; work from summaries with bounded reads.

      Run ONE fresheyes review iteration on the PLAN. Fresheyes is a truly
      independent, cross-model review: the reviewer gets zero conversation
      context, a different model family than this session, and EXACTLY the
      instruction text between the BEGIN/END markers below — you must not add,
      remove, or editorialize anything in it.

      PROGRESS BANNER (mandatory, fixed policy — no discretion): FIRST, before
      any other work, print the following banner as plain visible response text
      (never inside a tool call, never in a file), with a blank line above
      and below the block so it separates from surrounding output. Determine i by counting the
      iteration entries already recorded in the fresheyes-plan.md log file,
      plus 1 (i = 1 if the file does not exist yet):

      ==================================================================
      ==================================================================
      >>> THE USUAL | STAGE 3/6: FRESH EYES ON PLAN — review i of up to 3 (independent cross-model review)
      >>> Dispatching an independent reviewer against the committed plan
      >>> One cross-model review dispatch plus any fixes — this may take a while
      ==================================================================
      ==================================================================

      This banner covers both the review dispatch and any fixes that follow it
      in this iteration. NOT announced (no extra banners; do not improvise):
      verdict parsing, commits, and plan-fix work.

      Stage timing (append-only bookkeeping; the recap turns these lines into
      its Results table). The log is {{workspace.logs_dir}}/stage-timing.txt,
      one space-separated line per event: `<stage> started|completed
      <ISO-8601 UTC>` — stamp with `date -u +%FT%TZ`.
      - As your FIRST action after the anchor setup, append
        `plan-review started <ts>` ONLY if the file has no
        `plan-review started ` line yet — the while-loop re-enters this step
        each round and a retried or recovered attempt keeps the original
        timestamp.
      - Append `plan-review completed <ts>` once, at the end of the round
        that ENDS the loop for this run: a round that records PASSED, or the
        final allowed round (round 3), or execution failure (record that
        closure reason). Never between rounds.
      - Never edit, rewrite, or delete existing lines.

      Worktree:  {{workspace.worktree_path}}
      Plan file: {{plan.plan_path}}
      Logs dir:  {{workspace.logs_dir}}

      Re-read the committed plan now. Extract the complete current
      `## User Request` block and keep it verbatim for this entire round. The
      parent may have updated the plan after a prior blocking call returned or
      was interrupted; current plan content governs. Reviewer receives the
      complete current User Request block verbatim. Remediation receives the
      complete current User Request block verbatim. Neither receives a summary
      or relevance-filtered subset, and every plan edit preserves the block
      unchanged exactly once.

      {{scope_rule}} Findings bind; reviewer
      remedies advise. The remediation actor chooses the proportionate response
      within the current User Request while satisfying the finding's clearance
      condition.

      {{turn_economy}}

      (a) COMMIT FIRST: ensure every change in the worktree is committed —
          fresheyes only reviews committed work. Do not commit anything under the
          logs dir (it lives outside the worktree tree by design).

      (b) DELEGATE THE REVIEW: first verify the configured reviewer is a
          DIFFERENT model family than the actual executor for this session —
          {{reviewer_provider}}/{{reviewer_model}}. Independence is the point
          of this step, so a same-family selection is rejected, not run: treat
          it as an execution blocker under (c), without consuming a round.
          Use only the native delegate's supported route policy and the
          configured provider/model. Do not invent an external provider fallback
          or retry outside that policy. Otherwise call the delegate tool with:
            - agent = "the-usual:step-runner" (the registered generic target).
            - instruction = the exact text between the BEGIN/END markers below
              (markers excluded), and NOTHING more.
            - context_depth = "none"  (zero-context independence)
            - provider_preferences = [ { "provider": "{{reviewer_provider}}",
                                         "model": "{{reviewer_model}}",
                                         "config": { "reasoning_effort": "{{reviewer_reasoning_effort}}" } } ]
              (provider_preferences pins the reviewer model and its reasoning
              effort, so no model_role is needed on this dispatch; if
              reviewer_reasoning_effort is empty, omit the "config" entry)
            - No specialized reviewer agent/persona — the persona is entirely in
              the instruction text. Use a general-purpose delegation target.

      ---------- BEGIN REVIEWER INSTRUCTION (send verbatim) ----------
      {{fresheyes_reviewer_head}}

      The repository under review is a git worktree at {{workspace.worktree_path}}. Your current working directory may be a DIFFERENT directory, so run every git command as `git -C {{workspace.worktree_path}} ...` (or cd into that path first), and read every repository file (AGENTS.md, README.md, related source) from under that path.

      Review the plan at {{plan.plan_path}}. Code and patch listings in the plan are pre-implementation drafts: their presence is not a defect, and the review never demands deeper code-level detail in the plan. Judge decisions, coverage, and consistency against the User Request.

      CURRENT USER REQUEST (complete block, pasted verbatim from the committed plan):
      [paste the complete current User Request block here]

      {{turn_economy}}

      {{fresheyes_reviewer_body}}
      ---------- END REVIEWER INSTRUCTION ----------

      (c) CHECK EXECUTION BEFORE COUNTING A ROUND: same-family refusal,
          unavailable delegate/reviewer, exhausted supported routes, no report,
          timeout, or explicit unable-to-review text is an execution failure,
          even with a FAILED or PASSED marker. Apply this check before verdict
          handling, round accounting, or remediation. Independent task/fix/
          whole-branch review and context-isolated cross-family Fresh Eyes are
          distinct gates; neither substitutes for the other or for self-review.

          Preserve all reports, diagnostics, events, and existing artifacts.
          Record the target, attempted native delegate routes, delegate status,
          blocker reason, and evidence paths in an execution-attempt entry
          separate from substantive round entries in the target's review log.
          Do not manufacture findings, increment any review counter, replace
          the last completed verdict, invoke repair, retry exhausted routes,
          or substitute self-review. Use NOT_RUN with zero rounds when no
          review completed; otherwise retain the last completed verdict and
          count. Keep any partial observations as evidence, not repair work.
          Write the target receipt with execution_blocked="true", passed="false",
          blocked_target, blocker_reason, and evidence_paths. Then atomically
          create {{workspace.logs_dir}}/review-execution-blocker.json containing
          target, reason, attempted_routes (array), delegate_status, and
          evidence_paths (array). Never clear or overwrite terminal evidence.
          For focused failure also persist a blocked delta receipt, retaining
          the delta's completed count, verdict, and last completed report.
          Return the blocked step receipt IMMEDIATELY. Only evidence recording
          and an unsuccessful recap may follow: no further implementation,
          review, repair, or gate work. No full-suite work after execution failure.

          For a performed review, format problems are logged as warnings and
          never discard a substantive report or turn it into execution failure.
          Count that review even with NO_MARKER and assess its findings under
          the normal bounded review logic below. Save the full report under
          the existing logs and set report_path before any remediation.
          - PASSED: the report ends with INDEPENDENT CODE REVIEW PASSED, has an
            Issues Found section, and lists no Critical or Major finding.
          - FAILED: the report ends with INDEPENDENT CODE REVIEW FAILED, or it
            ends with the PASSED marker but lists a Critical or Major finding.
          - NO_MARKER: no final marker, conflicting markers, or a PASSED marker
            without an Issues Found section. A nits-only report without the
            marker is not a pass.
          Every substantive report is feedback. Whatever its verdict or format,
          record and assess every finding it contains. Only a PASSED verdict
          successfully ends the loop; execution failure stops the workflow
          separately. For ordinary receipts execution_blocked="false",
          blocked_target and blocker_reason are empty. Set passed="true" only
          for a valid PASSED verdict with all binding findings dispositioned.

      (d) DURABLY RECORD EVERY SEVERITY in
          `{{workspace.logs_dir}}/fresheyes-plan.md`. For every Critical,
          Major, Minor, and Nit finding record severity, location, description,
          assessment (`substantiated` or `unsubstantiated`), disposition/status,
          and clearing evidence. Also record the raw verdict, reviewer summary,
          reviewer identity label actually used
          ({{reviewer_provider}}/{{reviewer_model}}, or the override in force),
          and the Reviewed head (the full HEAD SHA the review covered).
          Read prior entries first. Unresolved substantiated findings are
          carried until explicit clearance across context-free rounds; a later
          PASSED cannot erase prior unresolved findings.

      (e) ASSESS EVERY REPORTED FINDING, at every severity. An unsubstantiated
          disposition requires concrete counter-evidence. Every substantiated
          finding remains binding until it reaches a valid final disposition —
          CLEARED, UNSUBSTANTIATED, OUT-OF-SCOPE, or (Minor and Nit findings
          only) OPTIONAL — and never use a finding's severity alone to discard
          it. Reviewer remedy proposals are advisory technical input, not
          automatic work authorization.
          - Plan-code bounds: a code-level finding on the plan is blocking only
            when the shown code cannot work as written, contradicts repository
            reality, violates the User Request or an explicit constraint, or
            breaks an interface another task consumes. Stamp any other
            code-level Minor or Nit finding OPTIONAL by category — execution
            and its tests adjudicate it. Settle a contested claim that plan
            code will not work with executed evidence (run a focused check or
            a load-bearing-style validator), not with opinion, and change the
            plan's code only on that evidence. A plan fix changes the plan's
            code minimally to resolve the finding's substance; never polish,
            beautify, or expand unexecuted code beyond the correction.
          - If the raw verdict is FAILED or NO_MARKER, fix, replace, simplify,
            or remove the implicated plan work as appropriate; re-run the
            writing-plans Self-Review over edited tasks, preserve the User
            Request unchanged, COMMIT focused fixes, and report `passed=false`
            so the next independent round reviews the result.
          - Before reporting the round for re-review, self-audit only the
            regions the remediation just edited: every literal, count,
            cross-reference, and inline command there must stay consistent with
            the whole artifact and with every file the fix touched. Late-loop
            findings are typically new inconsistencies introduced by remediation
            edits, not missed defects in the original work.
          - If the raw verdict is PASSED, the loop ends: it authorizes no
            further fixes and no further rounds. Reconcile every current and
            carried finding explicitly and record a final disposition for each
            without changing the plan — CLEARED only with evidence the passing
            round already reviewed, UNSUBSTANTIATED with concrete
            counter-evidence, OUT-OF-SCOPE, or (Minor and Nit findings only)
            OPTIONAL — then proceed.
          - Set logical `passed=true` only when the raw current report is PASSED
            and every substantiated current or carried finding has a valid
            final disposition.

      The 3-round cap remains bounded as a circuit breaker. If the final round
      leaves any substantiated finding unresolved, record the plan review as
      FAILED/non-converged and continue. Plan-review non-convergence is a
      footnote, not a headline failure: the recap notes it in one line, and
      the delta review — not the plan review — decides the final code's
      readiness. Never extend the loop merely to chase optional improvements.

      Cross-cutting rules (complete as stated):
      - All methods and review templates are inlined in this recipe.
        Do not load installed skills or substitute another review workflow.
      - Any subagent, reviewer, or skill you dispatch runs with an UNKNOWN
        working directory. Every dispatch prompt that touches the repo MUST
        state the repo root explicitly ({{workspace.worktree_path}}) and
        require `git -C` / path-prefixed access. Never rely on cwd.

      Return ONLY a JSON object (no prose, no fences) with exactly:
      {
        "passed": "true|false",
        "execution_blocked": "true|false",
        "verdict": "PASSED|FAILED|NO_MARKER|NOT_RUN",
        "rounds_completed": 0,
        "blocking_count": 0,
        "blocked_target": "<plan|delta|focused on failure; otherwise empty>",
        "blocker_reason": "<execution failure reason; otherwise empty>",
        "evidence_paths": [],
        "report_path": "<last completed report path; empty when NOT_RUN>",
        "summary": "<one-line findings or execution-blocker summary>"
