      The Full-Suite Gate under Execution Coordination is the one authoritative gate.
      The review method owns informed independent review; context-isolated cross-family
      Fresh Eyes remains the separate later recipe stage with separate budgets.

      Use the existing execute_result keys exactly as printed above/below. Keep
      head_sha, exact verification commands/results, ledger path, adaptations,
