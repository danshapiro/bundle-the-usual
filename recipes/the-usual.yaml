      coding for standard, reasoning for most capable and whole-branch review.
      Honor configured provider/model constraints; a role never substitutes for a
      required provider/model. Resume an implementer only when the platform supports
      it; otherwise dispatch a fresh worker with the complete handoff and retained
      round counter. Use supported native delegate calls, not external agent APIs.

      Every dispatch (including exploration, implementation, task/final/gate fixes,
      and every reviewer) starts with the complete current User Request verbatim,
