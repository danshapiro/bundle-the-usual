# v3.3.0 (2026-08-01):
#   - NEW (diagnostic config, evidence-backed on Amplifier 2026.08.01): the
#     step-runner agent now carries session.context.config
#     .output_reserve_fraction: 1.0 in its own frontmatter. This is a full
#     response-ceiling reserve -- it reserves the ENTIRE provider-reported
#     max_output_tokens (not just a fraction of it) when the context module
#     sizes its compaction budget, so an overlong response cannot overrun the
#     request window mid-turn and waste the whole round. User priority: a
#     wasted round from response overrun costs more than a smaller budget.
#     * Baseline measured (RunPod provider, current install): first-turn
#       step-runner input 16,412 tokens, no compaction across 5 turns.
#       Provider metadata: context_window=128000, max_output_tokens=16384.
#     * Effective budget arithmetic (context-simple's
#       _calculate_budget: raw = context_window - int(max_output_tokens *
#       output_reserve_fraction) - 4096 safety - 800 notice reserve):
#       at the module default (output_reserve_fraction=0.5) the derived
#       effective budget is 114,912; at 1.0 (this change) it is 106,720.
#       The ~8,192-token difference is traded for guaranteeing the full
#       output ceiling is always reserved.
#   - NEW: step-runner re-declares tool-skills in its own tools list with
#     config.visibility.enabled: false, disabling the automatic per-turn
#     skill-catalog listing injected into every tool result (module tool
#     lists deep-merge by module id onto the parent's mount, so this
#     reconfigures the already-mounted module rather than adding a second
#     instance). load_skill(name) itself remains fully available -- only the
#     every-turn full-catalog enumeration is suppressed. Rule 6 in this
#     agent's own instructions (exact-name skill loads only) is unaffected.
#   - DISCOVERABILITY: the thin behavior registers `the-usual:step-runner`
