      ## Step 1: Create Isolated Workspace

      Before either creation method, verify `worktree_path` and `logs_dir` remain beneath `repo_root`; for uncreated paths, resolve the nearest existing parent and validate remaining components. Use the common Git directory's local exclude file for the worktree area and verify Git recognizes that exclusion from the primary checkout. Initialize the new run record with the contract's shared values and pending baseline. Populate the shell variables `repo_root`, `worktree_path`, `branch`, and `base_ref` from these verified values.

      **For a new worktree, you have two mechanisms. Try them in this order.**

      ### 1a. Native Worktree Tools (preferred)

      Use a documented native worktree mechanism when it accepts the exact `worktree_path`, `branch`, and `base_ref`. It might be a tool with a name like `EnterWorktree`, `WorktreeCreate`, a `/worktree` command, or a `--worktree` flag. On success, enter the common readiness gate below.

      If no compatible native mechanism is available or it fails, investigate any partial creation before one Git fallback. Try each supported route once per failure; a later attempt requires a concrete change to its failed prerequisite. Return ambiguous partial ownership or exhausted routes as a terminal blocker to the caller.

      ### 1b. Git Worktree Fallback

      Use this fallback when Step 1a supplies no worktree and ownership is clear. Create a worktree manually using git.


      **Why critical:** Prevents accidentally committing worktree contents to repository.

      #### Create the Worktree

      ```bash
      git -C "$repo_root" worktree add "$worktree_path" -b "$branch" "$base_ref"
      ```

      ### Common Readiness Gate

      After either creation method, or matching resume, verify worktree registration and branch. A new worktree's `HEAD` must equal `base_ref`; a resume must match the reconciled record and retain valid later work. Enter `worktree_path` with a successful explicit `cd -- "$worktree_path"` before setup and every shell block below. Re-read the invoking checkout by its captured path and confirm its resolved path, branch or detached state, full `HEAD`, and exact status output are unchanged. Record any failed check and return a blocker.

      ## Step 2: Project Setup

      Follow repository instructions first and capture the pre-setup repository and environment state for baseline reproduction. Run setup and tests only inside the selected worktree. Otherwise, auto-detect and run appropriate setup:

      ```bash
      # Node.js
      if [ -f package.json ]; then npm install; fi

      # Rust
      if [ -f Cargo.toml ]; then cargo build; fi

      # Python
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      if [ -f pyproject.toml ]; then poetry install; fi

      # Go
      if [ -f go.mod ]; then go mod download; fi
      ```

      ## Step 3: Verify Clean Baseline

      Identify the repository's exact full-suite command and run it once to establish the baseline, using the Bundle Interface above. Save raw output as `baseline-full-suite.txt` under `logs_dir` (split files when large):

      ```bash
      # Use project-appropriate command
      npm test / cargo test / pytest / go test ./...
      ```

      **If tests fail:** Classify a failure as pre-existing only when the same command and failure reproduce in a clean checkout at `base_ref` with the same pre-setup repository and environment state. Record the reproduction evidence through the run contract. Repair a setup-caused failure when a safe, request-faithful repair exists; otherwise record the evidence and return a blocker.

      ### Report

      Complete the baseline ledger and record whether the worktree was created or resumed, its path, branch, immutable `base_ref`, and the green baseline, exact proven pre-existing failures, or blocker with evidence paths. Return the existing five-key workspace JSON only after readiness and baseline completion; on a blocker preserve evidence and fail the step. Recheck the captured invoking checkout after setup and tests before returning the local result to the caller.

      ## Common Rationalizations

      | Excuse | Reality |
      |--------|---------|
      | "I'm obviously not in a worktree — no need to check" | Run Step 0. Harness-created isolation and submodules both fool eyeballing; the registered-worktree list establishes the primary checkout and target separately. |
      | "`git worktree add` is quicker than hunting for a native tool" | A compatible native tool keeps the harness aware of workspace creation. Check its documented inputs first. |
      | "The worktree directory is surely ignored already" | Run `git check-ignore`. An unignored worktree directory commits the whole tree into the repo. |
      | "Any directory name works" | Run-contract naming keeps the worktree, branch, logs, and ownership record consistent. |
      | "The workspace is fresh — baseline tests can wait" | A dirty baseline makes every later failure ambiguous. Run the tests now; reproduce failures at `base_ref` to establish their origin. |

