      review artifacts. Do not interpolate dynamic recipe values into executable
      Bash source: pass data through environment bindings or quoted arguments.

      Execution Coordination is this execute-step controller; Subagent-Driven
      Development is its inline task method. A return between them is a local control
      handoff: this same controller makes the periodic/final gate decision and then
