# =============================================================================
# "the usual" — a standard development workflow, as an Amplifier recipe
# =============================================================================
#
# THIS FILE IS THE CANONICAL HOME OF THE WORKFLOW.
#
# Adopted from skill-the-usual d57367b (Superpowers v7.0.0-derived methods).
# All six methods and required companion prompts are inlined below. Named
# methods refer to recipe sections, never externally installed skills.
# Native delegate calls, recipe checkpoints, the Baseline-first SDD ledger,
# output collectors, and configured reviewer/gate settings are bundle-owned.
# EDITS TO THE WORKFLOW SHOULD BE MADE HERE; nothing synchronizes at runtime.
#
# The 7-stage workflow:
#   1. writing-plans -> write a plan
#   2. load-bearing on the plan; fix what comes up
#   3. fresheyes on the plan, fix, until PASS or 3x
#   4. executing-plans -> execute the plan
#   5. fresheyes on the delta (worktree vs original fork) until PASS or 5x; a
#      FAILED delta round's committed repairs get a focused review episode
#      (up to 5 rounds; up to 5 episodes per run)
#   6. halt on exhausted required capabilities or serious data-loss/confusion risk
#   7. else end with a per-stage recap + low-jargon summary of what was built
#
# Cross-model review is a first-class parameter here (context_depth="none" +
# provider_preferences on the delegate call), so none of fresheyes' original
# shell/setsid/PID-polling machinery is needed — the executor is Anthropic,
# the reviewer defaults to GPT.
#
