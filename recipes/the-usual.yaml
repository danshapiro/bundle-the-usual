#     run's step agents made 55-110 direct read_file calls (449-836KB into
#     their own window) vs only 2-3 delegate calls.
#   - NEW: explorer report protocol — delegated explorers write full reports
#     to {{workspace.logs_dir}}/reports/<topic>.md and return path + <=500-token
#     summary. Evidence: delegate returns totaled 23-27KB while direct reads
#     ballooned the step window until compaction fired on 96-98% of turns.
#   - CHANGED: steps now run on the bundle-local the-usual:step-runner agent
#     (minimal ~2KB definition, lean tool loadout) instead of
#     foundation:zen-architect. Evidence: zen-architect's ~132KB definition +
#     ~128KB tool schemas consumed the executor's entire ~59k-token compaction
#     budget as fixed per-request tax.
#
# v3.1.0 (2026-07-21):
#   - NEW: output-contract armor + retry-recovery protocol for slow/small-
#     context executors. Every JSON-output step now opens with a CRITICAL
#     OUTPUT CONTRACT block containing a verbatim copy of its end-of-prompt
#     JSON contract (authoritative under compaction), a progressive anchor
#     file (pending-output.json, updated as values become known), and a
#     recovery-on-retry check (verify a prior attempt's artifacts instead of
#     redoing the work when only the final JSON receipt was missing). The
#     recap step gets a light final-message reminder.
#
# v3.0.1 (2026-07-20):
#   - BUGFIX: the fresheyes reviewer instructions now self-locate the git
#     worktree under review.
#     * ROOT CAUSE: the delegated cross-model reviewer runs with
#       context_depth="none" and receives ONLY the verbatim BEGIN/END block,
#       which never stated WHERE the repository under review lives. The
#       reviewer's working directory could be the main repo (where
#       HEAD == base_ref, the fork point), so `git diff base_ref...HEAD`
#       returned an EMPTY diff and every delta review failed with "unable to
#       review". The worktree-path note sat OUTSIDE the verbatim block, so it
#       never reached the reviewer.
#     * FIX: the Step 3 (plan) and Step 5 (delta) scope sentences spliced
#       between fresheyes_reviewer_head/body now tell the reviewer the repo is
#       the worktree at {{workspace.worktree_path}}, that its cwd may differ,
#       and that every git command must use `git -C {{workspace.worktree_path}}
#       ...` and every repo file read must be under that path. The delta scope
#       adds an empty-diff sanity check (compare `git -C <wt> rev-parse HEAD`
#       to base_ref before concluding "no changes"). The misleading controller
#       note was corrected to say the reviewer cwd is NOT guaranteed to be the
#       worktree.
#     * RESULT: the reviewer targets the correct repository regardless of its
#       working directory; empty base_ref...HEAD diffs no longer fail reviews.
#
# v3.0.0 (2026-07-19):
#   - BREAKING: all personal information removed (personal names, home paths,
#     personal skill-file provenance); neutral wording throughout, author
#     metadata neutralized.
#   - NEW: review-failure recap ending — if the delta review never passed, the
#     recap ends with an unmissable warning block listing each remaining
#     blocking issue as one plain-language line, and "Suggested next steps"
#     leads with fixes instead of merging; a plan-review miss is noted in the
#     same block.
#   - NEW: Step 4 output gains total_tasks alongside tasks_completed; the
#     recap states "N of M tasks completed" and visibly flags partial
#     completion.
#   - CHANGED: the fresheyes reviewer prompt is now defined ONCE as shared
#     context variables (fresheyes_reviewer_head / fresheyes_reviewer_body),
#     spliced around each review step's scope sentence — replacing the two
#     verbatim copies in Steps 3 and 5.
#
# v2.1.0 (2026-07-19):
#   - CHANGED: residual-risk semantics. Ledger status `accepted-risk` renamed to
#     `acceptable`; the MODEL adjudicates acceptability mid-run (no deferral to
#     the user). When no path is verified, the goal is the MOST ACCEPTABLE path:
#     generate alternatives, evaluate them cheaply (verifiable alternative beats
#     unverifiable incumbent), pick the best, record alternatives + rationale in
#     the ledger, update the plan. Data-loss/corruption HALT rule unchanged and
#     takes precedence. Step 2 output field residual_risk_summary renamed to
#     acceptable_decisions; recap frames these as decisions made, not items
#     awaiting adjudication.
#   - NEW FEATURE: mandatory progress banners at long transitions (fixed
#     policy, no executor discretion): stage starts (1, 2, 4), Step 2 validator
#     wave, each fresheyes iteration (3, 5), each Step 4 task dispatch, and the
#     final whole-branch review. Quick transitions explicitly unannounced
#     (workspace setup, guards, commits, bookkeeping, recap).
#
# v2.0.0 (2026-07-19):
#   - BREAKING REDESIGN: fully self-contained. All skill content INLINED into
#     step prompts (the runtime-file-read design was rejected). The recipe is
#     now the single canonical home of the workflow; the author's personal
#     skill files were the one-time source.
#     * Step 1 carries the complete writing-plans methodology (incl. Self-Review
#       item 1b), minus the Execution Handoff (the recipe fixes the path).
#     * Step 2 carries the complete load-bearing methodology + the three
#       verbatim subagent prompt templates (finder/strategist/validator).
#     * Steps 3/5 carry the complete fresheyes reviewer prompt verbatim with
#       the review scope pre-substituted (plan / base_ref...HEAD delta).
#     * Step 4 carries executing-plans + the full subagent-driven-development
#       methodology, both dispatch prompt templates verbatim, and the logic of
#       scripts/task-brief and scripts/review-package as inline bash.
#
# v1.0.0 (2026-07-18):
#   - Initial port using runtime reads of personal skill files (superseded).
#
# =============================================================================
# RUN CONTRACT (author-facing; ported from skill-the-usual 86377ed, adapted)
# =============================================================================
#
# Comments here are stripped before prompts reach agents, so this section is
# the AUTHOR contract: the durable invariants every step change must preserve.
# Agent-facing enforcement lives in step prompts; there is no automated
# tripwire cross-checking them against this comment block, so treat edits to
# either as changes to the same contract and update both together.
#
# Durable record and layout (adapter: the recipes engine's checkpointing owns
# interruption state; this contract deliberately does not duplicate it):
# - Progress ledger: `$(git -C <worktree> rev-parse --git-path sdd)/progress.md`
#   — inside the worktree's git dir: unique per repo instance, never in a diff.
#   FIRST block is the Baseline entry (schema: time, base commit == base_ref,
#   exact baseline command, exit status, result, enumerated pre-existing
#   failures or `none`, evidence path). It defines what "pre-existing" means
#   for the whole run; never rewrite or backfill it.
# - Logs: {{workspace.logs_dir}} = <repo>/.worktrees/.the-usual-logs/<slug>/ —
#   outside the tracked tree; receipts, reports, review logs, recap.md, and
#   the stage-timing log.
# - Stage timing: {{workspace.logs_dir}}/stage-timing.txt — append-only
#   `<stage> started|completed <ISO-8601 UTC>` lines per numbered stage;
#   `started` is never rewritten on retry/recovery. The recap renders these
#   into its Results table.
# - Compaction anchors: per-run /tmp/the-usual-pending-output.{{session.id}}.json
#   plus the logs-side result files the collect steps validate.
#
# Resume reconciliation (ported from skill-the-usual 5383bd4, adapted): on any
# retry, resume, or post-compaction recovery, the durable artifacts — git
# history, the progress ledger, the logs and receipts under logs_dir,
# stage-timing.txt — are authoritative, and recovered context (pending-output
# anchors, todos, loop flags, recollection) is only a cache of it. Steps
# reconcile the cache against the artifacts, correcting the cache and never
# the artifacts, before continuing: an interrupted run can leave context
# claiming progress the artifacts disprove. Agent-facing copies live in each
# step's RECOVERY block.
#
# base_ref invariance: base_ref is the full SHA captured in Step 0 before any
# run commit; it never changes. The final delta review diffs base_ref...HEAD,
# never a moving branch name.
#
# Blocker resolution rule (agent-facing copy lives in the execute-plan step):
# every substantiated finding stays binding until it reaches a valid final
# disposition; Critical/Important clear by fix or simplification plus re-review,
# while Minor/Nit may take the OPTIONAL route; suggested remedies are advisory;
# corrections stay proportionate (KISS/YAGNI) and inside plan/spec scope; a
# finding is never resolved by editing the finding.
#
# Guidance for authors:
# - HARD STOP and QUESTION sentences are load-bearing text; this recipe has
#   no mid-run QUESTION kind by design — halts surface to the parent via the
#   *-halt-guard steps.
# - Never weaken a load-bearing stop/question sentence just to make a change
#   easier; either the wording must be preserved, or the behavior is
#   genuinely changing and needs its own changelog entry.
# - Prohibitions are already-resolved autonomous rules; do not convert them
#   into runtime questions.
#
# =============================================================================

name: "the-usual"
description: "A standard dev workflow, fully self-contained: plan -> load-bearing -> fresheyes(plan, <=3x) -> execute (subagent-driven) -> fresheyes(delta, <=5x, with focused repair-review episodes after failed rounds) -> recap. All methodology is inlined in this file; this recipe is the canonical home."
version: "3.20.0"
author: "recipes:recipe-author"
tags: ["workflow", "planning", "tdd", "code-review", "fresheyes", "load-bearing"]

context:
  # ---- Required inputs -------------------------------------------------------
  task: ""            # REQUIRED: sanitized non-authoritative initial provenance, a safe specification locator, or a self-contained sanitized direct-invocation fallback.
  repo_path: ""       # REQUIRED: absolute path to the target git repository.

  # ---- Optional current intent -----------------------------------------------
  user_request: ""    # OPTIONAL: complete sanitized Markdown block supplied by the parent; when present it is authoritative over task.

  # ---- Optional inputs (cross-model reviewer; must differ from executor) ------
  reviewer_provider: "openai"   # executor is Anthropic -> reviewer defaults to a different family (GPT)
  reviewer_model: "gpt-6-sol"   # GPT-6 Sol; a glob such as "gpt-*" also works
  reviewer_reasoning_effort: "xhigh"  # passed to the reviewer provider as its `reasoning_effort` config key; "" omits it

  # ---- Full-suite gate interval (periodic trigger during execution) -----------
  full_suite_commits: "10"      # run the full-suite gate at the next task boundary once this many commits (excluding docs/plans/) have landed since the last gate

  # ---- Loop-state flags (managed via update_context; do not set at runtime) ---
  plan_passed: "false"          # set true when the plan clears fresheyes
  delta_passed: "false"         # set true when the delta clears fresheyes
  plan_execution_blocked: "false"
  delta_execution_blocked: "false"

  # ---- Shared scope rule (single canonical definition) ------------------------
  # Every step below splices this in verbatim, then continues with its own
  # role-specific application sentence.
  scope_rule: |-
    Use the current User Request as the definition of need. Choose the simplest
    complete plan or remedy that delivers its requested result and explicit
    constraints. When new machinery is not necessary to satisfy the User
    Request, omit or simplify it rather than expanding or hardening it.
    Preserve pre-existing code and behavior unless changing them is necessary
    to satisfy the User Request or clear a substantiated blocker to it.

    A reviewer's suggested remedy is advisory; the finding itself is what must
    be resolved.

    Every substantiated finding is binding: the run may not report success
    until it reaches a valid final disposition. Binding never requires a fix.

    - CLEARED — fixed, with evidence: corrected, or replaced, simplified, or
      removed so the finding no longer applies.
    - UNSUBSTANTIATED — the assessment finds the finding wrong, with the reason
      recorded.
    - OUT-OF-SCOPE — available to Major, Minor, and Nit findings. The finding
      does not block the Requested result or an Explicit constraint. Record a
      one-line reason; the recap lists it as a suggestion.
    - OPTIONAL — available only to Minor and Nit findings. Probably a real
      improvement, but nothing requires it: the finding is in scope but not of
      sufficient importance. Record a two-sentence reason: one sentence says
      why it would improve the work, one says why it is not required. The
      recap lists it; it never blocks anything and may be acted on at any time
      or never. If a finding could be read as OUT-OF-SCOPE or OPTIONAL, choose
      OUT-OF-SCOPE.

    KISS governs how the User Request is satisfied, and YAGNI limits new work
    to capabilities required by the User Request.

  # ---- Shared turn-economy policy (single canonical definition) ---------------
  # Every step below splices this in verbatim immediately after the scope rule;
  # the two fresheyes reviewer packets receive it inside the BEGIN/END reviewer
  # instruction, after the CURRENT USER REQUEST block and ahead of the reviewer
  # body. Batching changes scheduling only.
  turn_economy: |-
    Turn economy changes scheduling only: preserve every call, instruction,
    output, acceptance criterion, evidence item, required order, and gate. This
    policy is a fixed safety boundary; apply it as written.

    - INDEPENDENCE: Put ready independent calls in the same tool-call response
      only after confirming all inputs are known, no call needs another's
      result, and no call can change state another reads or writes. Treat
      uncertain independence as a dependency.
    - SAFE REPORT FAN-OUT: Calls that only read shared state may batch. Each may
      also write only to its own predeclared, disjoint report path — one per
      topic under the run's reports directory — after shared directory setup. A
      shared ledger, anchor, receipt, index, Git state, or other shared artifact
      is not a disjoint report.
    - MUTATION BOUNDARY: Run mutations of one worktree one at a time: one
      mutating delegate per worktree at any moment. Parallel mutators require
      isolated worktrees with independent Git state and disjoint external
      targets. Calls are dependent when either can change state the other reads
      or writes. A mutating delegate without a bounded write scope owns its
      whole worktree.
    - CALL BOUNDARY: A batch combines scheduling only. Each call keeps its own
      instruction, scope, output, acceptance criteria, and evidence; do not
      widen or merge calls merely to reduce turns. Attribute every result to
      the call that produced it.
    - JOIN: After a batch finishes, account for every result before any
      downstream action that depends on those results, including synthesis,
      repair, review, commit, or another gate.
    - DURABILITY: Record each result in the run's durable record — the ledgers
      and logs under the run's logs directory — in the first response after the
      result lands and before reading any full report; then read only the
      sections needed. Put ready independent bookkeeping in the same tool-call
      response; never defer it to a phase-end sweep.
    - REVIEW: Preserve each review's specified exact instruction, context
      isolation, and provider/model settings; wait for its verdict before
      dependent repair. When a batching assumption proves wrong or a boundary
      is violated, tighten: isolate the affected calls and run them one at a
      time.

  # ---- Shared fresheyes reviewer prompt (single canonical definition) ---------
  # Steps 3 and 5 splice these around their own scope sentence; the delegated
  # reviewer receives head + scope + body as its ENTIRE instruction.
  fresheyes_reviewer_head: |-
    You are a detailed, thorough, patient senior engineer who is performing a detailed review of a less capable engineer's work. Assume nothing, take nothing for granted.

    Do not invoke or load any skills, plugins, subprocess reviewers, secondary agents, or review wrappers.

    ### What to Review
  fresheyes_reviewer_body: |-
    ### Context Gathering

    - Read relevant repository files (e.g., AGENTS.md, README.md, related source files) for context.
    - Examine the code structure and patterns used in the codebase
    - Understand the purpose and intent of the changes
    - You may inspect the repo with read-only git commands: git diff, git status -sb, git show, git log
    - Err on the side of more research rather than less
    - Any time you see an open question, go back and research further
    - You may search the web for documentation, substantiation, or any other purpose
    - Shell commands must be bounded. Use `timeout 300s` around any command that could take a while.
    - Do NOT modify files
    - Do NOT run git commit/push/rebase, change branches, or apply patches

    ### Review For

    Review for ANYTHING that is wrong. This includes but is not limited to:
    - Architectural inconsistencies or patterns that are non-idiomatic for the language or codebase.
    - Correctness bugs and logic errors
    - Missing edge cases
    - Misuse of frameworks/APIs
    - Security issues (injection, XSS, auth bypasses, etc.)
    - Performance pitfalls
    - Inconsistent error handling/logging
    - Missing or obviously wrong tests
    - Code that doesn't match its stated purpose
    Focus on finding the most severe problems you can - the more 'critical' and 'major' problems you discover, the better.

    ### Default Assumptions

    Unless the request states otherwise, the system under review has excellent observability — clear, diagnosable logging of behavior and failures — and zero auditability requirement: the absence of an audit trail or compliance-grade logging is not a finding.

    ### For Commits/Changes

    - Validate that the commit message accurately describes what the changes actually do
    - The message should not claim changes that aren't present, and should not omit significant changes
    - Look for stray files that might be included that shouldn't have been
    - A vague commit message (e.g., "fix bug") without detail is a major issue

    ### Implementation Plans and Runbooks

    When reviewing a plan, runbook, proposed patch sequence, test design, or docs change that tells another agent how to implement or verify work:

    - Treat it as executable behavior, not prose-only documentation.
    - A step that would fail as written, makes a later `Expected: PASS` unachievable, references missing variables/files/artifacts, contradicts current repository behavior, or has a command/assertion mismatch is at least **major** and blocking.
    - A proposed test or verifier that would fail for the wrong reason, pass vacuously, or fail to check the property it claims to prove is at least **major** and blocking when the plan relies on it as a verification gate.
    - Do not downgrade an executable plan defect because TDD, CI, a future implementer, or a careful reader might notice and fix it later.
    - Passing a plan review is appropriate only when remaining issues are optional refinements that do not change whether the plan can be executed and verified as written.
    - Code and patch listings in such a document are pre-implementation drafts: their presence is not a defect, and the review must not demand greater code-level detail than the document shows. Judge what is present, not what could be added.
    - Treat a code-level finding in such a document as critical or major only when the shown code cannot work as written, contradicts repository reality, violates the CURRENT USER REQUEST supplied with this review or an explicit constraint in the document, or breaks an interface a later step consumes. Report other code-level observations as minor or nit; execution and its tests adjudicate them.

    ### Related Tests

    Using static analysis only (do NOT run tests), determine:
    - Does this change appropriately update existing tests if the changes affect tested behavior?
    - Does it create new tests as it should, if adding testable functionality?
    - Or do the changes not impact existing test coverage?
    - Flag as blocking if tests should have been updated/added but weren't

    ### Bounded Read Fan-Out

    - Put ready independent inspection calls in the same response: reads of
      different files and read-only Git commands are independent when neither
      needs the other's result and neither can change state the other reads.
      Treat uncertain independence as a dependency and run those calls one at a
      time.
    - Keep reads bounded to what the claim under test needs instead of reading
      whole files or reports by reflex.
    - Account for every returned result, and attribute each conclusion to the
      reads that support it, before drawing any conclusion that depends on
      those results.

    ### Classification

    Rate each issue:
    - **critical**: Security vulnerabilities, data loss, crashes
    - **major**: Bugs, significant logic errors, missing error handling, or executable plan/test steps that cannot pass as written
    - **minor**: Code quality issues, potential edge cases
    - **nit**: Style, naming, minor improvements

    ### Unable to Review

    If you cannot perform the review, you MUST fail. Examples:
    - No changes found (no staged changes, empty diff, no commit to review)
    - Referenced files are missing or unreadable
    - The scope description can't be evaluated with what's in the repository
    - Any other condition that prevents a meaningful review

    Do not pass a review you could not actually perform.

    ### Blocking Decision

    Decide whether there are blocking issues. **Anything that isn't minor or a nit is blocking.** A significant mismatch between the commit message and the actual changes IS a blocking issue.

    ### Guidelines

    - If unsure, err on the side of flagging as blocking
    - A commit message that is vague but not wrong (e.g., "fix bug") is blocking
    - A commit message that claims something not done, or omits major changes, is blocking
    - Consider the full context of the repository, not just the changed lines
    - Be thorough but concise in your explanations

    ### Output

    List all files you examined, then report your findings:

    ```
    ## Files Examined
    - [list each file you read/examined]

    ## Issues Found
    [For each issue:]
    - **[severity]** `file:line` - description

    ## Summary
    [Brief summary of findings]

    ---
    **INDEPENDENT CODE REVIEW [PASSED/FAILED]**
    ```

    Use **PASSED** if no blocking issues found (only cosmetic/nit issues or no issues). When you mark a review **PASSED**, add a short note that if the invoking agent was instructed to iterate with Fresh Eyes, it should stop iterating because only minor/nit issues remain; Fresh Eyes may keep finding small improvements if asked to continue, so the goal is not to iterate until there is nothing left.
    Use **FAILED** if any blocking issues exist. Anything that isn't cosmetic or a nit is blocking.

steps:
  # ===========================================================================
  # STEP 0 — Workspace: isolated git worktree + record the "original fork" ref
  #
  # The workspace method is inlined; no installed skill is loaded.
  # ===========================================================================
  - id: "workspace-setup"
    # The agent that executes this step's instructions (this stage's worker).
    agent: "the-usual:step-runner"
    timeout: 864000
    output: "workspace"
    parse_json: true
    prompt: |
      CRITICAL OUTPUT CONTRACT — read first. Your FINAL message must contain
      exactly the JSON block specified below — this is a verbatim copy of
      the contract in the "Then return ONLY a JSON object" section at the
      end of these instructions, and it is authoritative even if everything
      below it has been compacted out of your context. Work is judged failed
      without it, regardless of quality.

      Then return ONLY a JSON object (no prose, no markdown fences) with exactly:
      {
        "worktree_path": "<absolute path to the worktree working tree>",
        "branch": "<branch name checked out in the worktree>",
        "base_ref": "<the recorded original-fork commit SHA>",
        "slug": "<the feature slug>",
        "logs_dir": "<absolute path to the logs directory you created>"
      }

      Because your context may be compacted during this long task:
      (a) ANCHOR — as your FIRST action, read any existing anchor before
          writing; preserve non-placeholder values on recovery. Initialize this
          JSON skeleton only when no anchor exists at /tmp/the-usual-pending-output.{{session.id}}.json
          (this step creates the logs dir, so anchor in /tmp; the
          session-scoped filename keeps concurrent and consecutive runs from
          ever sharing one anchor file) and add a todo item "FINAL
          ACT: emit completed output JSON as my last message". Then UPDATE that
          file throughout the step as real values become known (e.g. write
          worktree_path and branch as soon as the worktree exists, base_ref as
          soon as it is recorded), so at any moment it reflects your best-known
          values.
      (b) RECOVERY — immediately after the anchor setup, BEFORE starting
          work, check whether /tmp/the-usual-pending-output.{{session.id}}.json
          already exists with non-placeholder values, and inspect the
          workspace for a previous
          attempt's artifacts: resolve the target common Git directory and
          registered primary checkout independently, then inspect its
          .worktrees/ and .worktrees/.the-usual-logs/ directories. If a previous attempt
          substantially completed the work, VERIFY its artifacts rather than
          redoing them, complete whatever is missing, and emit the contract
          JSON. A prior attempt's work counts — only its missing receipt failed
          it. The artifacts are authoritative over the anchor and your
          recollection: on any disagreement, correct the anchor to match them
          — never rewrite or fabricate artifacts to fit it.
      (c) FINISH — when your work is done, read that file back, fill in real
          values, and make the completed JSON your final message.

      ## Bundle Interface

      Inputs are target `{{repo_path}}`, sanitized initial provenance `{{task}}`,
      and the parent-authored current User Request below. The parent has already
      confirmed any greenfield target under the invocation contract. Bootstrap only
      that confirmed empty target; return ambiguity to the parent. For direct invocation
      without a supplied request, use only a self-contained sanitized task or safe
      specification locator; return a blocker for missing conversation referents.

      ---------- BEGIN SUPPLIED USER REQUEST ----------
      {{user_request}}
      ---------- END SUPPLIED USER REQUEST ----------

      Here the run contract means the recipe checkpoint, existing workspace output
      and session anchor, Git history, and baseline-first SDD ledger. Derive a short
      kebab-case `slug`; use `<repo_root>/.worktrees/<slug>/`, branch
      `the-usual/<slug>`, and logs `<repo_root>/.worktrees/.the-usual-logs/<slug>/`.
      For unrelated collisions use the same numeric suffix in all three names;
      preserve unrelated work. Reconcile the checkpoint's sanitized task and the
      anchor's five workspace values against Git registration, recorded commits,
      and artifact paths before reuse. Derive the common directory and primary root
      from the recorded Git paths; ownership ambiguity is a blocker. Preserve the
      invoking checkout and never implement on main/master.

      Before creation, retain the verified five workspace values in the existing
      session anchor; the recipe checkpoint supplies the run's input ownership.
      After creation, resolve the SDD directory with
      `git -C <worktree_path> rev-parse --git-path sdd` (resolve a relative result
      against that worktree), and create `progress.md` there. Its FIRST block is:

      ## Baseline (recorded at workspace setup)
      - time: <ISO 8601>
      - base commit: <the same full SHA as base_ref>
      - command: <the exact baseline full-suite command>
      - exit status: <integer>
      - result: <observed summary>
      - pre-existing failures: none | <the complete enumerated list of failing tests>
      - evidence: <path to the raw baseline report under logs_dir>

      Initialize observations as pending, then replace them with observed evidence
      before setup completes. A matching resume preserves the original completed
      baseline and valid later work; never rewrite or backfill it. Record later
      base_ref reproduction receipts as append-only ledger entries, referring to the
      original baseline without changing it. A failure is pre-existing only with the
      same command and failure reproduced in a clean checkout at immutable base_ref
      with the same pre-setup repository and environment state. Preserve this ledger
      for all later task progress. An absent completed baseline on resume is a blocker,
      not permission to invent one from the current HEAD. Keep reports under
      `logs_dir/reports`; preserve receipts and exhausted-route diagnostics on resume.

      Every delegation uses Amplifier `delegate` with `context_depth="none"` and an
      explicit `model_role` (fast, coding, or reasoning). Include the complete current
      User Request, then both policies below verbatim, the bounded assignment, absolute
      repository path, and evidence/result contract. Require explicit `git -C` or a
      successful explicit `cd` for all repository commands.

      ## Scope Policy

      {{scope_rule}}

      ## Turn Economy

      {{turn_economy}}

      # Using Git Worktrees

      > Handle routine, reversible decisions without stopping. A blocker is a problem
      > that remains after reasonable investigation and safe alternatives leave no
      > way to complete this stage as requested. Record the blocker and return it to
      > the dispatcher. User contact belongs to the dispatcher and is reserved for
      > situations where continuing risks data loss, environmental corruption,
      > security or privacy harm, large unexpected cost, or comparable serious
      > damage.

      ## Overview

      Ensure work happens in an isolated workspace. Prefer your platform's compatible native worktree tools. Fall back to manual git worktrees when no compatible native tool succeeds.

      **Core principle:** Detect matching isolation first. Then use native tools. Then fall back to git. Never fight the harness.

      Workspace setup uses the recipe's existing no-banner contract.

      ## Step 0: Detect Existing Isolation

      **Before creating anything, check if you are already in a matching isolated workspace.**

      Accept the sanitized `task` and named target repository, defaulting to the repository containing the current directory. Follow the current `## User Request`; use `task` only as initial background. Check each workspace choice, setup, test, fix, and fallback against that request and choose the simplest complete action. Use repository instructions as supporting evidence. Consume shared values, naming, records, and baseline evidence through [Bundle Interface](#bundle-interface).

